<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gut Check GI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c16;--bg2:rgba(255,255,255,.035);--bg3:rgba(255,255,255,.06);
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);
  --t1:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
  --ac:#6366f1;--ac2:#a855f7;--green:#10b981;--red:#ef4444;--orange:#f97316;
  --glow:0 0 20px rgba(99,102,241,.15);
}
body.light{
  --bg:#f1f5f9;--bg2:#ffffff;--bg3:#f8fafc;
  --bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.12);
  --t1:#1e293b;--t2:#475569;--t3:#94a3b8;
  --glow:0 0 20px rgba(99,102,241,.08);
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12)}

/* Buttons */
.btn{padding:11px 22px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--glow)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-o{background:transparent;border:1px solid var(--bd2);color:var(--t1)}
.btn-o:hover:not(:disabled){background:var(--bg3);border-color:var(--ac)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:7px}

/* Cards */
.card{padding:16px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd);transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:rgba(99,102,241,.2);box-shadow:var(--glow)}
.card-flat{padding:16px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd)}

/* Inputs */
input,select{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--bd2);background:var(--bg3);color:var(--t1);font-size:14px;font-family:inherit;margin-bottom:10px;transition:border-color .2s}
input:focus,select:focus{outline:none;border-color:var(--ac)}
select option{background:var(--bg)}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:600;background:rgba(99,102,241,.1);color:#a5b4fc;margin-right:4px;letter-spacing:.3px}

/* Toasts */
.toast-wrap{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast-item{padding:10px 16px;border-radius:10px;background:rgba(15,23,42,.92);border:1px solid var(--bd2);font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toastIn .3s ease;backdrop-filter:blur(12px)}
body.light .toast-item{background:rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(0,0,0,.1)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Layout */
.layout{display:flex;min-height:100vh}
.sb{width:250px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:6px;z-index:50}
.main{margin-left:250px;flex:1;padding:24px;max-width:820px}

/* Sidebar items */
.sb-btn{width:100%;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--t2);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;text-align:left;transition:all .15s;display:flex;align-items:center;gap:6px}
.sb-btn:hover{background:var(--bg3);color:var(--t1)}
.sb-btn.active{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.2);color:var(--t1)}
.topic-item{padding:5px 8px;border-radius:5px;cursor:pointer;font-size:11px;color:var(--t2);display:flex;align-items:center;gap:6px;transition:all .15s;border:1px solid transparent}
.topic-item:hover{background:rgba(99,102,241,.05);color:var(--t1)}
.topic-item.active{border-color:var(--ac);background:rgba(99,102,241,.08);color:var(--t1)}

/* XP Bar */
.xp-bar{position:relative;height:24px;background:var(--bd);border-radius:12px;overflow:hidden}
.xp-fill{height:100%;border-radius:12px;background:linear-gradient(90deg,#06b6d4,var(--green));transition:width .6s ease}
.xp-text{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.3)}

/* Section cards */
.sec-card{padding:14px;border-radius:10px;background:var(--bg2);border:1px solid var(--bd);margin-bottom:10px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.sec-card:hover{border-color:rgba(99,102,241,.25)}
.sec-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.sec-hdr{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.sec-bullet{padding:4px 0 4px 16px;font-size:12px;line-height:1.65;color:var(--t2);position:relative}
.sec-bullet::before{content:'•';position:absolute;left:2px;color:var(--t3)}

/* Quiz options */
.qopt{padding:10px 14px;border-radius:8px;border:1px solid var(--bd);margin-bottom:5px;cursor:pointer;font-size:12.5px;line-height:1.5;color:var(--t2);transition:all .15s}
.qopt:hover:not(.locked){border-color:rgba(99,102,241,.3);color:var(--t1)}
.qopt.selected{border-color:var(--ac);background:rgba(99,102,241,.1);color:var(--t1)}
.qopt.correct{border-color:var(--green);background:rgba(16,185,129,.08);color:var(--green)}
.qopt.wrong{border-color:var(--red);background:rgba(239,68,68,.08);color:var(--red)}
.rationale{margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(99,102,241,.05);font-size:11.5px;line-height:1.6;color:var(--t2);border-left:3px solid var(--ac)}

/* Flash cards */
.flash{padding:14px;border-radius:10px;background:var(--bg2);border:1px solid var(--bd);margin-bottom:8px;cursor:pointer;transition:all .2s}
.flash:hover{border-color:rgba(99,102,241,.2)}
.flash-q{font-size:12.5px;font-weight:600;line-height:1.5}
.flash-a{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);color:var(--t2);font-size:12px;line-height:1.6;animation:fadeIn .25s ease}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);animation:fadeIn .2s ease}
.modal{max-width:460px;width:100%;max-height:80vh;overflow-y:auto;border-radius:16px;background:var(--bg2);border:1px solid var(--bd2);padding:24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
body.light .modal{background:#fff}
.close-x{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.close-x:hover{background:var(--bg3)}

/* Progress bar */
.prog{width:100%;height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:18px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}

/* Stats */
.stat{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--bd)}
.stat:last-child{border-bottom:none}

/* Typography */
h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:800}
h2{font-size:17px;font-weight:700}
.gradient-text{background:linear-gradient(135deg,#c7d2fe,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.big-num{font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dot{width:6px;height:6px;border-radius:3px;flex-shrink:0}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.anim-in{animation:slideUp .35s ease}

/* Mobile */
.mob-hdr{display:none;position:fixed;top:0;left:0;right:0;height:50px;background:var(--bg2);border-bottom:1px solid var(--bd);z-index:99;padding:0 14px;align-items:center;justify-content:space-between;backdrop-filter:blur(12px)}
.mob-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;animation:fadeIn .2s ease}
.sb.open{display:flex!important;position:fixed;z-index:101}
@media(max-width:768px){
  .sb{display:none}
  .main{margin-left:0;padding:16px;padding-top:60px}
  .mob-hdr{display:flex!important}
  .grid{grid-template-columns:1fr}
}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div><div style="font-size:13px;color:var(--t3)">Loading Gut Check GI...</div></div></div>
<div class="toast-wrap" id="toasts"></div>
<script>
/* ============================================================
   GUT CHECK GI — Gamified GI Education Platform
   Loads data.json at runtime for all topic/quiz/assessment content
   ============================================================ */

// ── Constants ──
const SK="gcGI7";
const CLR=["#6366f1","#a855f7","#ec4899","#f97316","#14b8a6","#3b82f6","#8b5cf6","#ef4444","#10b981","#f59e0b"];
const LVL=[
  {l:1,n:"Intern",x:0},{l:2,n:"Rookie",x:500},{l:3,n:"Resident",x:1200},
  {l:4,n:"PPI Pro",x:2500},{l:5,n:"Scope Jockey",x:4500},{l:6,n:"Varices Vet",x:7500},
  {l:7,n:"ERCP Navigator",x:11500},{l:8,n:"Hep Hawk",x:17000},
  {l:9,n:"Attending",x:24000},{l:10,n:"Luminal Lord",x:35000}
];
const BDG=[
  {id:"s3",n:"3-Day Streak",e:"🔥"},{id:"s5",n:"5-Day Streak",e:"⚡"},
  {id:"s7",n:"7-Day Streak",e:"💪"},{id:"q10",n:"10 Questions",e:"📝"},
  {id:"q20",n:"20 Questions",e:"📚"},{id:"q40",n:"40 Questions",e:"🧠"},
  {id:"t5",n:"5 Topics",e:"📖"},{id:"t10",n:"10 Topics",e:"🗺️"},
  {id:"t15",n:"15 Topics",e:"🌟"},{id:"all",n:"All Topics",e:"👑"},
  {id:"pre",n:"Pre-Test",e:"📋"},{id:"pst",n:"Post-Test",e:"🏆"},
  {id:"m20",n:"20 Cards Flipped",e:"🃏"},{id:"m40",n:"40 Cards Flipped",e:"✨"},
  {id:"imp",n:"Improved Score",e:"📈"}
];
const PGY=["MS-3","MS-4","PGY-1","PGY-2","PGY-3","GI Fellow","Attending","APP/NP/PA","Other"];
const SM={
  panic_card:{i:"🚨",l:"Panic Card",c:"#ef4444"},
  brief_overview:{i:"📋",l:"Brief Overview",c:"#a855f7"},
  icu_consult_triggers:{i:"🏥",l:"ICU Consult Triggers",c:"#f97316"},
  orders_to_place_now:{i:"📝",l:"Orders to Place Now",c:"#3b82f6"},
  cdi:{i:"📄",l:"CDI Documentation",c:"#14b8a6"}
};

// ── Helpers ──
const gL=x=>{for(let i=LVL.length-1;i>=0;i--)if(x>=LVL[i].x)return LVL[i];return LVL[0]};
const nL=x=>LVL.find(l=>l.x>x)||null;
const td=()=>new Date().toISOString().slice(0,10);
const el=id=>document.getElementById(id);
const esc=s=>s.replace(/</g,'&lt;').replace(/>/g,'&gt;');

function gD(){return{un:"",pgy:"",ob:false,pre:{d:false,sk:false,a:{},s:0,pt:{}},post:{d:false,a:{},s:0,pt:{}},xp:0,co:0,st:{c:0,la:null},bg:[],op:[],qa:{},mf:[],sv:{},td:{},th:"dark",dy:[]}}
const lo=()=>{try{const s=localStorage.getItem(SK);return s?{...gD(),...JSON.parse(s)}:gD()}catch{return gD()}};
const sa=s=>{try{localStorage.setItem(SK,JSON.stringify(s))}catch{}};

// ── State ──
let T=[],PRE=[],POST=[];
let S=lo(),toasts=[];
let view="home",curTopic=null,modal=null,mobOpen=false;
let aq=0,asel=null,aans={};
let flipped={},qrev={},qsel={};
let expandedSections={};

// ── Toast ──
function toast(m,e="✨"){const id=Date.now();toasts.push({id,m,e});renderToasts();setTimeout(()=>{toasts=toasts.filter(x=>x.id!==id);renderToasts()},2800)}
function renderToasts(){const c=el('toasts');if(!c)return;c.innerHTML=toasts.map(t=>`<div class="toast-item">${t.e} ${t.m}</div>`).join('')}

// ── State updates ──
function upd(fn){if(typeof fn==='function')S=fn(S);else S={...S,...fn};sa(S);render()}
function axp(b){const m=S.st.c>=7?2.5:S.st.c>=5?2:S.st.c>=3?1.5:1;const earned=Math.round(b*m);upd(s=>({...s,xp:s.xp+earned,co:s.co+Math.round(earned/8)}))}

// ── Badge checking ──
function cBdg(){
  const nb=[];
  BDG.forEach(b=>{
    if(S.bg.includes(b.id))return;
    let e=false;
    const qc=Object.keys(S.qa).length, mc=(S.mf||[]).length;
    const tc=Object.values(S.td).filter(Boolean).length;
    if(b.id==="s3")e=S.st.c>=3;
    else if(b.id==="s5")e=S.st.c>=5;
    else if(b.id==="s7")e=S.st.c>=7;
    else if(b.id==="q10")e=qc>=10;
    else if(b.id==="q20")e=qc>=20;
    else if(b.id==="q40")e=qc>=40;
    else if(b.id==="t5")e=S.op.length>=5;
    else if(b.id==="t10")e=S.op.length>=10;
    else if(b.id==="t15")e=S.op.length>=15;
    else if(b.id==="all")e=tc>=T.length&&T.length>0;
    else if(b.id==="pre")e=S.pre.d;
    else if(b.id==="pst")e=S.post.d;
    else if(b.id==="m20")e=mc>=20;
    else if(b.id==="m40")e=mc>=40;
    else if(b.id==="imp")e=S.pre.d&&S.post.d&&S.post.s>S.pre.s;
    if(e)nb.push(b.id);
  });
  if(nb.length){upd(s=>({...s,bg:[...new Set([...s.bg,...nb])]}));nb.forEach(id=>{const b=BDG.find(x=>x.id===id);if(b)toast("Badge Earned: "+b.n,b.e)})}
}

// ── Topic completion check ──
function chkDone(s,ti){
  const td={...(s.td||{})};
  const sv=(s.sv||{})[ti]||[];
  const t=T.find(x=>x.i===ti);if(!t)return s;
  const aqc=Object.keys(s.qa||{}).filter(k=>k.startsWith(ti+"Q")).length;
  const mfc=(s.mf||[]).filter(m=>m.startsWith(ti+"M")).length;
  let met=0;
  if(s.op.includes(ti))met++;
  if(sv.length>=3)met++;
  if((t.q||[]).length>0&&aqc>=(t.q||[]).length)met++;
  if((t.m||[]).length>0&&mfc>=(t.m||[]).length)met++;
  const was=td[ti];
  td[ti]=met>=3;
  if(!was&&td[ti])toast("Topic Complete!","🎉");
  return{...s,td};
}

// ── Init streak ──
function initStreak(){
  const t=td();
  if(!S.dy)S.dy=[];
  if(!S.dy.includes(t))S.dy=[...S.dy,t];
  const y=new Date();y.setDate(y.getDate()-1);
  const ys=y.toISOString().slice(0,10);
  if(S.st.la===ys)S.st={c:S.st.c+1,la:t};
  else if(S.st.la!==t)S.st={c:1,la:t};
  sa(S);
}

// ── RENDER ──
function render(){
  if(S.th==="light")document.body.classList.add('light');else document.body.classList.remove('light');
  const lv=gL(S.xp),nx=nL(S.xp),xpP=nx?Math.min(100,((S.xp-lv.x)/(nx.x-lv.x))*100):100;
  const cc=Object.values(S.td).filter(Boolean).length,pu=cc>=16;
  const app=el('app');

  // ── ONBOARDING ──
  if(!S.ob){
    app.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">
    <div class="card anim-in" style="max-width:420px;width:100%;text-align:center;padding:36px">
      <div style="font-size:52px;margin-bottom:4px">🩺</div>
      <h1 class="gradient-text" style="font-size:28px;margin-bottom:2px">Gut Check GI</h1>
      <p style="color:var(--t3);font-size:13px;margin-bottom:24px">Your GI Rotation Survival Guide</p>
      <input id="ob-name" placeholder="First name" maxlength="20">
      <select id="ob-pgy"><option value="">Select your level</option>${PGY.map(p=>`<option>${p}</option>`).join('')}</select>
      <button class="btn" style="width:100%;margin-top:6px;margin-bottom:8px" id="ob-start">Begin Pre-Test →</button>
      <button class="btn btn-o" style="width:100%" id="ob-skip">Skip Pre-Test →</button>
      <p style="font-size:10px;color:var(--t3);margin-top:14px">${T.length} topics · ${T.reduce((a,t)=>a+(t.q||[]).length,0)} ABIM-style questions · Gamified learning</p>
    </div></div>`;
    el('ob-start').onclick=()=>{const n=el('ob-name').value.trim(),p=el('ob-pgy').value;if(!n||!p){toast("Please fill in both fields","⚠️");return}upd({un:n,pgy:p,ob:true});aq=0;aans={};asel=null;view="pretest";render()};
    el('ob-skip').onclick=()=>{const n=el('ob-name').value.trim()||"Learner",p=el('ob-pgy').value||"PGY-1";upd({un:n,pgy:p,ob:true,pre:{...gD().pre,sk:true}});view="home";render()};
    return;
  }

  // ── ASSESSMENT (pre/post test) ──
  if((view==="pretest"&&!S.pre.d&&!S.pre.sk)||(view==="posttest"&&!S.post.d)){
    const qs=view==="pretest"?PRE:POST;
    const ty=view==="pretest"?"pre":"post";
    const q=qs[aq];
    if(!q){render();return}
    app.innerHTML=`<div style="max-width:680px;margin:0 auto;padding:32px 20px" class="anim-in">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t3);margin-bottom:8px">
        <span style="font-weight:600">${ty==="pre"?"📋 Pre":"📋 Post"}-Test</span>
        <span>Question ${aq+1} of ${qs.length}</span>
      </div>
      <div class="prog"><div class="prog-fill" style="width:${(aq/qs.length*100)}%"></div></div>
      <div style="font-size:11px;color:var(--t3);margin-bottom:6px">Topic: ${q.tt}</div>
      <div style="font-size:14px;line-height:1.75;margin-bottom:16px">${q.st}</div>
      ${q.o.map((o,i)=>`<div class="qopt${asel===o[0]?' selected':''}" data-l="${o[0]}">${o}</div>`).join('')}
      <button class="btn" style="margin-top:14px;width:100%" id="a-next" ${!asel?'disabled':''}>${aq<qs.length-1?'Next Question →':'Finish Test'}</button>
    </div>`;
    document.querySelectorAll('.qopt').forEach(e=>e.onclick=()=>{asel=e.dataset.l;render()});
    el('a-next').onclick=()=>{
      if(!asel)return;
      aans[q.i]={s:asel,c:q.c,ok:asel===q.c};
      if(aq<qs.length-1){aq++;asel=null;render()}
      else{
        const sc=Object.values(aans).filter(a=>a.ok).length;
        const pt={};qs.forEach(qi=>{const a=aans[qi.i];pt[qi.ts]={correct:a?.ok||false}});
        upd(s=>{let n={...s};n[ty]={d:true,a:aans,s:sc,pt};return n});
        axp(ty==="pre"?100:250);
        toast(ty==="pre"?"Pre-Test Complete!":"Post-Test Complete! 🎉","🏁");
        view=ty+"-r";render();
        setTimeout(cBdg,500);
      }
    };
    return;
  }

  // ── RESULTS ──
  if(view==="pre-r"||view==="post-r"){
    const ty=view==="pre-r"?"pre":"post";const d=S[ty];const pct=Math.round(d.s/20*100);
    let cmp='';
    if(ty==="post"&&S.pre.d){
      const diff=S.post.s-S.pre.s;
      cmp=`<div style="display:flex;justify-content:center;gap:16px;margin:16px 0">
        <div class="card-flat" style="text-align:center;padding:14px 24px"><div style="font-size:11px;color:var(--t3)">Pre-Test</div><div style="font-size:28px;font-weight:800">${S.pre.s}/20</div></div>
        <span style="font-size:24px;color:var(--green);align-self:center">→</span>
        <div class="card-flat" style="text-align:center;padding:14px 24px"><div style="font-size:11px;color:var(--t3)">Post-Test</div><div style="font-size:28px;font-weight:800;color:var(--green)">${S.post.s}/20</div></div>
      </div>
      <div style="text-align:center;font-size:13px;font-weight:600;color:${diff>0?'var(--green)':diff<0?'var(--red)':'var(--t2)'};margin-bottom:12px">${diff>0?'↑ +'+diff+' improvement!':diff<0?'↓ '+diff:'No change'}</div>`;
    }
    app.innerHTML=`<div style="max-width:680px;margin:0 auto;padding:32px 20px" class="anim-in"><div class="card" style="text-align:center;padding:28px">
      <h2 style="margin-bottom:8px">${ty==="pre"?"Pre":"Post"}-Test Results</h2>
      <div class="big-num">${d.s}/20</div>
      <div style="font-size:14px;color:var(--t2);margin-bottom:4px">${pct}%</div>
      ${cmp}
      <div style="text-align:left;margin-top:14px">${T.map((t,i)=>{const r=d.pt?.[t.i];return`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px"><span style="color:var(--t2)">${i+1}. ${t.t}</span><span style="color:${r?.correct?'var(--green)':'var(--red)'}; font-weight:600">${r?.correct?'✓':'✗'}</span></div>`}).join('')}</div>
      <button class="btn" style="width:100%;margin-top:18px" id="r-go">Continue to Dashboard →</button>
    </div></div>`;
    el('r-go').onclick=()=>{view="home";render()};
    return;
  }

  // ── MAIN APP LAYOUT ──
  app.innerHTML=`
  <div class="mob-hdr">
    <button id="mob-toggle" style="background:none;border:none;color:var(--t1);font-size:22px;cursor:pointer">☰</button>
    <span style="font-weight:700;font-size:14px">Gut Check 🩺</span><span></span>
  </div>
  ${mobOpen?'<div class="mob-overlay" id="mob-close"></div>':''}
  <div class="layout">
    <div class="sb${mobOpen?' open':''}">
      <div class="gradient-text" style="text-align:center;font-size:20px;font-weight:800;font-family:'Playfair Display',serif">Gut Check 🩺</div>
      <div style="text-align:center;font-size:12px;color:var(--t2)">${S.un} · ${S.pgy}</div>
      <div style="text-align:center;font-size:11px;color:var(--t3)">Lv.${lv.l} ${lv.n}</div>
      <div class="xp-bar"><div class="xp-fill" style="width:${xpP}%"></div><span class="xp-text">${S.xp} XP</span></div>
      <div style="display:flex;gap:8px;justify-content:center;font-size:12px;padding:2px 0">
        <span title="Streak">🔥 ${S.st.c}d</span>
        <span title="Coins">🪙 ${S.co}</span>
        <span title="Badges">🏅 ${S.bg.length}/${BDG.length}</span>
      </div>
      <div style="font-size:11px;color:var(--t3);text-align:center;margin-bottom:2px">${cc}/${T.length} Topics Complete</div>
      <button class="sb-btn${view==='home'?' active':''}" data-nav="home">📊 Dashboard</button>
      <button class="sb-btn" data-modal="badges">🏅 Badges</button>
      <button class="sb-btn" data-modal="profile">👤 Profile</button>
      <button class="sb-btn" id="post-btn" ${!pu||S.post.d?'disabled':''} style="border-color:${pu&&!S.post.d?'var(--green)':'var(--bd)'};opacity:${pu?1:.5}">📋 Post-Test ${S.post.d?'✅':pu?'— READY':'('+cc+'/16)'}</button>
      <div style="height:1px;background:var(--bd);margin:4px 0"></div>
      <div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px;padding:0 4px">Topics</div>
      <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px" id="topic-list">
        ${T.map((t,i)=>`<div class="topic-item${curTopic?.i===t.i&&view==='topic'?' active':''}" data-ti="${t.i}"><span class="dot" style="background:${CLR[i%10]}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.t}</span>${S.td[t.i]?'<span style="font-size:10px">✅</span>':''}</div>`).join('')}
      </div>
      <button class="sb-btn" id="theme-btn" style="margin-top:auto">${S.th==='light'?'🌙 Dark Mode':'☀️ Light Mode'}</button>
    </div>
    <div class="main" id="mc"></div>
  </div>
  ${modal?renderModal():''}`;

  // ── Bind sidebar events ──
  el('mob-toggle')?.addEventListener('click',()=>{mobOpen=!mobOpen;render()});
  el('mob-close')?.addEventListener('click',()=>{mobOpen=false;render()});
  el('theme-btn')?.addEventListener('click',()=>upd(s=>({...s,th:s.th==='dark'?'light':'dark'})));
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;curTopic=null;mobOpen=false;render()});
  document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>{modal=b.dataset.modal;render()});
  document.querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{
    const t=T.find(x=>x.i===b.dataset.ti);
    if(t){curTopic=t;view="topic";mobOpen=false;expandedSections={};flipped={};qrev={};qsel={};
    if(!S.op.includes(t.i)){upd(s=>({...s,op:[...new Set([...s.op,t.i])]}));axp(10)}else render()}
  });
  el('post-btn')?.addEventListener('click',()=>{if(pu&&!S.post.d){aq=0;aans={};asel=null;view="posttest";render()}});

  // ── Render main content area ──
  const mc=el('mc');if(!mc)return;
  if(view==="home")renderHome(mc,cc,pu);
  else if(view==="topic"&&curTopic)renderTopic(mc);
}

// ── HOME VIEW ──
function renderHome(mc,cc,pu){
  const streakMult=S.st.c>=7?'2.5×':S.st.c>=5?'2×':S.st.c>=3?'1.5×':'1×';
  mc.innerHTML=`<div class="anim-in">
    <h1>Welcome back, ${S.un} 👋</h1>
    <p style="font-size:13px;color:var(--t2);margin:6px 0 20px">${cc}/${T.length} topics · ${Object.keys(S.qa).length} quiz questions · ${(S.mf||[]).length} cards flipped · ${S.st.c}d streak (${streakMult} XP)</p>

    ${S.pre.d?`<div class="card" style="margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center" id="show-pre"><span style="font-weight:600;font-size:13px">📋 Pre-Test Score</span><span style="font-weight:800;font-size:15px">${S.pre.s}/20</span></div>`:''}
    ${S.post.d
      ?`<div class="card" style="margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-color:rgba(16,185,129,.3)" id="show-post"><span style="font-weight:600;font-size:13px;color:var(--green)">📋 Post-Test Score</span><span style="font-weight:800;font-size:15px;color:var(--green)">${S.post.s}/20</span></div>`
      :pu?`<div class="card" style="margin-bottom:10px;cursor:pointer;border-color:var(--green)" id="start-post"><span style="font-weight:600;font-size:13px">🎯 Post-Test Unlocked! Take it now →</span></div>`
      :`<div class="card-flat" style="margin-bottom:10px;opacity:.5;font-size:13px;padding:16px">🔒 Post-Test unlocks at 16 topics (${cc}/16)</div>`}

    <h2 style="margin:22px 0 12px">All Topics</h2>
    <div class="grid">
      ${T.map((t,i)=>{
        const sv=(S.sv||{})[t.i]||[];
        const qDone=Object.keys(S.qa).filter(k=>k.startsWith(t.i+"Q")).length;
        const mDone=(S.mf||[]).filter(m=>m.startsWith(t.i+"M")).length;
        return`<div class="card" style="cursor:pointer;border-left:3px solid ${CLR[i%10]};position:relative" data-tg="${t.i}">
          ${S.td[t.i]?'<span style="position:absolute;top:12px;right:12px">✅</span>':''}
          <div style="font-weight:700;font-size:14px;margin-bottom:4px">${t.t}</div>
          <div>${(t.g||[]).map(g=>`<span class="tag">${g}</span>`).join('')}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:6px">
            📄 ${sv.length}/5 sections · 📝 ${qDone}/${(t.q||[]).length} quiz · 🃏 ${mDone}/${(t.m||[]).length} cards
          </div>
        </div>`}).join('')}
    </div>
  </div>`;

  el('show-pre')?.addEventListener('click',()=>{view="pre-r";render()});
  el('show-post')?.addEventListener('click',()=>{view="post-r";render()});
  el('start-post')?.addEventListener('click',()=>{aq=0;aans={};asel=null;view="posttest";render()});
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{
    const t=T.find(x=>x.i===b.dataset.tg);
    if(t){curTopic=t;view="topic";expandedSections={};flipped={};qrev={};qsel={};
    if(!S.op.includes(t.i)){upd(s=>({...s,op:[...new Set([...s.op,t.i])]}));axp(10)}else render()}
  });
}

// ── TOPIC VIEW ──
function renderTopic(mc){
  const tp=curTopic;
  const sks=Object.keys(tp.s||{});
  const secColors={panic_card:'#ef4444',brief_overview:'#a855f7',icu_consult_triggers:'#f97316',orders_to_place_now:'#3b82f6',cdi:'#14b8a6'};

  mc.innerHTML=`<div class="anim-in">
    <button class="btn btn-o btn-sm" id="back-btn" style="margin-bottom:14px">← Back to Dashboard</button>
    <h1 style="margin-bottom:6px">${tp.t}</h1>
    <div style="margin-bottom:18px">${(tp.g||[]).map(g=>`<span class="tag">${g}</span>`).join('')}</div>

    ${sks.map(k=>{
      const m=SM[k]||{i:"📄",l:k,c:"#6366f1"};
      const items=tp.s[k]||[];
      const seen=(S.sv||{})[tp.i]?.includes(k);
      const isExpanded=expandedSections[k];
      const displayItems=isExpanded?items:items.slice(0,3);
      return`<div class="sec-card" data-sk="${k}" style="cursor:default">
        <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${secColors[k]||'var(--ac)'}"></div>
        <div class="sec-hdr" style="cursor:pointer" data-skt="${k}">
          <span>${m.i}</span> ${m.l}
          ${seen?'<span style="font-size:10px;opacity:.5;margin-left:4px">✓ viewed</span>':''}
          <span style="margin-left:auto;font-size:10px;color:var(--t3)">${items.length} items ${items.length>3?(isExpanded?'▲':'▼'):''}</span>
        </div>
        ${displayItems.map(b=>`<div class="sec-bullet">${b}</div>`).join('')}
        ${items.length>3&&!isExpanded?`<div style="text-align:center;margin-top:6px"><button class="btn btn-o btn-sm" data-expand="${k}">Show all ${items.length} items</button></div>`:''}
      </div>`}).join('')}

    ${(tp.q||[]).length?`
    <h2 style="margin:24px 0 12px">🧪 ABIM-Style Questions</h2>
    ${tp.q.map((q,qi)=>{
      const qid=tp.i+"Q"+qi;
      const rv=qrev[qid];const sel=qsel[qid];
      const savedAns=S.qa[qid];
      const isRevealed=rv||!!savedAns;
      const selectedLetter=sel||(savedAns?.s);
      return`<div class="card" style="margin-bottom:12px;padding:18px">
        <div style="font-size:11px;color:var(--t3);margin-bottom:6px;font-weight:600">Question ${qi+1} of ${tp.q.length}</div>
        <div style="font-size:13px;line-height:1.7;margin-bottom:12px">${q.st}</div>
        ${q.o.map((o,oi)=>{
          const l=o[0];const ic=l===q.c;const is=selectedLetter===l;
          let cls='qopt';
          if(isRevealed){cls+=' locked';if(ic)cls+=' correct';else if(is&&!ic)cls+=' wrong'}
          else if(is)cls+=' selected';
          return`<div class="${cls}" data-qi="${qi}" data-l="${l}">${o}</div>`}).join('')}
        ${isRevealed&&q.r?`<div class="rationale"><strong>Rationale:</strong> ${q.r}</div>`:''}
      </div>`}).join('')}`:''}

    ${(tp.m||[]).length?`
    <h2 style="margin:24px 0 12px">🃏 Flash Cards</h2>
    <p style="font-size:11px;color:var(--t3);margin-bottom:10px">Click to reveal the answer</p>
    ${tp.m.map(m=>{
      const isFlipped=flipped[m.i];
      return`<div class="flash" data-mid="${m.i}">
        <div class="flash-q">${m.q}</div>
        ${isFlipped?`<div class="flash-a">${m.a}</div>`:'<div style="font-size:11px;color:var(--ac);margin-top:6px">Tap to reveal →</div>'}
      </div>`}).join('')}`:''}

    ${(tp.f||[]).length?`
    <h2 style="margin:24px 0 12px">📚 References</h2>
    <div class="card-flat">
      ${tp.f.map((r,i)=>`<div style="font-size:11px;color:var(--t2);padding:3px 0;${i>0?'border-top:1px solid var(--bd)':''}">📎 ${r}</div>`).join('')}
    </div>`:''}
  </div>`;

  // ── Bind topic events ──
  el('back-btn').onclick=()=>{view="home";curTopic=null;render()};

  // Section header click → mark as viewed
  document.querySelectorAll('[data-skt]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.skt;
    expandedSections[k]=!expandedSections[k];
    upd(s=>{const sv={...(s.sv||{})};if(!sv[tp.i])sv[tp.i]=[];if(!sv[tp.i].includes(k)){sv[tp.i]=[...sv[tp.i],k];return chkDone({...s,sv},tp.i)}return s});
    axp(5);
  });

  // Expand section button
  document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    expandedSections[b.dataset.expand]=true;
    render();
  });

  // Quiz answer
  document.querySelectorAll('.qopt:not(.locked)').forEach(b=>b.onclick=()=>{
    const qi=parseInt(b.dataset.qi);
    const qid=tp.i+"Q"+qi;
    if(qrev[qid]||S.qa[qid])return;
    const l=b.dataset.l;
    qsel[qid]=l;qrev[qid]=true;
    const ok=l===tp.q[qi].c;
    upd(s=>{const qa={...(s.qa||{})};qa[qid]={s:l,c:tp.q[qi].c,ok};return chkDone({...s,qa},tp.i)});
    axp(ok?25:5);
    toast(ok?"Correct! +25 XP":"Incorrect — see rationale",ok?"✅":"❌");
    setTimeout(cBdg,400);
  });

  // Flash card flip
  document.querySelectorAll('[data-mid]').forEach(b=>b.onclick=()=>{
    const mid=b.dataset.mid;
    flipped[mid]=!flipped[mid];
    if(!(S.mf||[]).includes(mid)){
      upd(s=>chkDone({...s,mf:[...(s.mf||[]),mid]},tp.i));
      axp(5);toast("+5 XP","🃏");
      setTimeout(cBdg,400);
    } else render();
  });
}

// ── MODAL ──
function renderModal(){
  if(modal==="badges")return`<div class="modal-bg" id="modal-bg"><div class="modal"><button class="close-x" id="modal-close">✕</button>
    <h2 style="margin-bottom:14px">🏅 Badge Collection</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:8px">
      ${BDG.map(b=>`<div style="text-align:center;padding:10px 4px;border-radius:10px;border:1px solid var(--bd);opacity:${S.bg.includes(b.id)?1:.25};transition:opacity .2s">
        <span style="font-size:26px;display:block;margin-bottom:2px">${b.e}</span>
        <span style="font-size:9px;font-weight:600;color:var(--t2)">${b.n}</span>
      </div>`).join('')}
    </div>
    <p style="font-size:11px;color:var(--t3);margin-top:14px;text-align:center">${S.bg.length} of ${BDG.length} earned</p>
  </div></div>`;

  if(modal==="profile"){
    const lv=gL(S.xp);
    return`<div class="modal-bg" id="modal-bg"><div class="modal"><button class="close-x" id="modal-close">✕</button>
    <h2 style="margin-bottom:14px">👤 Profile</h2>
    ${[
      ["Name",S.un],["Level",lv.l+" — "+lv.n],["PGY",S.pgy],
      ["XP",S.xp.toLocaleString()],["Coins",S.co],
      ["Topics Opened",S.op.length+"/"+T.length],
      ["Topics Complete",Object.values(S.td).filter(Boolean).length+"/"+T.length],
      ["Quiz Questions",Object.keys(S.qa).length],
      ["Cards Flipped",(S.mf||[]).length],
      ["Streak",S.st.c+" days"],
      ["Days Active",(S.dy||[]).length]
    ].map(([l,v])=>`<div class="stat"><span style="color:var(--t3)">${l}</span><span>${v}</span></div>`).join('')}
    ${S.pre.d?`<div class="stat"><span style="color:var(--t3)">Pre-Test</span><span>${S.pre.s}/20 (${Math.round(S.pre.s/20*100)}%)</span></div>`:''}
    ${S.post.d?`<div class="stat"><span style="color:var(--green);font-weight:600">Post-Test</span><span style="color:var(--green);font-weight:600">${S.post.s}/20 (${Math.round(S.post.s/20*100)}%)</span></div>`:''}
    ${S.pre.sk?`<button class="btn btn-o btn-sm" style="margin-top:12px" id="take-pre">Take Pre-Test</button>`:''}
    <button class="btn btn-o btn-sm" style="margin-top:12px;border-color:var(--red);color:var(--red)" id="reset-btn">Reset All Progress</button>
  </div></div>`;}

  return'';
}

// ── Bind modal events (via MutationObserver) ──
const obs=new MutationObserver(()=>{
  el('modal-bg')?.addEventListener('click',e=>{if(e.target.id==='modal-bg'){modal=null;render()}});
  el('modal-close')?.addEventListener('click',()=>{modal=null;render()});
  el('reset-btn')?.addEventListener('click',()=>{if(confirm("Reset all progress? This cannot be undone.")){localStorage.removeItem(SK);location.reload()}});
  el('take-pre')?.addEventListener('click',()=>{upd(s=>({...s,pre:{...s.pre,sk:false}}));aq=0;aans={};asel=null;modal=null;view="pretest";render()});
});
obs.observe(el('app'),{childList:true,subtree:true});

// ── LOAD DATA & BOOT ──
fetch('data.json')
  .then(r=>{if(!r.ok)throw new Error('Failed to load data.json');return r.json()})
  .then(d=>{T=d.T;PRE=d.PRE;POST=d.POST;initStreak();render();setTimeout(cBdg,1000)})
  .catch(e=>{
    el('app').innerHTML=`<div class="loading" style="text-align:center;padding:40px">
      <div style="font-size:48px;margin-bottom:12px">⚠️</div>
      <h2 style="margin-bottom:8px">Could not load data</h2>
      <p style="color:var(--t2);font-size:13px;max-width:400px">Make sure <code>data.json</code> is in the same directory as this file and you're serving via HTTP (not file://).</p>
      <p style="color:var(--t3);font-size:12px;margin-top:12px">Try: <code>npx serve .</code> or <code>python3 -m http.server 8000</code></p>
      <p style="color:var(--red);font-size:11px;margin-top:8px">${e.message}</p>
    </div>`;
  });
</script>
</body>
</html>

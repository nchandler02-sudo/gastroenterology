<script>
function parseMD(text,filename){
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(text.trim().startsWith('<!'))return{id:filename.replace(/\.md$/,''),title:filename.replace(/\.md$/,'').replace(/-/g,' '),tags:[],sections:{},quizzes:[],micros:[],refs:[]};
  var lines=text.split('\n'),id=filename.replace(/\.md$/,''),title=id.replace(/-/g,' '),tags=[],i,line;
  var inFM=false,fmEnd=0;
  for(i=0;i<lines.length;i++){line=lines[i].trim();if(i===0&&line==='---'){inFM=true;continue;}if(inFM&&line==='---'){fmEnd=i+1;break;}if(inFM){if(line.indexOf('title:')===0)title=line.substring(6).trim().replace(/^["']|["']$/g,'');if(line.indexOf('tags:')===0){var tm=line.match(/\[([^\]]*)\]/);if(tm)tags=tm[1].split(',').map(function(t){return t.trim();});}}}
  for(i=fmEnd;i<lines.length;i++){if(lines[i].trim().indexOf('# ')===0&&lines[i].trim().indexOf('## ')!==0){title=lines[i].trim().substring(2).trim();break;}}
  var secList=[],cur=null;
  for(i=fmEnd;i<lines.length;i++){line=lines[i];if(line.trim().indexOf('## ')===0){if(cur)secList.push(cur);cur={heading:line.trim().substring(3).trim(),lines:[]};}else if(cur){cur.lines.push(line);}}
  if(cur)secList.push(cur);
  var sections={},quizzes=[],micros=[],refs=[],qIdx=0;
  for(var s=0;s<secList.length;s++){
    var sec=secList[s],h=sec.heading.toLowerCase();
    if(/abim|quiz.*case|style.*case|pitfall/i.test(h)){var q=parseQuiz(sec.lines,id,qIdx);if(q){quizzes.push(q);qIdx++;}}
    else if(/check.*micro|check.*yourself|micro.*question/i.test(h)){micros=parseMicro(sec.lines,id);}
    else if(/reference|guideline.*ref/i.test(h)){refs=parseRefs(sec.lines);}
    else{var key='other';if(/panic/i.test(h))key='panic_card';else if(/brief.*overview|overview/i.test(h))key='brief_overview';else if(/icu|consult.*trigger/i.test(h))key='icu_consult_triggers';else if(/order/i.test(h))key='orders_to_place_now';else if(/cdi/i.test(h))key='cdi';sections[key]=parseBullets(sec.lines);}
  }
  return{id:id,title:title,tags:tags,sections:sections,quizzes:quizzes,micros:micros,refs:refs};
}
function parseBullets(lines){var r=[];for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(l.indexOf('- ')===0)r.push(l.substring(2));else if(l.length>0&&r.length>0)r[r.length-1]+=' '+l;}return r;}
function parseRefs(lines){var r=[];for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(l.indexOf('- ')===0)l=l.substring(2);else continue;var parts=l.split(/ [—|] /);if(parts.length>=2){var um=parts[parts.length-1].match(/https?:\/\/[^\s)]+/);r.push({label:parts[0].trim(),url:um?um[0]:''});}else{var um2=l.match(/https?:\/\/[^\s)]+/);r.push({label:l.replace(/https?:\/\/[^\s)]+/,'').trim(),url:um2?um2[0]:''});}}return r;}
function parseMicro(lines,topicId){var r=[],idx=0;for(var i=0;i<lines.length;i++){var l=lines[i].trim(),qm=l.match(/^-?\s*Q:\s*(.+)/);if(qm){var q=qm[1],a='';var inlineA=q.match(/^(.+?)\s+A:\s*(.+)$/);if(inlineA){q=inlineA[1];a=inlineA[2];}else{for(var j=i+1;j<lines.length;j++){var am=lines[j].trim().match(/^A:\s*(.+)/);if(am){a=am[1];i=j;break;}if(lines[j].trim().match(/^-?\s*Q:/))break;}}r.push({id:topicId+'M'+idx,q:q,a:a});idx++;}}return r;}
function parseQuiz(lines,topicId,qIdx){var sub={},ck='';for(var i=0;i<lines.length;i++){var l=lines[i];if(l.trim().indexOf('### ')===0){ck=l.trim().substring(4).trim().toLowerCase();sub[ck]=[];}else if(ck){sub[ck].push(l);}}if(!sub['stem']&&!sub['options'])return null;var stem=(sub['stem']||[]).filter(function(l){return l.trim().length>0;}).join(' ');var options=[];var ol=sub['options']||[];for(var o=0;o<ol.length;o++){var om=ol[o].trim().match(/^([A-E])\.\s*(.+)/);if(om)options.push(om[0]);}var cl=((sub['correct answer']||sub['correct']||[])[0]||'').trim();var correct=cl.charAt(0);if(!/[A-E]/.test(correct))correct='A';var rat=(sub['rationale']||sub['rationale (2\u20134 sentences)']||sub['rationale (2-4 sentences)']||[]).filter(function(l){return l.trim().length>0;}).join(' ');return{id:topicId+'Q'+qIdx,stem:stem,options:options,correct:correct,rationale:rat};}

<script>
window.PRETEST_DATA={"assessmentType": "pretest", "totalQuestions": 20, "questions": [{"id": "pre-01", "questionNumber": 1, "topicSlug": "acute-diarrhea", "topicTitle": "Acute Diarrhea", "stem": "A 72-year-old man hospitalized for pneumonia develops 7 watery stools over 24 hours on hospital day 5 after receiving ceftriaxone and azithromycin. He is febrile to 38.4°C with WBC 16,200/µL and creatinine rising from 1.0 to 1.5 mg/dL. Which stool testing criterion supports sending a C. difficile test in this scenario?", "options": ["A. Any change in stool consistency during hospitalization", "B. ≥3 unformed stools in 24 hours in a patient with compatible symptoms", "C. A single loose stool plus recent antibiotic use", "D. Positive fecal occult blood test", "E. Stool output exceeding 500 mL in 12 hours"], "correct": "B", "rationale": "IDSA/SHEA guidance recommends C. difficile testing in adults with ≥3 new unformed stools in 24 hours with compatible symptoms and no clear alternate explanation. Testing formed stool or asymptomatic patients is discouraged. A single loose stool or fecal occult blood alone does not meet the threshold for CDI testing."}, {"id": "pre-02", "questionNumber": 2, "topicSlug": "chronic-diarrhea", "topicTitle": "Chronic Diarrhea", "stem": "A 48-year-old immunocompetent woman presents with 6 weeks of watery, nonbloody diarrhea without fever, weight loss, or anemia. Vital signs and basic labs are normal. According to AGA guidance, which single stool pathogen test is specifically recommended in this presentation?", "options": ["A. Stool culture for Salmonella and Shigella", "B. Stool ova and parasite examination with three specimens", "C. Giardia testing", "D. C. difficile PCR", "E. Fecal fat quantification"], "correct": "C", "rationale": "AGA guidance for chronic watery diarrhea in immunocompetent adults without alarm features specifically recommends testing for Giardia, a common and readily treatable cause. Broad ova and parasite testing without high-risk travel exposure is not recommended as initial evaluation."}, {"id": "pre-03", "questionNumber": 3, "topicSlug": "clostridioides-difficile-infection", "topicTitle": "Clostridioides difficile Infection", "stem": "A 69-year-old woman is diagnosed with an initial episode of nonsevere C. difficile infection (WBC 12,000/µL, creatinine 1.0 mg/dL). Which is the guideline-preferred initial treatment?", "options": ["A. Metronidazole 500 mg PO TID for 14 days", "B. Fidaxomicin 200 mg PO BID for 10 days", "C. Vancomycin 500 mg PO QID for 10 days", "D. Loperamide plus oral rehydration only", "E. Rifaximin 550 mg PO BID for 10 days"], "correct": "B", "rationale": "IDSA/SHEA 2021 focused update suggests fidaxomicin 200 mg PO BID for 10 days as the preferred agent for initial nonsevere or severe CDI episodes, with vancomycin 125 mg PO QID for 10 days as an acceptable alternative. Metronidazole is reserved as a fallback when preferred agents are unavailable."}, {"id": "pre-04", "questionNumber": 4, "topicSlug": "gerd-and-esophageal-disorders", "topicTitle": "GERD and Esophageal Disorders", "stem": "A 55-year-old man with no alarm symptoms reports burning retrosternal discomfort and sour taste that worsen after meals and when lying flat. His cardiac workup is negative. What is the recommended initial management approach?", "options": ["A. Urgent upper endoscopy tonight", "B. Barium swallow as the first diagnostic test", "C. Empiric PPI once daily 30–60 minutes before a meal for 8 weeks", "D. Baclofen nightly for reflux symptoms", "E. Scheduled sucralfate four times daily"], "correct": "C", "rationale": "For classic reflux symptoms without alarm features, ACG guidelines recommend an empiric 8-week trial of a once-daily PPI taken 30–60 minutes before a meal. Endoscopy is prioritized when alarm symptoms such as dysphagia or GI bleeding are present."}, {"id": "pre-05", "questionNumber": 5, "topicSlug": "peptic-ulcer-disease", "topicTitle": "Peptic Ulcer Disease", "stem": "A 65-year-old man presents with melena and hemoglobin of 6.5 g/dL. He is hemodynamically stable after 1 L of crystalloid. According to current guidelines, at what hemoglobin threshold should RBC transfusion be considered using a restrictive strategy?", "options": ["A. <10 g/dL", "B. <9 g/dL", "C. <8 g/dL", "D. <7 g/dL", "E. <6 g/dL"], "correct": "D", "rationale": "Guidelines recommend a restrictive transfusion strategy for hemodynamically stable adults with UGIB, considering RBC transfusion at Hgb <7 g/dL. A higher threshold (~8 g/dL) may be appropriate for patients with significant cardiovascular disease or active ischemic symptoms."}, {"id": "pre-06", "questionNumber": 6, "topicSlug": "upper-gi-bleeding", "topicTitle": "Upper GI Bleeding", "stem": "A 60-year-old man with known cirrhosis presents with large-volume hematemesis and is hypotensive. While blood products are being prepared, which two medication classes should be started immediately?", "options": ["A. IV PPI bolus and oral sucralfate", "B. IV octreotide infusion and IV ceftriaxone", "C. IV tranexamic acid and oral bismuth", "D. IV vitamin K and fresh frozen plasma", "E. IV desmopressin and platelet transfusion"], "correct": "B", "rationale": "In suspected acute variceal hemorrhage, guidelines recommend starting a vasoactive agent (e.g., octreotide) plus antibiotic prophylaxis (e.g., ceftriaxone) immediately, without waiting for endoscopic confirmation."}, {"id": "pre-07", "questionNumber": 7, "topicSlug": "lower-gi-bleeding", "topicTitle": "Lower GI Bleeding", "stem": "A 70-year-old man presents with ongoing large-volume hematochezia and remains hypotensive despite 2 L of crystalloid. Hemoglobin is 8.0 g/dL. What is the preferred rapid localization test for hemodynamically significant lower GI bleeding?", "options": ["A. Urgent colonoscopy after rapid bowel preparation", "B. Tagged red blood cell scintigraphy", "C. CT angiography of the abdomen and pelvis", "D. Capsule endoscopy", "E. Abdominal plain radiograph"], "correct": "C", "rationale": "For hemodynamically significant ongoing LGIB, CT angiography is the preferred rapid localization test because it can identify active arterial bleeding and directly guide interventional radiology embolization without requiring bowel preparation."}, {"id": "pre-08", "questionNumber": 8, "topicSlug": "acute-pancreatitis", "topicTitle": "Acute Pancreatitis", "stem": "A 50-year-old man is diagnosed with mild acute pancreatitis (lipase 8× ULN, afebrile, stable vitals, normal creatinine). He received initial fluids and his pain is improving. What is the recommended nutrition strategy?", "options": ["A. Strict NPO for 72 hours to rest the pancreas", "B. Start early oral feeding as tolerated within 24 hours", "C. Begin total parenteral nutrition immediately", "D. Start a clear liquid diet only after lipase normalizes", "E. Hold all nutrition until contrast CT confirms no necrosis"], "correct": "B", "rationale": "Guidelines recommend early oral feeding as tolerated within 24 hours in mild acute pancreatitis, which is associated with improved outcomes compared with prolonged NPO status."}, {"id": "pre-09", "questionNumber": 9, "topicSlug": "biliary-disease", "topicTitle": "Biliary Disease", "stem": "A 65-year-old man with known gallstones presents with fever 39°C, jaundice, confusion, BP 88/54 mmHg, dilated CBD on ultrasound, and WBC 19,000/µL. After starting antibiotics and resuscitation, what is the most important next intervention?", "options": ["A. Order MRCP in the morning to confirm choledocholithiasis", "B. Arrange urgent biliary decompression (ERCP or percutaneous drainage)", "C. Administer corticosteroids for autoimmune cholangitis", "D. Increase IV opioids and observe with antibiotics overnight", "E. Obtain hepatitis serologies before any procedural intervention"], "correct": "B", "rationale": "This presentation is severe acute cholangitis with shock and organ dysfunction, requiring urgent source control via biliary drainage rather than delayed confirmatory imaging."}, {"id": "pre-10", "questionNumber": 10, "topicSlug": "acute-hepatitis", "topicTitle": "Acute Hepatitis", "stem": "A 44-year-old man presents with AST 3,500 U/L, ALT 4,200 U/L, INR 1.9, and confusion. He has no known liver disease and is unsure what over-the-counter medications he took. Which lab should be sent immediately regardless of the history?", "options": ["A. Ceruloplasmin", "B. Acetaminophen level", "C. Hepatitis E IgG", "D. Anti-smooth muscle antibody", "E. Alpha-1-antitrypsin level"], "correct": "B", "rationale": "In acute hepatitis with possible acute liver failure, an acetaminophen level must be sent immediately because acetaminophen toxicity is the most common cause of ALF and has a specific time-sensitive antidote (N-acetylcysteine)."}, {"id": "pre-11", "questionNumber": 11, "topicSlug": "acute-liver-failure", "topicTitle": "Acute Liver Failure", "stem": "A 30-year-old woman without known liver disease presents with hepatic injury, INR 2.3, and new confusion. Which two findings together define acute liver failure?", "options": ["A. Elevated bilirubin and ascites", "B. INR ≥1.5 and hepatic encephalopathy in a patient without preexisting cirrhosis", "C. AST >1,000 U/L and platelet count <100,000/µL", "D. Jaundice and spider angiomata", "E. Elevated ammonia and asterixis alone"], "correct": "B", "rationale": "Acute liver failure is defined by acute hepatic injury with coagulopathy (typically INR ≥1.5) and clinically apparent hepatic encephalopathy in a patient without known preexisting cirrhosis."}, {"id": "pre-12", "questionNumber": 12, "topicSlug": "hepatitis-b-and-c", "topicTitle": "Hepatitis B and C", "stem": "Which three tests comprise the recommended HBV screening 'triple panel' for adults?", "options": ["A. HBsAg, anti-HBs, and total anti-HBc", "B. HBsAg, HBeAg, and HBV DNA", "C. Anti-HBs, HBV DNA, and anti-HBe", "D. HBsAg, anti-HBc IgM, and anti-HBe", "E. HBV DNA, anti-HBs, and HBeAg"], "correct": "A", "rationale": "CDC recommends screening adults ≥18 years with the triple panel: HBsAg, anti-HBs, and total anti-HBc. This identifies chronic infection, immunity, and prior exposure."}, {"id": "pre-13", "questionNumber": 13, "topicSlug": "cirrhosis-and-portal-hypertension", "topicTitle": "Cirrhosis and Portal Hypertension", "stem": "An ascitic fluid analysis returns with 320 polymorphonuclear cells/µL and cultures are pending. What is the diagnosis and what action is required?", "options": ["A. Normal ascitic fluid; no treatment needed", "B. Spontaneous bacterial peritonitis; start empiric antibiotics now", "C. Secondary peritonitis; take directly to surgery", "D. Wait for culture results before any treatment decision", "E. Tuberculous peritonitis; start RIPE therapy"], "correct": "B", "rationale": "SBP is diagnosed when ascitic PMN count is ≥250 cells/µL, regardless of symptoms or culture results. Empiric antibiotics should be started immediately at or above this threshold."}, {"id": "pre-14", "questionNumber": 14, "topicSlug": "spontaneous-bacterial-peritonitis", "topicTitle": "Spontaneous Bacterial Peritonitis", "stem": "What is the standard IV albumin adjunct dosing regimen recommended for higher-risk SBP?", "options": ["A. 25 g IV once on day 1 only", "B. 1.5 g/kg IV on day 1 and 1 g/kg IV on day 3", "C. 50 g IV daily for 5 days", "D. 6–8 g per liter of ascites removed", "E. Albumin is not recommended in SBP management"], "correct": "B", "rationale": "AASLD guidance recommends IV albumin at 1.5 g/kg on day 1 and 1 g/kg on day 3 for higher-risk SBP, which reduces renal failure and mortality."}, {"id": "pre-15", "questionNumber": 15, "topicSlug": "hepatic-encephalopathy", "topicTitle": "Hepatic Encephalopathy", "stem": "A 56-year-old man with cirrhosis presents with confusion and asterixis consistent with overt hepatic encephalopathy. What is the first-line pharmacologic treatment and its titration target?", "options": ["A. Rifaximin 550 mg PO BID with no specific stool target", "B. Lactulose titrated to 2–3 soft stools per day", "C. Neomycin 500 mg PO QID for 14 days", "D. Flumazenil 0.2 mg IV", "E. Protein restriction to 0.5 g/kg/day"], "correct": "B", "rationale": "Lactulose is recommended as first-line treatment for episodic overt hepatic encephalopathy, titrated to achieve 2–3 soft stools per day. Rifaximin is add-on therapy after a second overt episode. Protein restriction is discouraged."}, {"id": "pre-16", "questionNumber": 16, "topicSlug": "inflammatory-bowel-disease", "topicTitle": "Inflammatory Bowel Disease", "stem": "A 28-year-old man with ulcerative colitis is admitted with ≥6 bloody stools/day, HR 100/min, T 38.1°C, and Hb 10.0 g/dL. What is the standard inpatient IV steroid regimen for acute severe UC?", "options": ["A. Prednisone 40 mg PO daily", "B. Methylprednisolone 60 mg IV daily or hydrocortisone 100 mg IV q6h", "C. Budesonide 9 mg PO daily", "D. Dexamethasone 10 mg IV q6h", "E. Prednisolone enemas nightly"], "correct": "B", "rationale": "For acute severe ulcerative colitis, ACG and ECCO guidelines recommend IV corticosteroids: methylprednisolone 60 mg IV daily or hydrocortisone 100 mg IV q6h."}, {"id": "pre-17", "questionNumber": 17, "topicSlug": "celiac-disease", "topicTitle": "Celiac Disease", "stem": "What two laboratory tests should be ordered together as first-line celiac disease screening in most adults?", "options": ["A. Anti-endomysial antibody (EMA) IgA and HLA-DQ2", "B. Tissue transglutaminase IgA (tTG-IgA) and total IgA", "C. Deamidated gliadin peptide IgG and anti-reticulin antibody", "D. Fecal calprotectin and ESR", "E. HLA-DQ2/DQ8 genotyping only"], "correct": "B", "rationale": "ACG guidelines recommend tTG-IgA plus total IgA as first-line celiac screening. Total IgA is essential to identify IgA deficiency, which would invalidate IgA-based serologic testing."}, {"id": "pre-18", "questionNumber": 18, "topicSlug": "colorectal-cancer-screening", "topicTitle": "Colorectal Cancer Screening", "stem": "At what age should colorectal cancer screening begin in average-risk, asymptomatic adults per current USPSTF guidance?", "options": ["A. 40 years", "B. 45 years", "C. 50 years", "D. 55 years", "E. 60 years"], "correct": "B", "rationale": "The USPSTF recommends CRC screening beginning at age 45 for average-risk, asymptomatic adults, continuing through age 75."}, {"id": "pre-19", "questionNumber": 19, "topicSlug": "mesenteric-ischemia", "topicTitle": "Mesenteric Ischemia", "stem": "A 72-year-old man with atrial fibrillation presents with sudden severe abdominal pain that is out of proportion to a soft, minimally tender abdomen. What is the first-line diagnostic imaging test?", "options": ["A. Abdominal plain radiograph (KUB)", "B. Right upper quadrant ultrasound", "C. CT angiography of the abdomen and pelvis with IV contrast", "D. MRI of the abdomen without contrast", "E. Diagnostic laparoscopy"], "correct": "C", "rationale": "In suspected acute mesenteric ischemia, CTA should be performed without delay as the first-line diagnostic test. Plain abdominal radiographs cannot reliably rule out mesenteric ischemia."}, {"id": "pre-20", "questionNumber": 20, "topicSlug": "nutrition-and-enteral-feeding", "topicTitle": "Nutrition and Enteral Feeding", "stem": "A malnourished 60-year-old man with alcohol use disorder has eaten minimally for 10 days. Before starting enteral nutrition, which vitamin must be administered to prevent a life-threatening complication of refeeding?", "options": ["A. Vitamin C", "B. Vitamin D", "C. Thiamine (vitamin B1)", "D. Vitamin K", "E. Folate"], "correct": "C", "rationale": "In patients at high risk for refeeding syndrome, thiamine must be administered before or at the initiation of feeding to prevent Wernicke encephalopathy and related complications."}]};
window.POSTTEST_DATA={"assessmentType": "posttest", "totalQuestions": 20, "questions": [{"id": "post-01", "questionNumber": 1, "topicSlug": "acute-diarrhea", "topicTitle": "Acute Diarrhea", "stem": "A 34-year-old woman hospitalized for cellulitis develops sudden severe crampy abdominal pain and multiple episodes of bloody diarrhea after eating a hamburger brought from home. T 38.2°C, BP 118/74 mmHg, HR 105/min. She has diffuse tenderness without guarding. The team considers starting empiric azithromycin and loperamide. What is the best management?", "options": ["A. Start empiric azithromycin and loperamide for symptom control", "B. Send stool testing for Shiga toxin–producing organisms and provide supportive care without antibiotics or antimotility agents", "C. Start high-dose oral vancomycin for presumed C. difficile", "D. Administer prednisone for presumed IBD flare", "E. Give bismuth subsalicylate and discharge since vitals are stable"], "correct": "B", "rationale": "Bloody diarrhea with severe cramps after ground beef exposure raises concern for STEC. Guidelines caution against routine empiric antibiotics in suspected STEC due to potential worsening of HUS risk. Antimotility agents are contraindicated in inflammatory/bloody diarrhea."}, {"id": "post-02", "questionNumber": 2, "topicSlug": "chronic-diarrhea", "topicTitle": "Chronic Diarrhea", "stem": "A 72-year-old woman on a PPI and ibuprofen has 3 months of chronic watery diarrhea including nocturnal episodes. A colonoscopy 2 weeks ago showed completely normal-appearing mucosa. Labs are normal. The team reassures her that a normal colonoscopy rules out colitis. What is the correct next step?", "options": ["A. Agree that normal colonoscopy excludes colitis and start loperamide", "B. Order ESR and CRP to screen for inflammatory bowel disease", "C. Obtain random colonic biopsies to evaluate for microscopic colitis", "D. Start empiric vancomycin for presumed C. difficile", "E. Diagnose IBS and discharge with fiber supplementation"], "correct": "C", "rationale": "The pitfall is assuming a normal-appearing colon excludes microscopic colitis, which requires colonic biopsies for diagnosis despite grossly normal mucosa. PPI and NSAID use are recognized triggers."}, {"id": "post-03", "questionNumber": 3, "topicSlug": "clostridioides-difficile-infection", "topicTitle": "Clostridioides difficile Infection", "stem": "A 64-year-old woman with CKD (baseline creatinine 2.0 mg/dL) is admitted with confusion, minimal stool output, nausea, abdominal distension, and diffuse tenderness. T 38.3°C, BP 86/54 mmHg after 2 L crystalloid, HR 118/min. WBC 28,000/µL, lactate 4.1 mmol/L. CT shows diffuse colitis with colonic dilation and ileus. Stool testing is pending. What is the best antimicrobial regimen?", "options": ["A. Fidaxomicin 200 mg PO BID only", "B. Vancomycin 125 mg PO QID only", "C. Vancomycin 500 mg PO/NG Q6H plus metronidazole 500 mg IV Q8H, and add vancomycin 500 mg PR Q6H", "D. Metronidazole 500 mg PO TID only", "E. Defer CDI therapy until stool testing confirms diagnosis"], "correct": "C", "rationale": "This is fulminant CDI physiology with shock, ileus, and megacolon concern. The fulminant regimen requires high-dose enteral vancomycin plus IV metronidazole, and ileus necessitates adding rectal vancomycin to ensure colonic drug delivery."}, {"id": "post-04", "questionNumber": 4, "topicSlug": "gerd-and-esophageal-disorders", "topicTitle": "GERD and Esophageal Disorders", "stem": "A 66-year-old woman on alendronate develops sudden severe odynophagia and substernal pain at 2 a.m. after taking bedtime pills with a small sip of water while lying flat. She is afebrile, hemodynamically stable, and has no drooling or respiratory distress. The team considers giving a large oral water challenge. What is the best next step?", "options": ["A. Give a large oral water challenge to push the medication through", "B. Keep NPO, start PPI, provide analgesia, and stop the offending medication", "C. Start IV thrombolytics for suspected esophageal ischemia", "D. Place a nasogastric tube for decompression", "E. Start high-dose oral steroids immediately"], "correct": "B", "rationale": "This is pill esophagitis from alendronate taken recumbent with minimal water. Stop the culprit medication, reduce acid exposure with PPI, and provide supportive care. Forced oral intake risks worsening mucosal injury."}, {"id": "post-05", "questionNumber": 5, "topicSlug": "peptic-ulcer-disease", "topicTitle": "Peptic Ulcer Disease", "stem": "A 74-year-old woman with prior MI takes aspirin 81 mg daily for secondary prevention. She develops hematemesis and melena. After resuscitation, endoscopy shows a bleeding duodenal ulcer successfully treated with endoscopic hemostasis. The team plans to hold aspirin for 30 days. What is the most appropriate antiplatelet strategy?", "options": ["A. Stop aspirin indefinitely because it caused the ulcer", "B. Hold aspirin for at least 30 days to prevent rebleeding", "C. Resume aspirin as soon as possible after hemostasis since it is for secondary cardiovascular prevention", "D. Switch aspirin to clopidogrel and avoid PPI co-therapy", "E. Start therapeutic heparin bridging while aspirin is held"], "correct": "C", "rationale": "The pitfall is over-holding antiplatelet therapy in a patient with secondary cardiovascular prevention indication. Guidelines support early resumption of low-dose aspirin after endoscopic hemostasis because cardiovascular event risk with prolonged interruption outweighs rebleeding risk."}, {"id": "post-06", "questionNumber": 6, "topicSlug": "upper-gi-bleeding", "topicTitle": "Upper GI Bleeding", "stem": "A 58-year-old man with cirrhosis, ascites, and prior varices presents with large-volume hematemesis. BP 88/52 mmHg, HR 124/min, and he is intermittently confused. Hgb 7.9 g/dL, INR 1.8, platelets 78,000/µL. The team wants to give vitamin K and FFP to correct the INR before starting any other therapy. What should be started immediately instead?", "options": ["A. Pantoprazole 80 mg IV bolus then continuous infusion", "B. Octreotide infusion plus ceftriaxone", "C. Vitamin K 10 mg IV to correct INR first", "D. Desmopressin to improve platelet function", "E. Tranexamic acid infusion"], "correct": "B", "rationale": "The key pitfall is treating suspected variceal hemorrhage like routine ulcer bleeding and delaying variceal-directed therapy while focusing on INR correction. Vasoactive therapy plus antibiotic prophylaxis is the immediate bundle."}, {"id": "post-07", "questionNumber": 7, "topicSlug": "lower-gi-bleeding", "topicTitle": "Lower GI Bleeding", "stem": "A 64-year-old woman presents with hematochezia and lightheadedness. She is diaphoretic with HR 128/min and BP 82/48 mmHg. She has a history of peptic ulcer disease and takes daily ibuprofen. The team assumes a lower GI source and plans colonoscopy. What procedure should be performed first?", "options": ["A. Colonoscopy after rapid bowel preparation", "B. Upper endoscopy (EGD)", "C. Capsule endoscopy", "D. CT colonography", "E. No endoscopy; treat with IV fluids only"], "correct": "B", "rationale": "Hematochezia with hemodynamic instability can represent a brisk upper GI bleed with rapid transit—especially in a patient with peptic ulcer history and NSAID use. Upper endoscopy should be prioritized."}, {"id": "post-08", "questionNumber": 8, "topicSlug": "acute-pancreatitis", "topicTitle": "Acute Pancreatitis", "stem": "A 68-year-old woman with HFrEF (EF 25%) is admitted with acute pancreatitis. BP 92/58 mmHg, HR 118/min, SpO₂ 90% on 4 L NC with bibasilar crackles. BUN is rising and urine output is low. She received 2 L LR in the ED. The team plans to continue aggressive fluid boluses. What is the best next step?", "options": ["A. Continue aggressive fluid boluses until urine output normalizes", "B. Start prophylactic antibiotics for severe pancreatitis", "C. Initiate ICU-level goal-directed resuscitation with careful titration and early vasopressors if MAP remains <65 mmHg", "D. Order immediate contrast CT to determine necrosis extent", "E. Start parenteral nutrition immediately"], "correct": "C", "rationale": "The pitfall is over-resuscitation in a patient with limited cardiac reserve who already shows signs of pulmonary edema. Guidelines support goal-directed fluids with frequent reassessment and caution in cardiovascular comorbidity."}, {"id": "post-09", "questionNumber": 9, "topicSlug": "biliary-disease", "topicTitle": "Biliary Disease", "stem": "A 59-year-old woman presents with RUQ pain and vomiting. She is afebrile, BP 128/74 mmHg. Labs show AST 210, ALT 260, ALP 190, bilirubin 2.8 mg/dL. Ultrasound shows gallstones and CBD 7 mm; no stone visualized. She has a history of post-ERCP pancreatitis. The team wants to proceed directly to ERCP tonight. What is the best approach?", "options": ["A. Proceed directly to ERCP tonight", "B. Obtain MRCP or EUS to confirm choledocholithiasis before ERCP", "C. Give antibiotics and schedule cholecystectomy only", "D. Start heparin infusion for hepatic vein thrombosis", "E. Administer tPA for biliary obstruction"], "correct": "B", "rationale": "This is intermediate-risk suspected choledocholithiasis. Noninvasive confirmation with MRCP or EUS is preferred to avoid unnecessary ERCP, especially given her history of post-ERCP pancreatitis."}, {"id": "post-10", "questionNumber": 10, "topicSlug": "acute-hepatitis", "topicTitle": "Acute Hepatitis", "stem": "A 62-year-old woman on chronic warfarin for atrial fibrillation is admitted with AST 980, ALT 1,100, bilirubin 6.2 mg/dL, and INR 3.1. She is fully oriented with normal mental status and no asterixis. She took her usual warfarin dose today. The team plans to arrange emergent transfer for acute liver failure based on the INR. What is the best next step?", "options": ["A. Diagnose ALF and arrange emergent transfer without further assessment", "B. Attribute INR entirely to warfarin and ignore hepatic synthetic function", "C. Assess for encephalopathy and interpret INR in context; trend INR off warfarin and check factor V or fibrinogen if needed", "D. Give FFP to normalize INR and repeat liver enzymes in the morning", "E. Start lactulose immediately because any INR elevation implies HE"], "correct": "C", "rationale": "The pitfall is diagnosing ALF solely from an elevated INR in a patient on warfarin. Warfarin elevates INR independent of hepatic synthetic function. ALF requires encephalopathy plus impaired hepatic synthesis."}, {"id": "post-11", "questionNumber": 11, "topicSlug": "acute-liver-failure", "topicTitle": "Acute Liver Failure", "stem": "A 54-year-old man with ALF from drug-induced liver injury is intubated in the ICU. INR 3.1, platelets 28,000/µL, fibrinogen 1.6 g/L. He has no active bleeding. The team asks whether pharmacologic VTE prophylaxis should be given because 'his INR is high anyway.' What is the best prophylaxis approach?", "options": ["A. Enoxaparin 40 mg SC nightly", "B. Unfractionated heparin 5,000 units SC q8h", "C. Withhold all prophylaxis because INR is elevated", "D. Mechanical prophylaxis with sequential compression devices only", "E. Give FFP first, then start enoxaparin"], "correct": "D", "rationale": "A common pitfall is assuming elevated INR means auto-anticoagulation; ALF patients can still thrombose. However, with platelets at 28,000/µL, pharmacologic prophylaxis carries significant bleeding risk. Mechanical prophylaxis is preferred."}, {"id": "post-12", "questionNumber": 12, "topicSlug": "hepatitis-b-and-c", "topicTitle": "Hepatitis B and C", "stem": "A 58-year-old woman with rheumatoid arthritis is admitted and the team plans to start prednisone 60 mg daily tonight with a slow taper over months. HBV tests return: HBsAg positive, anti-HBs negative, total anti-HBc positive. ALT is 78 IU/L and HBV DNA is pending. What is the best next step?", "options": ["A. Start tenofovir or entecavir now while steroids begin", "B. Delay steroids until HBV DNA results return", "C. Give hepatitis B vaccine now and reassess in 1 month", "D. Start ribavirin to prevent hepatitis flare", "E. Monitor ALT weekly; start antivirals only if ALT rises above 200 IU/L"], "correct": "A", "rationale": "HBsAg positivity indicates chronic HBV infection, and high-dose prolonged steroids can precipitate severe HBV reactivation. Starting a high-barrier antiviral promptly is recommended. The pitfall is waiting for HBV DNA despite clear high-risk trigger."}, {"id": "post-13", "questionNumber": 13, "topicSlug": "cirrhosis-and-portal-hypertension", "topicTitle": "Cirrhosis and Portal Hypertension", "stem": "A 64-year-old woman with decompensated cirrhosis is found overnight to be progressively somnolent and confused with asterixis. She is intermittently vomiting. Vitals are stable, SpO₂ 94% on room air. The nurse requests lactulose orally now. What is the best next step?", "options": ["A. Administer lactulose orally immediately", "B. Place an NG tube and give lactulose without further evaluation", "C. Secure the airway first, then administer enteral lactulose targeting 2–3 soft stools/day", "D. Give IV benzodiazepines for agitation", "E. Order screening endoscopy before treating encephalopathy"], "correct": "C", "rationale": "The immediate pitfall is aspiration risk with depressed mental status and active vomiting. Airway protection must come first before administering enteral lactulose."}, {"id": "post-14", "questionNumber": 14, "topicSlug": "spontaneous-bacterial-peritonitis", "topicTitle": "Spontaneous Bacterial Peritonitis", "stem": "A 63-year-old woman with decompensated cirrhosis and recurrent SBP is admitted from a skilled nursing facility with fever and abdominal discomfort. She has been taking daily norfloxacin prophylaxis for months. BP 96/58 mmHg after 1 L crystalloid, HR 112/min. Ascitic PMN 600 cells/µL. The team starts ceftriaxone 2 g IV. Is this the optimal empiric choice?", "options": ["A. Yes, ceftriaxone 2 g IV is always adequate for SBP", "B. No, consider broader coverage such as piperacillin-tazobactam with de-escalation when cultures return", "C. No, switch to oral TMP-SMX only", "D. No, start ampicillin-sulbactam IV", "E. No antibiotics until ascitic culture identifies an organism"], "correct": "B", "rationale": "This is healthcare-associated SBP in a patient on chronic quinolone prophylaxis, increasing the likelihood of resistant organisms. Broader empiric coverage with prompt de-escalation when cultures return is appropriate."}, {"id": "post-15", "questionNumber": 15, "topicSlug": "hepatic-encephalopathy", "topicTitle": "Hepatic Encephalopathy", "stem": "A 66-year-old woman with decompensated cirrhosis presents with acute confusion. She is somnolent but arousable with no asterixis. Her family says 'this looks like her prior hepatic encephalopathy.' Her plasma ammonia returns normal. The team plans to treat with lactulose only. What is the most appropriate next step?", "options": ["A. Stop further evaluation because normal ammonia excludes delirium", "B. Treat with lactulose only and defer all other workup", "C. Re-evaluate for alternative causes of encephalopathy with targeted testing", "D. Start high-dose protein restriction immediately", "E. Start routine prophylactic rifaximin solely because she has a history of TIPS"], "correct": "C", "rationale": "A normal ammonia level calls the diagnosis of hepatic encephalopathy into question and should prompt re-evaluation for alternative causes of altered mental status."}, {"id": "post-16", "questionNumber": 16, "topicSlug": "inflammatory-bowel-disease", "topicTitle": "Inflammatory Bowel Disease", "stem": "A 62-year-old woman with UC on azathioprine presents with 6 days of worsening watery diarrhea and new hematochezia. HR 112/min, T 38.0°C. CT shows diffuse colitis. Stool testing returns positive for C. difficile. The team wants to start methylprednisolone 60 mg IV for presumed ASUC. What is the best next step?", "options": ["A. Start methylprednisolone 60 mg IV daily immediately", "B. Start oral vancomycin 125 mg PO q6h and hold escalation of immunosuppression until infection is addressed", "C. Start infliximab 5 mg/kg IV tonight as rescue therapy", "D. Start loperamide and oral rehydration only", "E. Perform colonoscopy with full bowel prep overnight"], "correct": "B", "rationale": "The pitfall is treating an infectious colitis mimic as an IBD flare. A positive C. difficile test shifts first-line management to targeted antibiotic therapy before escalating immunosuppression."}, {"id": "post-17", "questionNumber": 17, "topicSlug": "celiac-disease", "topicTitle": "Celiac Disease", "stem": "A 52-year-old patient with chronic diarrhea and iron-deficiency anemia started a gluten-free diet 3 months ago on their own and reports partial improvement. They are now admitted for syncope. The team orders tTG-IgA to confirm celiac disease. What is the best diagnostic approach given the patient is already gluten-free?", "options": ["A. Order tTG-IgA only and diagnose based on results", "B. Order HLA-DQ2/DQ8 genotyping", "C. Start oral budesonide for presumed refractory celiac disease", "D. Diagnose celiac disease based on symptom improvement alone", "E. Order duodenal biopsies immediately without considering diet status"], "correct": "B", "rationale": "When a patient has already been on a gluten-free diet, serology and biopsy may have normalized. HLA-DQ2/DQ8 negativity effectively rules out celiac disease; positivity is non-diagnostic and may prompt a supervised gluten challenge."}, {"id": "post-18", "questionNumber": 18, "topicSlug": "colorectal-cancer-screening", "topicTitle": "Colorectal Cancer Screening", "stem": "A 42-year-old asymptomatic woman reports her father was diagnosed with colorectal cancer at age 52. She has never been screened. The team plans to begin screening at age 45 with annual FIT. What is the most appropriate screening plan?", "options": ["A. Begin screening at age 45 with annual FIT", "B. Begin screening now with colonoscopy and repeat every 10 years", "C. Begin screening now with colonoscopy and repeat every 5 years if normal", "D. Begin screening at age 50 with colonoscopy every 10 years", "E. No screening indicated because she is asymptomatic"], "correct": "C", "rationale": "A first-degree relative with CRC diagnosed before age 60 places her in a higher-risk category. Screening should begin at age 40 or 10 years before the youngest affected relative's diagnosis, using colonoscopy with 5-year intervals."}, {"id": "post-19", "questionNumber": 19, "topicSlug": "mesenteric-ischemia", "topicTitle": "Mesenteric Ischemia", "stem": "A 78-year-old woman with diffuse atherosclerosis presents with abrupt severe abdominal pain. BP 92/54 mmHg, HR 118/min, creatinine 3.2 mg/dL (baseline unknown), lactate 3.8 mmol/L. The team hesitates to order CTA because of the elevated creatinine. What is the best next step?", "options": ["A. Defer contrast and obtain noncontrast CT first", "B. Obtain CT angiography with IV contrast immediately while resuscitating", "C. Start TPN and observe overnight", "D. Treat empirically for pancreatitis and recheck lipase", "E. Obtain colonoscopy to evaluate for ischemic colitis"], "correct": "B", "rationale": "The pitfall is delaying definitive vascular imaging for kidney concerns when clinical suspicion for acute mesenteric ischemia is high. The mortality risk of delayed diagnosis far outweighs the risk of contrast exposure."}, {"id": "post-20", "questionNumber": 20, "topicSlug": "nutrition-and-enteral-feeding", "topicTitle": "Nutrition and Enteral Feeding", "stem": "A 70-year-old woman with septic shock is in the ICU on norepinephrine at 0.25 µg/kg/min with rising lactate and cool extremities. A new order is placed to start continuous enteral feeds overnight because she has been NPO for 2 days. Her abdomen is soft but mildly distended. What is the best next step regarding enteral feeding?", "options": ["A. Start full-rate gastric feeds now to prevent mucosal atrophy", "B. Start trophic feeds and advance rapidly every 2 hours", "C. Hold enteral feeds until she is adequately resuscitated and vasopressor requirements are stable or decreasing", "D. Switch to bolus feeds to improve tolerance", "E. Place a postpyloric tube and start full-rate feeds immediately"], "correct": "C", "rationale": "Enteral feeding should be withheld during active hemodynamic instability with escalating vasopressors and rising lactate. The pitfall is assuming any amount of feeding is always safe during shock."}]};

window.TOPIC_FILES={"acute-diarrhea.md": "---\nfilename: acute-diarrhea.md\nid: acute-diarrhea\ntitle: acute diarrhea\nslug: acute-diarrhea\ntags: [gastroenterology, infectious-disease, inpatient]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# acute diarrhea\n## Panic Card (3–6 bullets)\n- Assess ABCs + perfusion; if shock/sepsis physiology, give **balanced crystalloid 30 mL/kg** and target **MAP ≥65 mmHg**; start vasopressor if fluid-refractory. \n- Place **contact enteric precautions now** for new-onset inpatient diarrhea until infectious etiologies (esp. **C. difficile**) addressed; stop laxatives and high-risk meds. \n- Check bedside red flags: **SBP <90**, **HR ≥120**, **fever ≥38.5°C**, **severe abdominal pain**, **bloody stool**, **AMS**, **oliguria**, **lactate ≥2 mmol/L** → escalate evaluation and consider ICU. \n- Immediate labs: BMP (K⁺/HCO₃⁻), Mg²⁺, CBC, lactate if ill; replete to **K⁺ ≥4.0 mmol/L**, **Mg²⁺ ≥2.0 mg/dL** if ongoing losses/arrhythmia risk. \n- If suspected severe/fulminant CDI (hypotension, ileus, megacolon): start therapy promptly while testing; **Confirm Before Proceed:** avoid antimotility agents in suspected inflammatory diarrhea/CDI. \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Acute diarrhea in inpatients is often medication- or tube feed–related, but overnight you must first rule out dangerous infectious/inflammatory causes: **C. difficile**, invasive bacterial colitis, ischemic colitis, and sepsis; treat dehydration and hemodynamic instability immediately, then refine etiology. \n- **Guideline Must Know:** Evaluate all patients for dehydration and severity (orthostasis, dry mucosa, oliguria, AKI); severe dehydration or sepsis physiology warrants IV rehydration rather than oral-only replacement. \n- Now: stop obvious iatrogenic drivers (laxatives, stool softeners, magnesium-containing antacids, metformin, new antibiotics, tube feed osmolarity changes) and quantify stool output; document **# unformed stools/24 h** and presence of **blood/mucus** because it drives testing and antimotility safety. \n- **Guideline Must Know:** Send stool testing when diarrhea is accompanied by **fever**, **bloody or mucoid stools**, **severe cramping/tenderness**, or **signs of sepsis**; recommended targets include **Salmonella, Shigella, Campylobacter, Yersinia, C. difficile, and STEC (Shiga toxin)**. \n- **Guideline Must Know:** When STEC is possible (bloody diarrhea, severe cramps, outbreak/food exposure), ensure testing detects **Shiga toxin** and distinguishes **E. coli O157:H7** from non-O157 STEC; avoid empiric antibiotics if STEC suspected unless compelling sepsis indications. \n- **Guideline Must Know:** In hospitalized patients, prioritize **C. difficile** when diarrhea is new/unexplained and especially after antibiotic exposure; test only when symptomatic (e.g., **≥3 unformed stools in 24 h**) and off laxatives when feasible to reduce false positives from colonization. \n- **Guideline Must Know:** IDSA/SHEA 2021 focused update: for an initial CDI episode, **fidaxomicin** is suggested over vancomycin when feasible, but **vancomycin remains acceptable**; choose based on severity, resources, and stewardship. \n- **Guideline Must Know:** Fulminant CDI (hypotension/shock, ileus, megacolon) requires aggressive resuscitation plus **vancomycin 500 mg PO/NG q6h** and consider **metronidazole 500 mg IV q8h**; add rectal vancomycin if ileus prevents adequate luminal delivery. \n- Now: decide if empiric antibiotics are warranted—most acute watery diarrhea is self-limited; empiric therapy is generally reserved for **sepsis**, severe traveler-associated disease, or high-risk hosts, and should be narrowed once testing returns. \n- **Guideline Must Know:** Do not give antimotility agents (e.g., loperamide) when **bloody diarrhea**, **high fever**, suspected **C. difficile**, suspected **toxic megacolon**, or significant abdominal tenderness—risk of worsening invasive disease/ileus; symptomatic agents are safer for uncomplicated watery diarrhea. \n- Now: if abdominal exam suggests peritonitis, severe focal tenderness, or concern for ischemic colitis/megacolon, obtain urgent imaging (CT A/P with IV contrast if renal function allows) and consult surgery/GI early; do not anchor on “gastroenteritis” in an older inpatient with pain out of proportion. \n- Now: correct complications of volume/electrolyte losses—**metabolic acidosis (low HCO₃⁻)**, **hypokalemia**, **hypomagnesemia**, and prerenal AKI; replete electrolytes proactively if ongoing stool losses and monitor QT-risk meds overnight. \n- Later: review antimicrobials and stewardship—stop unnecessary antibiotics driving diarrhea/CDI risk, and if antibiotics are required for another indication, document the rationale and planned duration to reduce recurrence risk. \n- Later: if symptoms persist **>7 days** or are moderate-to-severe, broaden evaluation (culture-independent stool panels, ova/parasite testing when epidemiologically indicated, medication review, thyroid/adrenal considerations) and plan daytime follow-up for chronic/persistent workup. \n- Pitfalls: false-positive C. difficile NAAT in colonized patients (treat the patient, not the PCR); missing early fulminant CDI (rising WBC/Cr, ileus); giving loperamide in inflammatory diarrhea; and failing to isolate promptly, causing unit outbreaks. \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- **Hemodynamic instability**: **MAP <65 mmHg** after fluids or need for vasopressor; **lactate ≥2 mmol/L** with clinical deterioration. \n- **Fulminant colitis concern**: ileus, peritoneal signs, or suspected toxic megacolon (severe distention + systemic toxicity) → urgent ICU + GI/surgery. \n- **Severe inflammatory diarrhea**: **gross blood**, **Hgb drop**, or escalating abdominal pain/tenderness requiring urgent imaging/endoscopic planning. \n- **Worsening organ dysfunction**: rising creatinine/oliguria, severe electrolyte derangements (e.g., **K⁺ <3.0 mmol/L** despite repletion), or new arrhythmia/QT prolongation. \n\n## Orders to Place Now (3–6 bullets)\n- Order: Contact enteric isolation — {start now; signage; dedicated equipment} \n- Order: IV fluid bolus (balanced crystalloid) — {volume mL/kg; reassess vitals/urine output; consider repeat bolus} \n- Order: Labs: CBC, CMP, Mg, lactate — {now; repeat BMP/Mg in 4–6 h if ongoing losses or AKI} \n- Order: Stool testing: C. difficile NAAT + toxin algorithm — {only if ≥3 unformed stools/24 h and off laxatives if possible} \n- Order: Stool testing: multiplex PCR panel incl. Shiga toxin (or stool culture + Shiga toxin) — {if fever/bloody stool/severe pain/sepsis} \n- Order: CT abdomen/pelvis with IV contrast — {if severe pain, peritoneal signs, ileus, concern for ischemia/megacolon; renal function considerations} \n\n## ABIM Style Question 1\n### Stem\nA 68-year-old man is hospitalized for pneumonia and has received ceftriaxone and azithromycin for 5 days. Overnight he develops 6 watery bowel movements, abdominal cramping, and a temperature of 38.6°C. Vitals: BP 104/62 mmHg, HR 112/min. Labs: WBC 18,500/µL, creatinine increased from 0.9 to 1.6 mg/dL. He has no peritoneal signs. What is the best next step in management?\n### Options\nA. Give loperamide and observe because most inpatient diarrhea is self-limited\nB. Start oral vancomycin 125 mg four times daily and place contact enteric precautions while sending C. difficile testing\nC. Start oral ciprofloxacin for empiric bacterial gastroenteritis and send a stool culture\nD. Order colonoscopy urgently to confirm pseudomembranes before any treatment\nE. Send stool ova and parasite examination and defer therapy until results return\n### Correct answer\nB\n### Rationale (2–4 sentences)\nThis patient has high suspicion for CDI with systemic features and renal dysfunction; prompt isolation and empiric therapy are appropriate while diagnostic testing is sent. IDSA/SHEA recommend fidaxomicin when feasible for initial CDI, but vancomycin remains an acceptable alternative, and early treatment is critical when severity features are present. Antimotility therapy is inappropriate when inflammatory infectious diarrhea/CDI is suspected. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 34-year-old woman is admitted for IV antibiotics for cellulitis. Overnight she develops sudden severe crampy abdominal pain and multiple episodes of bloody diarrhea after eating a hamburger brought from home earlier that day. Vitals: T 38.2°C, BP 118/74 mmHg, HR 105/min. Exam shows diffuse tenderness without guarding. What is the best next step?\n### Options\nA. Start empiric azithromycin immediately and give loperamide for symptom control\nB. Send stool testing for Shiga toxin–producing organisms and provide supportive care without antibiotics or antimotility agents\nC. Start high-dose oral vancomycin because bloody diarrhea strongly suggests C. difficile infection\nD. Administer prednisone for presumed inflammatory bowel disease flare\nE. Give bismuth subsalicylate and discharge because vitals are stable\n### Correct answer\nB\n### Rationale (2–4 sentences)\nBloody diarrhea with severe cramps after beef exposure raises concern for STEC; guidelines emphasize testing that detects **Shiga toxin** and caution against routine empiric antibiotics in suspected STEC due to potential harm (pitfall: worsening risk of HUS). Supportive care with careful monitoring is preferred while diagnostics are obtained. Avoid antimotility agents in inflammatory diarrhea. What changed the decision here? \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What stool frequency criterion supports testing for symptomatic C. difficile in adults?\n A: **≥3 unformed stools in 24 hours** in a patient with compatible symptoms and no clear alternate cause. \n- Q: In which scenario should you avoid loperamide overnight?\n A: When there is **bloody diarrhea**, **high fever**, suspected **C. difficile**, or significant abdominal tenderness suggesting inflammatory colitis. \n- Q: Which stool features mandate bacterial pathogen testing per IDSA infectious diarrhea guidance?\n A: Diarrhea with **fever**, **bloody/mucoid stools**, **severe abdominal cramping/tenderness**, or **signs of sepsis**. \n- Q: What is the first-line enteric isolation action for suspected infectious inpatient diarrhea?\n A: Place **contact enteric precautions immediately** while evaluation is underway. \n\n## Guidelines & Key References (3–5 bullets)\n- IDSA Clinical Practice Guidelines for the Diagnosis and Management of Infectious Diarrhea (2017) — \n- SHEA/IDSA Clinical Practice Guideline Update for Management of Clostridioides difficile Infection in Adults (2021) — \n- SHEA/IDSA CDI Focused Update PDF (2021) — \n- American College of Gastroenterology: “What’s New Here: ACG Acute Infectious Diarrhea Guidelines” (2016) — \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute diarrhea — {onset/time course; # unformed stools/24 h; watery vs bloody; associated fever/abdominal pain}\n- Dehydration/hypovolemia — {orthostasis; HR; urine output; creatinine change; exam findings; IV fluids given/response}\n- Suspected infectious diarrhea — {risk factors: recent antibiotics/hospitalization/enteral feeds; enteric isolation placed; stool tests ordered}\n- Suspected/confirmed C. difficile infection — {test type/results; severity markers: WBC, creatinine, hypotension/ileus; treatment started with dose + start time}\n- Sepsis due to suspected enteric infection (if present) — {SOFA-related organ dysfunction; lactate; cultures/imaging; antibiotics/vasopressors and timing}\n", "chronic-diarrhea.md": "---\nfilename: chronic-diarrhea.md\nid: chronic-diarrhea\ntitle: chronic diarrhea\nslug: chronic-diarrhea\ntags: [gastroenterology, inpatient, night-float]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# chronic diarrhea\n\n## Panic Card (3–6 bullets)\n- Assess ABCs, mental status, and perfusion; treat shock with **isotonic crystalloid 1–2 L bolus** (or **30 mL/kg** if sepsis physiology) and target **MAP ≥65 mmHg**; start pressor (norepinephrine) if fluid-refractory. \n- Check immediate danger labs: **BMP + Mg²⁺ + phosphate**, VBG/ABG if ill; replete aggressively for **K⁺ <3.0 mmol/L** or **Mg²⁺ <1.6 mg/dL** and place on telemetry if significant derangements/arrhythmia risk. \n- If inpatient/antibiotic exposure or ≥3 unformed stools/24 h: send **C. difficile** testing and institute contact precautions; avoid antimotility agents if severe/systemic illness. \n- Evaluate for red flags requiring escalation now: **fever**, **bloody stool**, severe abdominal pain/peritonitis, **AKI/oliguria**, rising lactate, or concern for toxic megacolon; stop laxatives and suspect meds (Mg, metformin, PPIs/NSAIDs). \n- Confirm Before Proceed: Do not give **loperamide/opioids** until you have excluded **C. difficile**, invasive bacterial diarrhea, ileus, or suspected megacolon/obstruction (risk of worsening outcomes). \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Define the inpatient problem: chronic diarrhea is **≥4 weeks** of loose stools; on night float, prioritize stabilizing volume/electrolytes, identifying infectious/systemic causes, and preventing iatrogenic worsening (laxatives, tube feeds, antibiotics, metformin, magnesium, sorbitol). \n- First fork is severity and “alarm” physiology: **SBP <90 mmHg or MAP <65**, **HR ≥120**, new confusion, **lactate ≥2 mmol/L**, **Cr rise ≥0.3 mg/dL/48 h**, **K⁺ <2.5 or >6.0 mmol/L**, severe abdominal tenderness/guarding, or ongoing GI bleeding = treat as unstable and escalate early (ICU/consult). \n- What must happen now: quantify output (stools/24 h, nocturnal stools, ostomy output), start strict I/Os, check orthostatics, and order targeted labs: **CBC, CMP, Mg²⁺, phosphate**, consider TSH and morning cortisol if chronic unexplained watery diarrhea with weight loss/hypotension. \n- Infectious rule-out is common in hospitalized adults even with “chronic” symptoms: if **≥3 unformed stools/24 h** with recent antibiotics/healthcare exposure, test for **C. difficile** and stop inciting antibiotics when feasible; consider stool PCR/culture only when **fever, bloody stool, severe pain, sepsis signs**, or immunocompromise. \n- **Guideline Must Know:** For watery diarrhea ≥4 weeks without alarm features, AGA recommends targeted labs rather than exhaustive testing; use **fecal calprotectin or fecal lactoferrin** to screen for inflammatory conditions (IBD) when appropriate. \n- **Guideline Must Know:** AGA recommends **testing for Giardia** in adults with chronic watery diarrhea because it is common and readily treatable; don’t miss it in patients with daycare exposure, contaminated water risk, or unexplained persistent watery stools. \n- **Guideline Must Know:** AGA suggests **against ESR/CRP alone** as screening for IBD in chronic watery diarrhea pathways; prefer stool inflammatory markers when the clinical question is “IBD vs functional.” \n- **Guideline Must Know:** AGA recommends **celiac testing** with **tTG-IgA plus total IgA** (add an IgG-based assay if IgA deficient) in chronic diarrhea/IBS-D-like presentations; ensure the patient is ingesting gluten if evaluating for new diagnosis. \n- **Guideline Must Know:** AGA suggests evaluating for **bile acid diarrhea** in chronic watery diarrhea (especially post-cholecystectomy/ileal disease); inpatient “practical” approach when formal testing unavailable is a time-limited trial of a bile acid sequestrant once infection excluded. \n- **Guideline Must Know:** IDSA emphasizes stool testing for bacterial pathogens when diarrhea is accompanied by **fever, bloody/mucoid stools, severe abdominal cramping/tenderness, or sepsis signs**; otherwise avoid broad stool workups that drive false positives and downstream harm. \n- Categorize stool phenotype to avoid shotgun orders: watery (secretory/osmotic), fatty (malabsorption), inflammatory (blood, high calprotectin), and medication-related; nocturnal watery diarrhea and large-volume output suggest secretory causes (e.g., bile acid diarrhea, microscopic colitis, endocrine) more than functional etiologies. \n- Microscopic colitis is a classic “overnight miss”: chronic watery diarrhea (often nocturnal) with a grossly normal colon; review triggers (PPIs, NSAIDs, SSRIs) and remember diagnosis requires **colonic biopsies**; first-line therapy for symptomatic disease is **budesonide** when confirmed or strongly suspected with GI input. \n- C. difficile can masquerade as chronic diarrhea (especially with intermittent antibiotics/PPIs): use guideline-based therapy for confirmed cases; **fidaxomicin** is preferred when available, with oral **vancomycin** an acceptable alternative for initial episodes per IDSA/SHEA focused update. \n- What can usually wait until daytime: breath tests for carbohydrate malabsorption/SIBO, advanced malabsorption panels, and colonoscopy scheduling decisions when the patient is stable; what should not wait is stopping offending agents, correcting volume/electrolytes, and placing isolation if infectious risk. \n- Pitfalls: giving antimotility agents before excluding **C. difficile/invasive infection**, missing **microscopic colitis** due to “normal colonoscopy,” and overlooking iatrogenic diarrhea from tube feeds, sorbitol-containing meds, Mg supplements, or laxative protocols that were never discontinued. \n- When to call GI urgently: suspected severe IBD flare, persistent high-output diarrhea with **worsening AKI**, need for inpatient colonoscopy/biopsies, concern for ischemic colitis/toxic megacolon, or refractory symptoms despite stopping offenders and addressing infection. \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- **MAP <65 mmHg** after **≥2 L** isotonic fluids (or fluid-limited patient with ongoing hypoperfusion), **lactate ≥2 mmol/L**, or need for vasopressors. \n- Severe electrolyte/acid-base derangements: **K⁺ <2.5 or >6.0 mmol/L**, symptomatic hypomagnesemia, severe metabolic acidosis, or arrhythmia/ECG changes. \n- Suspected fulminant colitis/toxic megacolon: severe abdominal pain/distension, ileus, peritonitis, rising WBC/creatinine, or systemic toxicity (especially with possible **C. difficile**). \n- Overt GI bleeding, hemodynamic instability, or concern for ischemic colitis (pain out of proportion, bloody diarrhea with vascular risk). \n- Immunocompromised host with persistent diarrhea plus fever, sepsis physiology, or inability to maintain hydration/renal function on the floor. \n\n## Orders to Place Now (3–6 bullets)\n- Order: Strict intake/output with stool count and daily weights — {stools_per_24h, estimated_volume_if_possible, nocturnal_yes_no}\n- Order: Basic metabolic panel + magnesium + phosphate — {now, repeat_interval_q6-12h_if_abnormal, repletion_protocol}\n- Order: CBC with differential — {now, trend_frequency_daily_or_more_if_bleeding}\n- Order: C. difficile stool testing (per institutional algorithm) + contact precautions — {unformed_stool_yes, stool_count_last_24h, recent_antibiotics_yes_no}\n- Order: Stool Giardia antigen (or PCR panel if indicated) — {exposure_risk, duration_weeks, immunocompetent_yes_no}\n- Order: Celiac serologies (tTG-IgA + total IgA) — {on_gluten_diet_yes_no, add_IgG_assay_if_IgA_low}\n\n## ABIM Style Question 1\n### Stem\nA 46-year-old man is admitted for evaluation of 6 weeks of nonbloody, watery diarrhea (6–8 stools/day) with mild cramping. He is immunocompetent and has no weight loss, anemia, hypoalbuminemia, recent travel, or family history of inflammatory bowel disease. Vital signs are stable. Basic metabolic panel and complete blood count are normal. Which of the following is the most appropriate next diagnostic test?\n### Options\nA. Erythrocyte sedimentation rate\nB. Stool ova and parasite examination (multiple specimens)\nC. Stool test for Giardia\nD. Serum antineutrophil cytoplasmic antibodies (ANCA)\nE. Empiric broad-spectrum antibiotics\n### Correct answer\nC\n### Rationale (2–4 sentences)\nAGA guidance for adults with chronic watery diarrhea without alarm features recommends targeted testing and specifically recommends **testing for Giardia**, a common, treatable cause. \nRoutine broad ova/parasite testing without high-risk travel is not recommended, and ESR/CRP or autoimmune serologies are not appropriate screening tests for this presentation. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 72-year-old woman hospitalized for atrial fibrillation is noted to have 3 months of chronic watery diarrhea, including nocturnal episodes. She takes a proton pump inhibitor and ibuprofen daily. She has no fever or blood in stool. A colonoscopy performed 2 weeks ago showed normal-appearing mucosa throughout. Current labs show normal hemoglobin and albumin. Which is the best next step to establish the diagnosis?\n### Options\nA. Reassure her that a normal colonoscopy rules out colitis\nB. Start loperamide immediately as first-line therapy\nC. Obtain random colonic biopsies to evaluate for microscopic colitis\nD. Order ESR and CRP to exclude inflammatory bowel disease\nE. Start empiric oral vancomycin for presumed C. difficile\n### Correct answer\nC\n### Rationale (2–4 sentences)\nThe pitfall is assuming a normal-appearing colon excludes microscopic colitis; diagnosis requires **colonic biopsies** despite normal endoscopic appearance. \nMedication exposures such as PPIs/NSAIDs increase suspicion, and confirming the diagnosis guides appropriate therapy (often **budesonide**). \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What duration defines chronic diarrhea in adults?\n A: **≥4 weeks** of loose or watery stools. \n- Q: In an immunocompetent adult with chronic watery diarrhea and no alarm features, which single stool pathogen test is specifically recommended?\n A: **Giardia** testing. \n- Q: What stool inflammatory markers are suggested to screen for inflammatory conditions such as IBD in chronic watery diarrhea pathways?\n A: **Fecal calprotectin** or **fecal lactoferrin**. \n- Q: What is the preferred target population for C. difficile testing in adults?\n A: Adults with **≥3 new, unexplained unformed stools in 24 hours**. \n\n## Guidelines & Key References (3–5 bullets)\n- AGA Clinical Practice Guideline: Laboratory evaluation of functional diarrhea and IBS-D in adults (2019) — https://www.gastrojournal.org/article/S0016-5085%2819%2941135-9/fulltext \n- ACG Guidelines Update: Diagnosis and Management of Celiac Disease (2023) — https://www.giboardreview.com/wp-content/uploads/2023/01/Guideline-ACG-Celiac-disease-Jan-2023.pdf \n- ACG Clinical Guideline: Management of Irritable Bowel Syndrome (2021) — https://webfiles.gi.org/links/PCC/ACG_Clinical_Guideline__Management_of_Irritable.11.pdf \n- IDSA Clinical Practice Guideline: Diagnosis and Management of Infectious Diarrhea (2017) — https://www.idsociety.org/practice-guideline/infectious-diarrhea/ \n- AGA Guideline: Medical management of microscopic colitis (2016) — https://gastro.org/clinical-guidance/medical-management-of-microscopic-colitis/ \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute on chronic diarrhea — {duration_weeks_months} — {stool_count_per_24h, nocturnal_yes_no} — {objective_evidence: I_Os, weight_change, BMP_abnormalities} — {treatment: IV_fluids, electrolyte_repletion, isolation}\n- Hypovolemia/dehydration due to diarrhea — {severity_mild_moderate_severe} — {evidence: orthostatics, tachycardia, BUN_Cr_ratio, urine_output} — {management: isotonic_fluids_amount, response, monitoring_plan}\n- Acute kidney injury due to volume depletion from diarrhea — {KDIGO_stage_if_known} — {baseline_Cr, peak_Cr, urine_output} — {supporting_data: FeNa_if_done, labs} — {treatment: fluids, nephrotoxin_hold}\n- Suspected or confirmed C. difficile infection — {test_result_and_method} — {severity_markers: WBC, Cr, fever, ileus} — {antibiotic_exposures} — {therapy_started: fidaxomicin_or_vancomycin, start_time} \n- Suspected microscopic colitis — {risk_meds: PPI_NSAID_SSRIs} — {features: watery_nocturnal, normal_endoscopy_if_known} — {plan: GI_consult, biopsies_ordered_or_pending} \n", "clostridioides-difficile-infection.md": "---\nfilename: clostridioides-difficile-infection.md\nid: clostridioides-difficile-infection\ntitle: Clostridioides difficile infection\nslug: clostridioides-difficile-infection\ntags: [infectious-diseases, inpatient, night-float]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n\n# Clostridioides difficile infection\n\n## Panic Card (3–6 bullets)\n- Place patient on contact enteric precautions now (gown/gloves; dedicated equipment); wash hands with soap and water (spores) and clean with sporicidal agent.\n- If unstable: ABCs, large-bore IV, **30 mL/kg crystalloid** if septic physiology, lactate, blood cultures if fever/hypotension; target **MAP ≥65 mmHg** with norepinephrine if shock.\n- Start therapy promptly if high suspicion/positive test: **fidaxomicin 200 mg PO BID x 10 d** or **vancomycin 125 mg PO QID x 10 d** (resource-dependent).\n- If fulminant (shock/ileus/megacolon): **vancomycin 500 mg PO/NG Q6H + metronidazole 500 mg IV Q8H**; if ileus add **vancomycin 500 mg PR Q6H**; get STAT CT abd/pelvis and surgery consult.\n- Stop offending antibiotics and high-risk meds if possible (esp. laxatives, unnecessary PPIs); avoid antimotility agents (risk toxic megacolon).\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Suspect CDI in adults with **≥3 new unformed stools in 24 h** without an alternate explanation (tube feeds, laxatives, ileus overflow diarrhea, enteral contrast, IBD flare). **Do not test** formed stool or asymptomatic patients; **do not “test for cure.”**\n- **Guideline Must Know:** Preferred testing uses a strategy that improves specificity (e.g., GDH + toxin with NAAT arbitration, or NAAT + toxin) when stool submission criteria are not tightly controlled; avoid NAAT-alone indiscriminate testing to reduce treatment of colonization.\n- **Guideline Must Know:** Avoid repeat testing during the same diarrheal episode (commonly **within 7 days**) and avoid retesting to document clearance; clinical response drives decisions.\n- Classify severity at diagnosis using objective markers: nonsevere if **WBC <15 ×10⁹/L** and **serum creatinine <1.5 mg/dL (133 µmol/L)** (use baseline trend if CKD); severe if **WBC ≥15 ×10⁹/L** or **Cr ≥1.5 mg/dL**; fulminant if severe plus **hypotension/shock, ileus, or toxic megacolon**.\n- **Guideline Must Know:** Initial episode (nonsevere or severe): **fidaxomicin 200 mg PO BID x 10 days** is preferred when feasible; **vancomycin 125 mg PO QID x 10 days** remains an acceptable alternative, especially with cost/formulary constraints.\n- If fidaxomicin/vancomycin unavailable for a clearly nonsevere first episode in low-risk patients, metronidazole may be used as a fallback, but avoid it for severe/fulminant disease and for recurrences when better agents are available.\n- **Guideline Must Know:** Fulminant CDI requires higher-dose therapy and systemic coverage: **vancomycin 500 mg PO/NG Q6H + metronidazole 500 mg IV Q8H**; if ileus, add **vancomycin 500 mg in 100 mL NS PR Q6H** (retain 30–60 min if possible).\n- **Guideline Must Know:** “What must happen now” on night float: confirm stool count/character, stop laxatives, start enteric precautions, assess volume status and sepsis physiology, obtain **CBC, BMP, lactate** (if ill), and start CDI therapy if fulminant or high-probability pending tests (especially if worsening leukocytosis, AKI, or systemic toxicity).\n- “What can wait until day team” (if stable): medication reconciliation for high-risk antibiotics/PPIs, stewardship review, arrange outpatient recurrence-prevention planning, and counseling on recurrence risk.\n- Escalate early for suspected toxic megacolon: severe pain/distention, peritonitis, rising lactate, worsening leukocytosis, ileus, or imaging with colonic dilation; avoid colonoscopy unless GI directs for specific indications (perforation risk).\n- Supportive care matters: aggressive IV fluids for hypovolemia, electrolyte replacement, maintain nutrition as tolerated, and VTE prophylaxis unless contraindicated; avoid antimotility agents (loperamide, diphenoxylate) due to risk of ileus/megacolon.\n- **Guideline Must Know:** First recurrence: fidaxomicin (standard **200 mg BID x 10 d** or extended-pulsed regimens) is preferred when feasible; alternatives include **vancomycin taper/pulse** (especially after prior vancomycin) based on risk and access.\n- Recurrent/high-risk patients may benefit from adjunctive recurrence prevention: consider **bezlotoxumab 10 mg/kg IV once** during standard-of-care antibiotics for patients with high recurrence risk (age ≥65, immunocompromised, severe CDI, prior CDI), but use caution with significant heart failure history. Confirm infusion access/criteria with pharmacy.\n- Microbiota restoration options for multiple recurrences: fecal microbiota–based therapies may be used after completion of CDI antibiotics in appropriate patients; ensure you are using them for **prevention of recurrence**, not acute CDI treatment, and follow product-specific timing windows.\n- Pitfalls: treating NAAT+ patients who are laxative-induced or colonized; missing fulminant CDI when diarrhea is absent due to ileus; forgetting PR vancomycin in ileus; continuing the precipitating antibiotic without reassessing necessity; and delaying surgery/ICU consult when systemic toxicity is evolving.\n- When to call ID/GI: diagnostic uncertainty (IBD flare vs CDI), multiple recurrences, need for bezlotoxumab/microbiota-based therapy coordination, severe refractory symptoms, or immunocompromised hosts with complicated courses.\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Hemodynamic instability: **MAP <65 mmHg** despite fluids, need for vasopressors, lactate rising, or new organ dysfunction consistent with septic shock.\n- Fulminant features: **ileus**, peritonitis, altered mental status, escalating abdominal pain/distention, or imaging concern for megacolon/perforation.\n- Marked lab severity or rapid progression: **WBC ≥30 ×10⁹/L**, rapidly rising creatinine/oliguria, or metabolic acidosis with systemic toxicity.\n- Need for advanced support: escalating oxygen/ventilatory support, worsening encephalopathy, or inability to take/absorb enteral therapy (consider NG/PR strategies and ICU monitoring).\n- Surgical concern: suspected toxic megacolon, perforation, or failure to improve on appropriate therapy with worsening systemic toxicity (urgent surgery consult).\n\n## Orders to Place Now (3–6 bullets)\n- Order: Contact enteric isolation — {start now; gown/gloves; soap-and-water hand hygiene; sporicidal cleaning}\n- Order: C. difficile stool testing algorithm — {only if ≥3 unformed stools/24 h; hold laxatives; send unformed stool}\n- Order: Fidaxomicin 200 mg PO BID x 10 days — {start if confirmed/high-probability CDI; adjust for NPO/ileus plans}\n- Order: Vancomycin PO 125 mg QID x 10 days — {use if fidaxomicin unavailable or per formulary; confirm ability to take PO/NG}\n- Order: Fulminant CDI regimen — {vancomycin 500 mg PO/NG Q6H + metronidazole 500 mg IV Q8H; add vancomycin 500 mg PR Q6H if ileus; STAT CT abd/pelvis if concern for megacolon/perforation}\n\n## ABIM Style Question 1\n### Stem\nA 71-year-old man on the medicine floor develops 10 watery stools over 24 hours on hospital day 6. He completed ceftriaxone and azithromycin for pneumonia 3 days ago. He is afebrile, BP 126/72 mmHg, HR 92/min, and has mild diffuse abdominal tenderness without guarding. Labs show WBC 13.2 ×10⁹/L and creatinine 1.1 mg/dL (baseline 1.0). A stool test returns positive for toxigenic C. difficile by a multistep algorithm. Which is the best initial treatment?\n### Options\nA. Fidaxomicin 200 mg orally twice daily for 10 days\nB. Metronidazole 500 mg intravenously every 8 hours for 10 days\nC. Vancomycin 500 mg orally every 6 hours plus metronidazole 500 mg IV every 8 hours\nD. Loperamide as needed plus oral hydration, no antibiotics\nE. Probiotics plus discontinuation of antibiotics only\n### Correct answer\nA\n### Rationale (2–4 sentences)\nFor an initial, nonfulminant CDI episode, guideline-preferred therapy is fidaxomicin (with oral vancomycin as an acceptable alternative), and metronidazole is reserved only when preferred agents are unavailable in low-risk nonsevere cases. Fulminant-dose vancomycin plus IV metronidazole is indicated for shock/ileus/megacolon, which he does not have. Antimotility agents are avoided due to risk of ileus and toxic megacolon.\n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 64-year-old woman with CKD (baseline creatinine 2.0 mg/dL) is admitted with abdominal pain and confusion. She has minimal stool output over 24 hours but has nausea, distention, and diffuse tenderness. Vitals: T 38.3°C, BP 86/54 mmHg after 2 L crystalloid, HR 118/min. Labs: WBC 28 ×10⁹/L, lactate 4.1 mmol/L. CT abdomen shows diffuse colitis with colonic dilation and concern for ileus. Stool testing is pending. Which is the best immediate antimicrobial regimen?\n### Options\nA. Fidaxomicin 200 mg PO BID only\nB. Vancomycin 125 mg PO QID only\nC. Vancomycin 500 mg PO/NG Q6H plus metronidazole 500 mg IV Q8H, and add vancomycin 500 mg PR Q6H\nD. Metronidazole 500 mg PO TID only\nE. Defer CDI therapy until stool testing results return\n### Correct answer\nC\n### Rationale (2–4 sentences)\nThis is fulminant CDI physiology (shock with ileus/megacolon concern), so immediate high-dose enteral vancomycin plus IV metronidazole is indicated, and ileus is the pitfall that necessitates adding rectal vancomycin to improve colonic delivery. Waiting for confirmatory testing risks deterioration, and lower-dose or single-agent regimens are inadequate in fulminant disease. What changed the decision here?\nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What symptom threshold should be met before sending C. difficile testing in adults?\n A: New onset **≥3 unformed stools in 24 hours** without an alternate explanation.\n- Q: What two lab cutoffs commonly define severe (not fulminant) CDI at diagnosis?\n A: **WBC ≥15 ×10⁹/L** or **serum creatinine ≥1.5 mg/dL (133 µmol/L)** (interpret with baseline in CKD).\n- Q: What is the key additional feature that makes CDI “fulminant”?\n A: Severe CDI plus **hypotension/shock, ileus, or toxic megacolon**.\n- Q: What is the adult oral/enteral vancomycin dose for fulminant CDI?\n A: **Vancomycin 500 mg PO/NG every 6 hours**, typically with **metronidazole 500 mg IV every 8 hours**.\n\n## Guidelines & Key References (3–5 bullets)\n- IDSA/SHEA: 2021 Focused Update on Management of Clostridioides difficile Infection in Adults (PDF) — https://www.idsociety.org/globalassets/idsa/practice-guidelines/cdi-2021-focused-update.pdf\n- IDSA/SHEA: Clostridioides difficile guideline landing page (2021) — https://www.idsociety.org/practice-guideline/clostridioides-difficile-2021-focused-update/\n- ACG: Prevention, Diagnosis, and Treatment of Clostridioides difficile Infections (2021) — https://www.giboardreview.com/wp-content/uploads/2021/12/Guidelines-ACG-C-Diff-2021.pdf\n- FDA: VOWST product information and package insert links (approved 2023; recurrence prevention) — https://www.fda.gov/vaccines-blood-biologics/vowst\n- FDA: REBYOTA prescribing information (approved 2022; recurrence prevention) — https://www.fda.gov/media/163587/download\n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- - Clostridioides difficile infection, {nonsevere|severe|fulminant}; evidence: {≥3 unformed stools/24 h; WBC ___ ×10⁹/L; Cr ___ mg/dL vs baseline ___}; test: {GDH/toxin/NAAT result}\n- - Sepsis due to CDI: {yes|no}; organ dysfunction: {hypotension MAP ___; lactate ___; AKI Cr ___}; treatment: {IV fluids ___ mL; vasopressor {yes|no}; antibiotics started at ___}\n- - Fulminant features present: {shock|ileus|toxic megacolon}; imaging: {CT/KUB findings}; consults: {ICU|surgery|GI} notified at ___\n- - Medication drivers addressed: precipitating antibiotics {stopped|continued with rationale}; laxatives {held}; PPI {stopped|continued with rationale}; antimotility agents {avoided}\n- - Response/monitoring plan: stool frequency trend; abdominal exam frequency; labs to trend {CBC/BMP/lactate}; escalation criteria documented (ICU/surgery triggers)\n", "gerd-and-esophageal-disorders.md": "---\nfilename: gerd-and-esophageal-disorders.md\nid: gerd-and-esophageal-disorders\ntitle: GERD and esophageal disorders\nslug: gerd-and-esophageal-disorders\ntags: [gastroenterology, gerd, dysphagia]\nlevel: resident\nestimated_time_min: 18\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# GERD and esophageal disorders\n## Panic Card (3–6 bullets)\n- If chest pain/epigastric pain: treat as ACS until excluded (ECG, troponins, CXR); give oxygen only if **SpO₂ <90%** and manage hemodynamics with **MAP ≥65 mmHg**.\n- If suspected esophageal perforation (sudden severe chest/neck pain, crepitus, fever, sepsis, post-emesis/instrumentation): **NPO**, 2 large-bore IVs, **broad-spectrum IV antibiotics now** (e.g., **piperacillin-tazobactam 4.5 g q6h** or **cefepime 2 g q8–12h + metronidazole 500 mg q8h**), urgent CT chest/abdomen with water-soluble oral contrast if feasible, call GI + thoracic surgery.\n- If esophageal food bolus with inability to handle secretions/drooling/respiratory compromise: **NPO**, suction setup, protect airway (early anesthesia if needed), **urgent endoscopy** request.\n- If active upper GI bleeding (hematemesis/melena, shock): resuscitate, **type & screen**, transfuse to **Hgb ≥7 g/dL** (higher if ongoing shock/ischemia), reve

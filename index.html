luten exposure or another diagnosis, or (3) complications (electrolyte derangements, severe anemia, bone/mineral issues, rare celiac crisis).\n- **Guideline Must Know:** Initial testing in adults should be done while the patient is on a **gluten-containing diet**; gluten restriction before testing lowers sensitivity of both serology and biopsy and is discouraged unless the situation demands immediate dietary change.\n- **Guideline Must Know:** First-line serology is **tissue transglutaminase IgA (tTG-IgA)** plus **total IgA** to detect IgA deficiency; if IgA deficient, use **tTG-IgG and/or deamidated gliadin peptide (DGP) IgG** rather than relying on IgA-based tests.\n- **Guideline Must Know:** Diagnostic confirmation in most adults requires **EGD with multiple duodenal biopsies** (including bulb and distal duodenum) because disease can be patchy; don’t assume a single normal-appearing biopsy rules it out.\n- **Guideline Must Know:** If clinical suspicion is high with negative serology (e.g., classic malabsorption, unexplained iron-deficiency anemia, dermatitis herpetiformis), proceed to **EGD/biopsies** for possible seronegative celiac disease or alternative enteropathy.\n- **Guideline Must Know:** If the patient is already on a gluten-free diet and needs diagnosis clarified, consider **HLA-DQ2/DQ8**: a **negative** result makes celiac disease very unlikely; a positive result is not diagnostic and may prompt a supervised **gluten challenge** planning with GI.\n- **Guideline Must Know:** Management cornerstone is strict **gluten-free diet** with dietitian involvement; inpatient role is to ensure safe nutrition orders and avoid iatrogenic gluten exposure in meds/supplements when feasible, while coordinating outpatient follow-up.\n- Now (what must happen tonight): stabilize volume/electrolytes; evaluate for competing dangerous diagnoses (sepsis, C. difficile, GI bleed, obstruction, pancreatitis); document stool frequency/volume, intake, and objective weight trends; review meds that worsen diarrhea (metformin, laxatives, antibiotics, magnesium supplements).\n- Now (diagnostic triage): if undiagnosed and stable, order celiac serologies and arrange GI follow-up for biopsy; if already admitted for another reason and suspicion is high, place a non-urgent GI consult for inpatient EGD decision-making (especially if anemia, severe symptoms, or need to clarify diagnosis before discharge).\n- Pitfall: starting a strict gluten-free diet immediately in a stable, undiagnosed patient can delay definitive diagnosis because serology and histology may normalize; if symptoms are severe and diet must change, document the reason and coordinate a plan for future diagnostic confirmation.\n- Can wait (unless unstable): micronutrient evaluation and replacement planning (iron studies, folate, B12, vitamin D, calcium, zinc), bone health counseling, and long-term complication screening; start replacement inpatient if clearly deficient or symptomatic (e.g., hypocalcemia, severe iron deficiency).\n- Nonresponsive symptoms in known celiac disease are commonly due to ongoing gluten exposure; on nights, focus on ruling out urgent mimics/complications and initiating a systematic plan: repeat serology, diet review, and consider other causes (microscopic colitis, pancreatic insufficiency, IBS, lactose intolerance, medication-related diarrhea).\n- Red flags for complications: new severe abdominal pain, weight loss despite reported adherence, GI bleeding, fevers, night sweats, obstructive symptoms, or unexplained hypoalbuminemia—consider malignancy (e.g., enteropathy-associated T-cell lymphoma) or refractory disease; involve GI early.\n- Rare but high-risk: “celiac crisis” (profuse diarrhea, dehydration, metabolic derangements, hypoproteinemia) may require ICU-level monitoring, aggressive repletion, and specialist input; consider concomitant infection and adrenal insufficiency when hypotension is disproportionate.\n- Dermatitis herpetiformis clue: intensely pruritic grouped vesicles (elbows/knees/buttocks/scalp) strongly supports gluten-sensitive disease; symptomatic rash control (often dapsone) is typically specialist-managed—on nights, focus on symptom relief, exclude infection, and arrange dermatology/GI follow-up.\n- Discharge priorities: ensure a clear diagnostic plan (serology results pending, biopsy plan if needed), dietitian referral, and follow-up for anemia/micronutrients; document whether patient was consuming gluten during testing and whether gluten restriction was started inpatient.\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Hemodynamic instability (e.g., **SBP <90 mmHg**, lactate rise, syncope/orthostasis not responding to initial fluids) or need for vasopressors.\n- Severe electrolyte/metabolic derangements requiring continuous monitoring: **K⁺ <2.8 or >6.0 mmol/L**, **Mg²⁺ <0.5 mmol/L**, **PO₄³⁻ <0.5 mmol/L**, severe hypoglycemia, or significant acid-base disturbance.\n- Inability to maintain oxygenation/airway due to encephalopathy, severe dehydration with altered mental status, or suspected sepsis.\n- Overt GI bleeding, rapidly falling hemoglobin, or suspected perforation/obstruction (peritonitis, rigid abdomen, free air).\n- Concern for refractory celiac disease/malignancy (alarm features, unexplained severe hypoalbuminemia, persistent villous atrophy history) requiring urgent GI involvement.\n\n## Orders to Place Now (3–6 bullets)\n- Order: Basic metabolic panel — {now, repeat_in_hours}\n- Order: Magnesium level — {now, recheck_after_repletion}\n- Order: Phosphorus level — {now, recheck_after_repletion}\n- Order: Tissue transglutaminase IgA and total IgA — {draw_time}\n- Order: CBC with differential — {now, repeat_interval}\n- Order: IV fluid bolus (balanced crystalloid) — {volume_ml, rate, reassess_after}\n\n## ABIM Style Question 1\n### Stem\nA 34-year-old hospitalized patient reports 6 months of diarrhea, bloating, and unintentional weight loss. Labs show microcytic anemia and mildly elevated aminotransferases. They are eating a normal diet that includes wheat. You suspect celiac disease and want the best initial diagnostic test strategy tonight.\n\n### Options\nA. Start a strict gluten-free diet now and recheck symptoms in 2 weeks \nB. Order tissue transglutaminase IgA and total IgA \nC. Order HLA-DQ2/DQ8 genotyping only \nD. Order anti-saccharomyces cerevisiae antibodies (ASCA) \nE. Order stool calprotectin as the primary diagnostic test\n\n### Correct answer\nB\n\n### Rationale (2–4 sentences)\nIn adults on a gluten-containing diet, the recommended first-line evaluation is **tTG-IgA with total IgA** to screen and identify IgA deficiency that would invalidate IgA-only testing. Most adults then require confirmatory **EGD with duodenal biopsies** if serology is positive or suspicion remains high. HLA testing is mainly useful to rule out celiac disease when patients are already gluten-free, not as an initial standalone test.\n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 52-year-old patient with chronic diarrhea and iron-deficiency anemia started a gluten-free diet 3 months ago on their own and reports partial improvement. They are now admitted for syncope and found to have orthostatic hypotension but are otherwise stable. You need to clarify whether they truly have celiac disease.\n\n### Options\nA. Order tissue transglutaminase IgA only \nB. Order HLA-DQ2/DQ8 genotyping \nC. Start oral budesonide for presumed refractory celiac disease \nD. Diagnose celiac disease based on symptom improvement alone and continue gluten avoidance \nE. Order duodenal biopsies immediately without considering diet status\n\n### Correct answer\nB\n\n### Rationale (2–4 sentences)\nWhen a patient has already reduced or eliminated gluten, serology and biopsy may normalize and become less reliable for diagnosis; in this setting, **HLA-DQ2/DQ8 negativity effectively rules out celiac disease**, while positivity is non-diagnostic and may lead to a supervised gluten challenge plan with GI. The pitfall is assuming symptom improvement on a gluten-free diet confirms the diagnosis. What changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: For best diagnostic accuracy, should celiac serology and biopsy be performed while the patient is eating gluten? \n A: Yes. Gluten restriction before testing can reduce the sensitivity of both serology and histology.\n- Q: Which two labs should be ordered together as first-line celiac screening in most adults? \n A: Tissue transglutaminase IgA and total IgA.\n- Q: In suspected celiac disease with IgA deficiency, which antibody class is preferred? \n A: IgG-based testing (tTG-IgG and/or DGP-IgG).\n- Q: What does a negative HLA-DQ2/DQ8 test imply in a patient already on a gluten-free diet? \n A: It makes celiac disease very unlikely.\n\n## Guidelines & Key References (3–5 bullets)\n- American College of Gastroenterology (ACG) Guidelines Update: Diagnosis and Management of Celiac Disease (2023) — https://doi.org/10.14309/ajg.0000000000002075\n- American Gastroenterological Association (AGA) Clinical Practice Update: Diagnosis and Monitoring of Celiac Disease (2019) — https://www.gastrojournal.org/article/S0016-5085(18)35408-8/fulltext\n- British Society of Gastroenterology (BSG): Diagnosis and management of adult coeliac disease (2014) — https://gut.bmj.com/content/63/8/1210\n- NICE Guideline NG20: Coeliac disease: recognition, assessment and management (2015; updated PDF) — https://www.nice.org.uk/guidance/ng20/resources/coeliac-diseaserecognition-assessment-and-management-pdf-1837325178565\n- AGA Clinical Practice Update: Management of Refractory Celiac Disease (2022) — https://www.giboardreview.com/wp-content/uploads/2022/11/AGA-Clin-Prac-Update-Management-of-refractory-celiac-dis-Nov-2022.pdf\n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Celiac disease — {suspected|confirmed}; {new diagnosis vs established}; evidence: {tTG-IgA/total IgA results, biopsy status, gluten intake status}\n- Diarrhea — {acute|chronic} with {volume/frequency}; suspected cause: {malabsorption vs infection vs medication}; objective evidence: {stool count, vitals, labs}\n- Dehydration/hypovolemia — severity: {mild|moderate|severe}; evidence: {orthostasis, tachycardia, creatinine rise, low urine output}; treatment: {IV fluids, electrolyte repletion}\n- Anemia — type: {iron deficiency vs other}; severity: {Hgb value}; evidence: {MCV, ferritin/iron studies if available}; treatment: {transfusion/iron plan}\n- Malnutrition — {moderate|severe} with criteria: {BMI/weight loss %, albumin if used clinically, intake history}; monitoring/treatment: {dietitian consult, refeeding risk precautions, thiamine/electrolytes}\n", "colorectal-cancer-screening.md": "---\nfilename: colorectal-cancer-screening.md\nid: colorectal-cancer-screening\ntitle: Colorectal cancer screening\nslug: colorectal-cancer-screening\ntags: [gastroenterology, preventive-care, screening]\nlevel: resident\nestimated_time_min: 12\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# Colorectal cancer screening\n\n## Panic Card (3–6 bullets)\n- If any red-flag symptoms (hematochezia/melena, **iron-deficiency anemia**, **unintentional weight loss**, obstructive symptoms), treat as diagnostic pathway, not “screening”; assess stability and urgency now. \n- If active bleeding or shock: ABCs, 2 large-bore IVs, type and screen, trend CBC; target **MAP ≥65 mmHg** and transfuse per clinical context; call GI early if ongoing bleed/instability. \n- Do not “repeat the stool test” after a positive noninvasive screen; **positive FIT/sDNA-FIT requires colonoscopy** to complete screening. \n- If inpatient is due/overdue but asymptomatic: prioritize safe discharge follow-up (referral + documented plan); avoid ordering inpatient FIT intended for outpatient screening. \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Night-float framing: CRC screening is preventive for asymptomatic, average-risk adults, but you’ll encounter it as “overdue screening,” “positive stool test,” or “chronic iron-deficiency anemia” discovered during admission; your job overnight is to identify red flags, avoid inappropriate inpatient screening, and create a reliable follow-up plan. \n- **Guideline Must Know:** Average-risk adults should be screened from **age 45 through 75**; ages **76–85** are selective/individualized based on health, prior screening, and preferences; **>85** generally no screening. \n- **Guideline Must Know:** Acceptable USPSTF strategies include **annual FIT**, **sDNA-FIT every 1–3 years**, **CT colonography every 5 years**, **flexible sigmoidoscopy every 5 years** (or **every 10 years + annual FIT**), or **colonoscopy every 10 years**; “best test is the one that gets done” after shared decision-making. \n- **Guideline Must Know:** ACG endorses **colonoscopy every 10 years** and **FIT annually** as primary modalities; other options (sDNA-FIT, CT colonography, capsule) are alternatives when colonoscopy/FIT not feasible. \n- **Guideline Must Know:** Any abnormal non-colonoscopy screening test must be followed by **timely diagnostic colonoscopy** to complete the screening process; do not substitute repeat FIT or imaging as “confirmation.” \n- **Guideline Must Know:** Screening recommendations apply to asymptomatic, average-risk adults (no prior CRC/advanced adenomas, no IBD colitis, no high-risk hereditary syndrome); if symptoms or high-risk history exist, route to diagnostic or high-risk surveillance pathways. \n- What must happen now (night shift): if the admission uncovers concerning features (e.g., **new iron-deficiency anemia**, overt bleeding, or obstructive symptoms), initiate diagnostic evaluation (CBC trend, iron studies, hemodynamics, consider CT if obstruction suspected) and escalate to GI if unstable or high concern; label it clearly as diagnostic workup, not screening. \n- What can wait until daytime: in stable, asymptomatic patients who are merely overdue, document “CRC screening due” with the preferred modality and place an outpatient referral/order; ensure discharge instructions include the test and the reason (preventive screening) and confirm the patient has a PCP pathway. \n- Pitfall: Ordering inpatient FIT for “screening” can create false reassurance or confusing positives (hospital diet, acute illness, recent NSAID use, inpatient anticoagulation workups); if a FIT was obtained anyway and is positive, treat it as needing colonoscopy follow-up, not repeat FIT. \n- High-risk family history shortcut for nights: if **1 first-degree relative** with CRC or advanced polyp **<60**, or **≥2 first-degree relatives** at any age, screening typically starts at **age 40 or 10 years before** the youngest diagnosis, with **colonoscopy every 5 years**; if **1 first-degree relative ≥60**, start at **age 40 or 10 years before** then resume average-risk intervals (often colonoscopy at standard intervals). \n- **Guideline Must Know:** Do not overpromise benefit in frail patients: screening benefit is greatest when life expectancy is sufficient (often framed as **~10+ years**); for older adults, increased procedure harms (prep dehydration/electrolytes, perforation, sedation events) should be weighed against benefit. \n- **Guideline Must Know:** A positive stool-based test should be paired with clear documentation of the follow-up plan and timeline (diagnostic colonoscopy); delays reduce the “completed screening” value and can miss lesions. \n- Practical inpatient counseling (1–2 minute script): “You qualify for CRC screening starting at **45**. Options include **annual FIT** or **colonoscopy every 10 years**. If we use a stool test and it’s positive, the next step is colonoscopy.” Keep it factual, avoid long debates at 2 a.m., and hand off to day team/PCP. \n- Anticoag/antiplatelet pitfall: patients sometimes ask about holding meds for colonoscopy while inpatient; avoid irreversible changes overnight unless a procedure is scheduled—most screening colonoscopies should be outpatient with coordinated periprocedural anticoagulation planning by the proceduralist/ordering clinician. \n- When the “screening” question is actually cancer concern: unexplained **microcytic anemia** in an adult male/postmenopausal female or persistent hematochezia should trigger diagnostic evaluation rather than outpatient screening deferral; document clearly to prevent discharge without follow-up. \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Hemodynamic instability or ongoing overt GI bleeding: **SBP <90**, **MAP <65 despite fluids**, syncope, rising lactate, or escalating transfusion requirement. \n- Suspected large-bowel obstruction or perforation (severe distention, peritonitis, free air, worsening pain with guarding) requiring urgent imaging and surgical/GI escalation. \n- Symptomatic anemia with end-organ ischemia or rapid Hb fall (e.g., **Hb drop ≥2 g/dL** with symptoms) needing urgent evaluation and consult. \n- New high-risk history suggesting hereditary syndrome (multiple early cancers, very young CRC in family) needing expedited GI/genetics referral planning. \n\n## Orders to Place Now (3–6 bullets)\n- Order: CBC with differential — {now; repeat in 6–12 h if concern for ongoing bleed}\n- Order: Iron studies (ferritin, iron, TIBC, transferrin saturation) — {indication: suspected iron-deficiency anemia}\n- Order: Type and screen — {indication: overt bleeding or anticipated transfusion}\n- Order: Gastroenterology consult — {indication: positive FIT/sDNA-FIT needing colonoscopy plan OR suspected diagnostic CRC workup}\n- Order: Referral: Gastroenterology (outpatient) — {reason: colorectal cancer screening; preferred modality: FIT annually vs colonoscopy q10y; timeframe: within 4–8 weeks}\n\n## ABIM Style Question 1\n### Stem\nA 47-year-old man is admitted for cellulitis. He has no gastrointestinal symptoms, no family history of colorectal cancer, and no prior colorectal screening. He asks when he should start screening and chooses colonoscopy as his preferred method. What is the recommended screening interval for colonoscopy in an average-risk adult with a normal examination?\n### Options\nA. Every 1 year \nB. Every 3 years \nC. Every 5 years \nD. Every 10 years \nE. Every 15 years \n### Correct answer\nD\n### Rationale (2–4 sentences)\nFor average-risk adults who choose colonoscopy, the recommended screening interval after a normal, high-quality exam is **every 10 years** per major U.S. guidelines. Colonoscopy is one of several acceptable strategies; the key is adherence to an evidence-based interval and completion of follow-up if abnormalities are found. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 42-year-old woman is hospitalized for asthma exacerbation. She has no GI symptoms but reports her father was diagnosed with colorectal cancer at age 52. She has never been screened. Which is the most appropriate colorectal cancer screening plan?\n### Options\nA. Begin screening at age 45 with annual FIT \nB. Begin screening now with colonoscopy and repeat every 10 years if normal \nC. Begin screening now with colonoscopy and repeat every 5 years if normal \nD. Begin screening at age 50 with colonoscopy every 10 years \nE. No screening is indicated because she is asymptomatic \n### Correct answer\nC\n### Rationale (2–4 sentences)\nThis is a higher-risk family history (first-degree relative with CRC **<60**), so screening should begin at **age 40 or 10 years before** the youngest diagnosis (whichever is earlier), using colonoscopy with **5-year** intervals if normal. The pitfall is treating her as average risk and delaying or using average-risk intervals. \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What is the recommended starting age for average-risk colorectal cancer screening in current USPSTF guidance? \n A: **45 years** for average-risk, asymptomatic adults. \n- Q: After a positive FIT done as screening, what is the next required step to complete screening? \n A: **Diagnostic colonoscopy**; do not repeat FIT to “confirm.” \n- Q: What is the standard interval for screening colonoscopy after a normal exam in an average-risk adult? \n A: **10 years** if the colonoscopy was high quality and normal. \n- Q: In adults aged 76–85, how should screening decisions be made? \n A: Selectively/individualized based on overall health, prior screening history, and patient preferences. \n\n## Guidelines & Key References (3–5 bullets)\n- USPSTF. Colorectal Cancer: Screening (2021). https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/colorectal-cancer-screening \n- USPSTF Recommendation Statement in JAMA (2021). https://jamanetwork.com/journals/jama/fullarticle/2779985 \n- American College of Gastroenterology (ACG). ACG Clinical Guidelines: Colorectal Cancer Screening (2021) PDF. https://medicine.uams.edu/familymedicine/wp-content/uploads/sites/7/2021/07/ACG_Clinical_Guidelines__Colorectal_Cancer.14.pdf \n- American Cancer Society (ACS). Guideline for Colorectal Cancer Screening (2018; web living page). https://www.cancer.org/cancer/types/colon-rectal-cancer/detection-diagnosis-staging/acs-recommendations.html \n- American Gastroenterological Association (AGA) press release summarizing MSTF updated screening recommendations (2021). https://gastro.org/press-releases/u-s-multi-society-task-force-on-crc%e2%80%afreleases-updated-screening-recommendations/ \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- CRC screening status: {up-to-date|overdue|unknown}; last test {type/date/result}; average-risk criteria met {yes/no}; plan {FIT annually|colonoscopy q10y|other} with timeframe {date/window}\n- Positive screening test: {FIT|sDNA-FIT|other} positive on {date}; symptom status {asymptomatic|symptoms listed}; follow-up plan: diagnostic colonoscopy {ordered/referred} within {timeframe}; barrier(s) {transportation|insurance|no PCP|other}\n- Iron-deficiency anemia prompting diagnostic evaluation: acuity {new|chronic}; severity {Hb value}; suspected source {GI suspected}; objective evidence {MCV/ferritin}; actions {iron studies ordered|GI consult|imaging planned}\n- Red-flag GI symptoms: {hematochezia|melena|weight loss|change in bowel habits|obstructive symptoms}; objective evidence {vitals/labs/imaging}; escalation {GI|surgery|ICU} and rationale {instability/obstruction concern}\n", "mesenteric-ischemia.md": "---\nfilename: mesenteric-ischemia.md\nid: mesenteric-ischemia\ntitle: mesenteric ischemia\nslug: mesenteric-ischemia\ntags: [vascular, gi, night-float]\nlevel: resident\nestimated_time_min: 20\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# mesenteric ischemia\n\n## Panic Card (3–6 bullets)\n- Treat as surgical emergency: large-bore IV x2, NPO, oxygen to **SpO₂ ≥92%** (or baseline goal), place on monitor, and start **crystalloid bolus 500–1000 mL** if hypotensive while reassessing for overload.\n- STAT imaging: order **CTA abdomen/pelvis with IV contrast NOW** (do not delay for creatinine if life-threatening concern) and call **general surgery + vascular surgery/IR** immediately if high suspicion.\n- Start empiric infection control: give **broad-spectrum IV antibiotics within 1 hour** (gut translocation risk) and draw lactate, CBC, CMP, VBG/ABG.\n- Start anticoagulation if no major contraindication: **unfractionated heparin bolus 80 units/kg IV then infusion 18 units/kg/h** titrate to therapeutic aPTT/anti-Xa; hold only for active life-threatening bleeding.\n- Red flags = OR/ICU: **peritonitis**, **persistent lactate rise**, **pH <7.30**, **pressors to keep MAP ≥65 mmHg**, or worsening shock/mental status despite resuscitation.\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Think “pain out of proportion” plus risk factors: atrial fibrillation/recent MI (embolus), diffuse atherosclerosis (thrombosis), shock/pressors (non-occlusive mesenteric ischemia, NOMI), hypercoagulable states/cancer/portal HTN (mesenteric venous thrombosis, MVT); early exam may be benign until infarction occurs.\n- What must happen now: stabilize perfusion and oxygenation, get **CTA immediately**, give **broad-spectrum antibiotics**, and involve **surgery + vascular/IR** early; time lost equals bowel lost and mortality rises when diagnosis/treatment are delayed.\n- **Guideline Must Know:** In suspected acute mesenteric ischemia, **CTA should be performed without delay** as the first-line diagnostic test; plain abdominal radiographs are not recommended to “rule it out,” and labs alone cannot exclude ischemia. \n- **Guideline Must Know:** Start resuscitation as soon as AMI is suspected: restore intravascular volume, correct electrolytes/acid-base issues, and decompress stomach if vomiting/ileus; aim for **MAP ≥65 mmHg** with careful reassessment (over-resuscitation can worsen gut edema/compartment physiology).\n- **Guideline Must Know:** Give **broad-spectrum antibiotics immediately** (risk of bacterial translocation/sepsis once ischemia occurs), even before definitive proof if clinical suspicion is high.\n- **Guideline Must Know:** Unless contraindicated, initiate **systemic anticoagulation with IV unfractionated heparin** early in AMI (especially arterial embolus/thrombosis and MVT); UFH is preferred on nights because it is rapidly titratable and reversible.\n- **Guideline Must Know:** If there is **overt peritonitis** (rebound/guarding/rigidity), do not wait for “perfect” labs or serial exams: urgent **laparotomy/laparoscopy** for source control, bowel viability assessment, and resection of necrotic bowel is indicated.\n- **Guideline Must Know:** For **arterial occlusion** (embolus or thrombosis) and when expertise is available, **endovascular revascularization is preferred** (e.g., embolectomy/thrombectomy, angioplasty/stenting), with open surgery reserved for select cases or when endovascular therapy is not feasible.\n- **Guideline Must Know:** In **NOMI**, the treatment is physiology-first: correct the precipitating shock/low-flow state, minimize vasoconstrictors when possible, optimize cardiac output, and consider **intra-arterial vasodilator infusion (e.g., papaverine)** in coordination with IR/vascular when NOMI is suspected/confirmed.\n- **Guideline Must Know:** In **MVT**, many patients can be managed medically with **continuous UFH infusion** (therapeutic anticoagulation) plus supportive care; escalate to endovascular/surgical options for clinical deterioration, peritonitis, or failure of anticoagulation.\n- Don’t be falsely reassured by “normal” lactate: lactate may be normal early; trending matters. Worrisome trajectories include **rising lactate**, **increasing anion gap metabolic acidosis**, or escalating opioid requirement with persistent severe pain.\n- Night-float practical differentiation: ischemic colitis often has crampy pain and hematochezia with watershed distribution and is frequently nonoperative unless peritonitis/gangrene; AMI more often presents with sudden severe pain, high-risk vascular history, and rapid deterioration—CTA helps differentiate patterns and directs revascularization.\n- Hemodynamic strategy nuance: norepinephrine may be needed to maintain **MAP ≥65 mmHg**, but excessive vasoconstriction can worsen splanchnic perfusion (especially NOMI); use the lowest effective dose, consider adding inotropy if low-output, and fix upstream causes (arrhythmia, hypovolemia, sepsis).\n- Confirm Before Proceed: catheter-directed thrombolysis or high-dose thrombolytics (if considered by IR/vascular) requires careful screening for bleeding risk and recent stroke; do not “green light” without specialist-led risk review and documented contraindication check.\n- What can wait (after CTA/consults/resuscitation underway): hypercoagulable workup (if unprovoked MVT), long-term antithrombotic plan, atherosclerosis risk optimization, and surveillance imaging after revascularization—these are important but should not delay diagnosis/reperfusion tonight.\n- Common pitfalls: delaying CTA for “GI workup,” attributing pain to opioid-seeking, giving large doses of opioids that mask peritoneal signs without reassessment, stopping anticoagulation reflexively for minor blood-streaked stool, and failing to call surgery/vascular early when the CT is “pending.”\n- Communication must-haves on sign-out: suspected etiology (embolus vs thrombosis vs NOMI vs MVT), last normal time/onset, hemodynamic trend (MAP/pressors), acid-base trend (**pH**, lactate), anticoag status, and consult response times (OR/IR availability).\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- **Peritonitis** on exam or CT signs of transmural infarction (pneumatosis with portal venous gas, free air) or escalating abdominal compartment physiology.\n- Hemodynamic instability requiring **vasopressors to maintain MAP ≥65 mmHg**, or rising pressor needs despite **≥30 mL/kg** (or individualized) resuscitation.\n- Rapidly worsening metabolic derangements: **lactate ≥4 mmol/L** or rising on serial checks, **pH <7.30**, or new/worsening acute kidney injury with shock.\n- Escalating respiratory support (new **HFNC/NRB**, intubation need) or altered mental status in the setting of suspected bowel ischemia/sepsis.\n- CTA-confirmed arterial occlusion, NOMI with ongoing ischemia, or MVT with clinical deterioration: requires **urgent vascular/IR + surgery** coordination.\n\n## Orders to Place Now (3–6 bullets)\n- Order: CT angiography abdomen/pelvis with IV contrast — {indication: suspected acute mesenteric ischemia; allergy history: yes/no; creatinine: {value}; IV access: {18G/20G x2}}\n- Order: CBC with differential, CMP, magnesium, phosphorus, coagulation panel, type and screen — {draw now: yes; repeat lactate q{2-4}h x{2-3}}\n- Order: Lactate (serum) and VBG/ABG — {baseline now; repeat q{2-4}h; notify if lactate ≥{4} or pH <{7.30}}\n- Order: Unfractionated heparin infusion protocol — {bolus: 80 units/kg IV; infusion: 18 units/kg/h; monitoring: aPTT/anti-Xa q{6}h; hold parameters: {active major bleeding/platelets <50 x10^9/L}}\n- Order: Broad-spectrum antibiotic — {agent: piperacillin-tazobactam 4.5 g IV q6h OR cefepime 2 g IV q8h + metronidazole 500 mg IV q8h; renal dosing: {eGFR}}\n- Order: NPO, nasogastric tube to low intermittent suction, IV fluids — {fluid: balanced crystalloid; bolus: {500-1000} mL; maintenance: {rate}; urine output goal: **≥0.5 mL/kg/h**}\n\n## ABIM Style Question 1\n### Stem\nA 71-year-old man with atrial fibrillation (not anticoagulated) develops sudden, severe diffuse abdominal pain that is “10/10” and out of proportion to a soft abdomen with minimal tenderness. He is afebrile, HR 122/min, BP 104/62 mmHg, RR 22/min. Lactate is 2.1 mmol/L and WBC is 14 x10^9/L. What is the best next step?\n### Options\nA. Obtain CT angiography of the abdomen and pelvis with IV contrast immediately \nB. Order abdominal radiographs and repeat abdominal exam in 4 hours \nC. Start a proton pump inhibitor infusion and test for H. pylori \nD. Give magnesium citrate and discharge if pain improves \nE. Obtain right upper quadrant ultrasound for biliary colic \n### Correct answer\nA\n### Rationale (2–4 sentences)\nAcute mesenteric ischemia must be assumed in severe pain out of proportion to exam, especially with atrial fibrillation, and **CTA should be performed without delay** to confirm arterial occlusion and guide revascularization. Early lactate can be normal or only mildly elevated, so delaying imaging for serial exams increases risk of bowel infarction. Plain radiographs and ultrasound do not reliably diagnose AMI and should not postpone CTA.\n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 78-year-old woman with diffuse atherosclerosis presents with abrupt severe abdominal pain and vomiting. Exam shows marked pain with minimal tenderness. BP is 92/54 mmHg, HR 118/min. Creatinine is 3.2 mg/dL (baseline unknown). Lactate is 3.8 mmol/L. The team hesitates to order contrast imaging because of kidney injury. What is the best next step?\n### Options\nA. Defer contrast studies and obtain noncontrast CT first \nB. Obtain CT angiography abdomen/pelvis with IV contrast immediately while resuscitating \nC. Start total parenteral nutrition and observe overnight \nD. Treat empirically for pancreatitis and reassess after lipase returns \nE. Obtain colonoscopy to evaluate for ischemic colitis \n### Correct answer\nB\n### Rationale (2–4 sentences)\nThe pitfall is delaying definitive diagnosis for kidney concerns: suspected acute mesenteric ischemia is life-threatening, and **CTA should not be delayed** when clinical suspicion is high, even with acute kidney injury, because rapid reperfusion decisions depend on vascular imaging. Simultaneous resuscitation (optimize **MAP ≥65 mmHg**) and early consults are essential; noncontrast CT and colonoscopy can miss or delay actionable arterial findings. What changed the decision here?\nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: In suspected acute mesenteric ischemia, what is the first-line diagnostic imaging test that should not be delayed? \n A: CT angiography of the abdomen and pelvis with IV contrast.\n- Q: What is the initial anticoagulation typically used when AMI is suspected and there is no major contraindication? \n A: IV unfractionated heparin, commonly a bolus then continuous infusion titrated to therapeutic aPTT/anti-Xa.\n- Q: Name one objective finding that mandates emergent surgical exploration rather than observation. \n A: Peritonitis on exam or imaging evidence of transmural infarction (e.g., pneumatosis with portal venous gas or free air).\n- Q: In NOMI, what is the primary management focus? \n A: Correct the underlying low-flow/shock state and improve mesenteric perfusion, including minimizing vasoconstrictors when feasible.\n\n## Guidelines & Key References (3–5 bullets)\n- World Society of Emergency Surgery (WSES) Acute Mesenteric Ischemia: Updated Guidelines (2022) — https://link.springer.com/content/pdf/10.1186/s13017-022-00443-x.pdf\n- American College of Radiology (ACR) Appropriateness Criteria: Imaging of Mesenteric Ischemia (narrative) — https://acsearch.acr.org/docs/70909/Narrative/\n- Society for Vascular Surgery (SVS) Clinical Practice Guidelines: Chronic Mesenteric Ischemia (2021) — https://www.jvascsurg.org/article/S0741-5214%2820%2932286-2/fulltext\n- European Society for Vascular Surgery (ESVS) Clinical Practice Guidelines on Diseases of the Mesenteric and Renal Arteries and Veins (2025) — https://www.ejves.com/article/S1078-5884%2825%2900516-7/fulltext\n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute mesenteric ischemia, type {arterial embolus|arterial thrombosis|NOMI|mesenteric venous thrombosis}, onset {time/last-known-well}, suspected cause {AF|atherosclerosis|shock/pressors|hypercoagulable}\n- Severity/organ dysfunction: {lactate value/trend}, {pH/anion gap}, hemodynamics {MAP, pressors}, renal {creatinine/urine output}, mental status {baseline vs current}\n- Objective evidence: exam {pain out of proportion|peritonitis yes/no}, imaging {CTA findings: vessel, occlusion %, bowel wall changes, pneumatosis/portal venous gas yes/no}\n- Treatment supporting acuity: {IV fluids/pressor support}, {antibiotics started time}, {UFH anticoagulation started/held and why}, consults {surgery/vascular/IR contacted time}\n- Procedures/plan: {endovascular revascularization planned vs OR}, Confirm Before Proceed items documented {bleeding risk review for thrombolysis/reversal decisions}\n", "nutrition-and-enteral-feeding.md": "---\nfilename: nutrition-and-enteral-feeding.md\nid: nutrition-and-enteral-feeding\ntitle: nutrition and enteral feeding\nslug: nutrition-and-enteral-feeding\ntags: [nutrition, enteral-feeding, night-float]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# nutrition and enteral feeding\n\n## Panic Card (3–6 bullets)\n- If acute respiratory distress, vomiting, or suspected aspiration: stop feeds now, suction airway, place head of bed **30–45°**, give **O₂ to goal SpO₂ ≥92%** (or **88–92%** if chronic hypercapnia), and assess need for ICU/airway protection.\n- If tube dislodgement or malposition suspected (new cough with feeds, inability to flush, external length change): stop feeds; “Confirm Before Proceed” before use—do not restart feeds or give meds until placement verified per institutional policy (often **radiograph** for NG/OG).\n- If hemodynamic instability (rising pressor needs, escalating lactate, mottled/cool extremities): hold enteral feeds until resuscitated; prioritize **MAP ≥65 mmHg** and perfusion, then reassess for cautious reinitiation.\n- If refeeding risk with new nutrition (starvation, alcoholism, very low BMI): start low and monitor—give **thiamine 100 mg IV/PO now**, check/replace **K⁺, Mg²⁺, PO₄³⁻** urgently, and avoid rapid calorie escalation.\n- If hypoglycemia while on tube feeds/insulin: treat immediately with **dextrose**; if feeds stopped unexpectedly, start dextrose infusion and reduce/hold insulin to prevent recurrent hypoglycemia.\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- On nights, the highest-yield “enteral feeding” problems are not formula selection but safety: tube position, aspiration risk, feed intolerance, glycemic swings, and electrolyte shifts (especially refeeding), with clear “hold vs continue” logic that avoids reflexive prolonged NPO.\n- **Guideline Must Know:** For adults who cannot meet needs orally, enteral nutrition is preferred when the gut works; in critically ill adults, initiate early EN within **24–48 h** when appropriate rather than waiting for bowel sounds or flatus, but do not force feeds through shock. (SCCM/ASPEN critical care guidance)\n- What must happen now: verify access safety (tube location and patency), set aspiration precautions (HOB **30–45°**, oral care), define a starting rate, and order monitoring labs for the first 48–72 h if risk of refeeding or intolerance; what can wait: fine-tuning macro goals, specialty formulas, and long-term access decisions (PEG) unless there is an urgent barrier to feeding.\n- **Guideline Must Know:** In hemodynamic compromise, hold EN until the patient is fully resuscitated and stable; cautious initiation/reinitiation may be considered during de-escalation of vasopressors, with close monitoring for gut ischemia symptoms. (SCCM/ASPEN critical care guidance)\n- Practical starting targets (adult inpatient, not a dietitian substitute): start at **10–30 mL/h continuous** if uncertain tolerance or high aspiration risk; advance every **8–12 h** as tolerated to ordered goal, prioritizing protein delivery over “full calories” in early critical illness when appropriate.\n- **Guideline Must Know:** Do not stop feeds for low gastric residual volumes; avoid routine holds for GRV below a high threshold (commonly **<500 mL**) in the absence of other intolerance signs, because premature interruptions worsen calorie/protein delivery without clear aspiration benefit. (SCCM/ASPEN critical care guidance)\n- Feeding intolerance is a syndrome, not a number: concerning findings include recurrent emesis, increasing abdominal distention/pain, absent bowel gas with worsening exam, high NG output, rising lactate, or new vasopressor escalation; respond by reducing rate, switching to continuous, adding a prokinetic, and considering postpyloric access rather than repeated full stoppages.\n- **Guideline Must Know:** If aspiration risk is high (ongoing vomiting, poor airway protection, recurrent aspiration, intolerance of gastric feeds), consider postpyloric feeding and use a continuous infusion strategy; always keep HOB elevated unless contraindicated. (SCCM/ASPEN and ASPEN safe practices)\n- Refeeding syndrome is the classic night-float pitfall: risk is highest with little/no intake for several days, alcoholism, significant weight loss, very low BMI, and baseline electrolyte depletion; watch for **hypophosphatemia**, **hypokalemia**, and **hypomagnesemia** after nutrition starts, plus edema, arrhythmia, weakness, and respiratory failure.\n- **Guideline Must Know:** In high-risk refeeding, give **thiamine 100 mg** before and during early feeding, start at low calories (often ~**10 kcal/kg/day** in very high-risk states), and monitor/replace **PO₄³⁻, K⁺, Mg²⁺** frequently (e.g., at least daily, often **q12–24 h** initially) while slowly advancing. (NICE CG32; ASPEN refeeding consensus/safe practices)\n- Glycemic management: tube feeds behave like continuous carbohydrate infusion; prevent hypoglycemia by matching insulin to feed delivery and creating a “what if feeds stop” plan (dextrose rescue). Target inpatient glucose commonly **140–180 mg/dL** for most nonpregnant adults, avoiding tight control that increases hypoglycemia. (ADA inpatient standards)\n- **Guideline Must Know:** Use standardized protocols/order sets for inpatient dysglycemia; check A1C if not available within **3 months** in patients with diabetes or significant hyperglycemia, and prefer scheduled basal plus nutritional/correction insulin over sliding scale alone. (ADA inpatient standards)\n- Meds through tubes are a frequent source of clogging and underdosing: flush before/after each medication and avoid crushing extended-release/enteric-coated products; if the tube clogs, use warm water flushes first and reassess medication formulation rather than repeated forceful flushing that risks tube disruption. (ASPEN safe practices)\n- Common “can’t eat” orders at night: avoid prolonged NPO for routine imaging/procedures without clear instructions; if a procedure is uncertain, consider a time-limited hold with a restart plan (and dextrose/insulin adjustments) rather than an open-ended stop.\n- When to call for help: early dietitian/nutrition support consult for severe malnutrition, complex electrolyte instability, or prolonged intolerance; GI/IR for difficult access or recurrent dislodgement; ICU if feeding intolerance occurs with shock physiology, rising lactate, or suspected bowel ischemia.\n- Red flags suggesting bowel ischemia or catastrophic intolerance (ICU/STAT evaluation): abdominal pain out of proportion, rigid abdomen, persistent lactic acidosis, escalating pressors, GI bleeding, or pneumatosis/portal venous gas on imaging; stop EN and treat as a medical emergency.\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- New or worsening respiratory failure during feeds (increasing O₂ needs, recurrent emesis/aspiration, need for NIV/HFNC or impending intubation).\n- Hemodynamic instability with EN (escalating vasopressors, **MAP <65 mmHg** despite resuscitation, rising lactate, or signs of poor perfusion).\n- Suspected bowel ischemia or perforation (severe/worsening abdominal pain, peritonitis, GI bleeding, **lactate rising**, imaging concern such as pneumatosis).\n- Severe refeeding physiology after starting nutrition (symptomatic arrhythmia, weakness/respiratory failure, or refractory **PO₄³⁻ <0.5 mmol/L** or equivalent severe hypophosphatemia with clinical instability).\n- Recurrent tube malposition/dislodgement or inability to safely administer meds/feeds despite bedside troubleshooting (GI/IR consult for definitive access).\n\n## Orders to Place Now (3–6 bullets)\n- Order: Enteral nutrition — {formula} at {start_rate_mL_per_h} continuous; advance by {step_mL_per_h} q{hours} to goal {goal_rate_mL_per_h}; hold parameters {vomiting|aspiration|GRV_threshold|hemodynamic_instability}\n- Order: Aspiration precautions — HOB {30–45} degrees; oral care q{shift}; suction PRN; swallow evaluation {if dysphagia suspected}\n- Order: Tube placement verification — {KUB radiograph|pH check per policy} prior to use; document external length {cm} each shift\n- Order: Refeeding risk labs — BMP + Mg + Phos q{12–24}h x {48–72}h; replace electrolytes to targets {K ≥4.0 mmol/L, Mg ≥0.8 mmol/L, Phos ≥0.8 mmol/L}\n- Order: Thiamine — {100} mg {IV|PO} daily x {3–5} days (give first dose now if high risk for refeeding)\n- Order: Inpatient glucose monitoring/insulin protocol — POC glucose q{4–6}h; basal insulin {units} daily + nutritional insulin {units} q{6}h with feeds + correction scale; if feeds stop start D10W at {rate} and hold nutritional insulin\n\n## ABIM Style Question 1\n### Stem\nA 62-year-old man with alcohol use disorder is admitted for severe pancreatitis. He has had minimal oral intake for 8 days. On night float, a nasogastric tube is placed and continuous enteral feeding is ordered to start immediately at the goal rate. His baseline labs show potassium 3.3 mmol/L, magnesium 0.55 mmol/L, and phosphate 0.7 mmol/L. He is hemodynamically stable on room air. Which of the following is the best next step to reduce the most serious complication of initiating nutrition?\n### Options\nA. Start feeds at the goal rate and recheck electrolytes in 48 hours\nB. Administer thiamine now, replete electrolytes, and start feeds at a low rate with close monitoring\nC. Hold all nutrition for 72 hours and give only IV fluids\nD. Switch to bolus gastric feeds to reduce aspiration risk\nE. Start insulin infusion to maintain glucose 80–110 mg/dL during feeding initiation\n### Correct answer\nB\n### Rationale (2–4 sentences)\nThis patient is high risk for refeeding syndrome given prolonged poor intake and baseline electrolyte depletion; thiamine plus aggressive replacement and slow caloric advancement reduces life-threatening hypophosphatemia-related arrhythmia and respiratory failure. Guideline-based nutrition support emphasizes cautious initiation with frequent monitoring in high-risk patients rather than immediate goal feeding. Tight glucose control increases hypoglycemia risk and is not recommended for most inpatients.\n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 70-year-old woman with septic shock is in the ICU on norepinephrine at 0.25 µg/kg/min with rising lactate and cool extremities. A new order is placed to start continuous enteral feeds overnight because she has been NPO for 2 days. Her abdomen is soft but mildly distended. Which is the best next step regarding enteral feeding?\n### Options\nA. Start full-rate gastric feeds now to prevent gut mucosal atrophy\nB. Start trophic feeds now and advance rapidly every 2 hours regardless of pressor dose\nC. Hold enteral feeds until she is adequately resuscitated and vasopressor requirements are stable or decreasing\nD. Switch immediately to bolus feeds to improve tolerance\nE. Place a postpyloric tube and start full-rate feeds immediately despite shock\n### Correct answer\nC\n### Rationale (2–4 sentences)\nEnteral feeding should be withheld in hemodynamic instability until resuscitation and perfusion are adequate; escalating vasopressors and rising lactate raise concern for impaired gut perfusion and ischemia risk. The pitfall is assuming “some feeds are always safe” during active shock; even trophic feeding requires caution and close monitoring once pressors are stable or de-escalating. What changed the decision here?\nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: Should you restart a newly placed NG/OG tube for feeds before confirmation of placement?\n A: No. Do not use the tube for feeds or medications until placement is verified per policy (often radiographic confirmation for NG/OG).\n- Q: What head-of-bed angle reduces aspiration risk during tube feeding?\n A: Maintain **30–45°** elevation unless contraindicated.\n- Q: In a high-risk refeeding patient, which electrolytes must be monitored closely after starting nutrition?\n A: **Phosphate, potassium, and magnesium** should be checked and replaced frequently during initiation and advancement.\n- Q: What is a typical inpatient glucose target range for most nonpregnant adults receiving enteral feeds?\n A: **140–180 mg/dL** is a common target range to reduce complications while minimizing hypoglycemia.\n\n## Guidelines & Key References (3–5 bullets)\n- SCCM/ASPEN: Guidelines for the Provision and Assessment of Nutrition Support Therapy in the Adult Critically Ill Patient (2016) — https://aspenjournals.onlinelibrary.wiley.com/doi/epdf/10.1177/0148607115621863\n- ESPEN: Practical and partially revised guideline: Clinical nutrition in the intensive care unit (2023) — https://www.clinicalnutritionjournal.com/article/S0261-5614(23)00230-3/fulltext\n- ESPEN: Practical guideline: Nutritional support for polymorbid medical inpatients (2024) — https://www.clinicalnutritionjournal.com/article/S0261-5614(24)00008-6/fulltext\n- NICE: Nutrition support for adults (CG32; last updated 2017) — https://www.nice.org.uk/guidance/cg32\n- ADA: Diabetes Care in the Hospital: Standards of Care in Diabetes—2025 (2025) — https://diabetesjournals.org/care/article/48/Supplement_1/S321/157551/16-Diabetes-Care-in-the-Hospital-Standards-of-Care\n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Severe protein-calorie malnutrition — acuity {present-on-admission|not}; etiology {poor intake|malabsorption|catabolic illness}; severity {weight loss %|BMI}; objective evidence {albumin not required}; treatment {enteral feeds started|dietitian consult|supplements}\n- Refeeding syndrome (suspected/confirmed) — acuity {acute}; criteria {hypophosphatemia|hypokalemia|hypomagnesemia after feeding}; objective evidence {PO₄³⁻, K⁺, Mg²⁺ trends}; organ effects {arrhythmia|respiratory failure|edema}; treatment {thiamine|electrolyte repletion|slow advancement}\n- Aspiration event related to enteral feeding — diagnosis {aspiration pneumonitis|aspiration pneumonia}; objective evidence {witnessed emesis|new infiltrate|hypoxemia}; severity {O₂ requirement|respiratory failure}; treatment {suction|O₂|antibiotics if pneumonia suspected|feeds held}\n- Dysphagia with need for enteral access — type {oropharyngeal|esophageal}; cause {stroke|deconditioning|neuromuscular}; objective evidence {failed swallow screen}; plan {SLP eval|NPO except meds|tube feeding}\n"};

const def=()=>({un:'',pgy:'',obc:false,pre:{done:false,ans:{},sc:0,cq:0,perTopic:{}},post:{done:false,ans:{},sc:0,perTopic:{}},tc:{},xp:0,lv:1,coins:0,clif:0,streak:{c:0,ld:null},badges:[],topO:[],qa:{},mf:[],sv:{},shop:{p:[],eq:{av:null}},hs:{c:0},snd:false,dl:[],wc:{w:null,p:0},theme:'dark',bsd:null});
function ld(){try{var s=localStorage.getItem(SK);if(s){var p=JSON.parse(s);var d=def();p.pre={...d.pre,...(p.pre||{})};p.post={...d.post,...(p.post||{})};p.streak={...d.streak,...(p.streak||{})};p.shop={...d.shop,...(p.shop||{})};p.shop.eq={...d.shop.eq,...(p.shop&&p.shop.eq||{})};p.hs={...d.hs,...(p.hs||{})};p.wc={...d.wc,...(p.wc||{})};return{...d,...p};}}catch(e){}return def();}
function sv(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}
function getL(x){for(var i=LEVELS.length-1;i>=0;i--)if(x>=LEVELS[i].x)return LEVELS[i];return LEVELS[0];}
function getN(x){for(var i=0;i<LEVELS.length;i++)if(x<LEVELS[i].x)return LEVELS[i];return null;}
function getMult(s){if(s>=8)return 3;if(s>=6)return 2.5;if(s>=4)return 2;if(s>=2)return 1.5;return 1;}
function getIW(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);var w=new Date(d.getFullYear(),0,4);return 1+Math.round(((d.getTime()-w.getTime())/86400000-3+(w.getDay()+6)%7)/7);}
function getWC(){return WEEKLYS[getIW()%7];}
function renderBT(t){if(!t)return t;t=t.replace(/\*\*Guideline Must[\s\u2011-]Know:\*\*/gi,'<span class="gltag">Guideline</span>');t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');t=t.replace(/\{([^}]+)\}/g,'<span class="hlpill">$1</span>');return t;}
function compTC(tid,st,td){
  var opened=(st.topO||[]).includes(tid);
  var svw=(st.sv||{})[tid]||[];
  var totalSec=td?Object.keys(td.sections||{}).length+(td.refs&&td.refs.length?1:0):0;
  var qa=st.qa||{};
  var qAns=0,totalQ=td?(td.quizzes||[]).length:0;
  for(var i=0;i<totalQ;i++)if(qa[tid+'Q'+i])qAns++;
  var mFlip=0,totalM=td?(td.micros||[]).length:0;
  for(var i=0;i<totalM;i++)if((st.mf||[]).includes(tid+'M'+i))mFlip++;
  var crit=0;if(opened)crit++;if(svw.length>=4)crit++;if(totalQ>0&&qAns>=totalQ)crit++;if(totalM>0&&mFlip>=totalM)crit++;
  return{opened,svw:svw.length,totalSec,qAns,totalQ,mFlip,totalM,crit,done:crit>=3};
}

  useEffect(()=>{sv(state);},[state]);

    async function load(){
      try{
        let files=window.TOPIC_MANIFEST||null;
        let embedded=window.TOPIC_FILES||null;
        if(!files){
          const res=await fetch('topics/manifest.json');
          if(!res.ok)throw new Error('No manifest');
          const data=await res.json();
          files=data.topics||data;
        }
        const loaded=[];
        for(let i=0;i<files.length;i++){
          try{
            let txt=null;
            if(embedded&&embedded[files[i]]){txt=embedded[files[i]];}
            else{const r=await fetch('topics/'+files[i]);if(!r.ok)continue;txt=await r.text();}
            if(!txt||txt.trim().startsWith('<!'))continue;
            loaded.push(window.parseMD(txt,files[i]));
          }catch(e){}
          setLprog(Math.round(((i+1)/files.length)*100));
        }
        setTopics(loaded);
        setState(prev=>{const tc={...prev.tc};loaded.forEach(t=>{tc[t.id]=compTC(t.id,prev,t);});return{...prev,tc};});
      }catch(e){console.warn('No manifest',e);}
      setLoading(false);
    }
    load();
  },[]);

  useEffect(()=>{
    if(loading)return;
    const today=new Date().toISOString().slice(0,10);
    setState(prev=>{
      const dl=[...prev.dl];if(!dl.includes(today))dl.push(today);
      const last=prev.streak.ld;let c=prev.streak.c;
      if(last){const diff=Math.floor((new Date(today)-new Date(last))/86400000);if(diff===1)c++;else if(diff>1)c=1;}else c=1;
      return{...prev,dl,streak:{c,ld:today},bsd:prev.bsd||today};
    });

  },[]);

    const total=Math.round(base*mult);
    setState(prev=>{
      const nx=prev.xp+total;const ol=getL(prev.xp),nl=getL(nx);
      let nc=prev.coins+Math.floor(total/10),ncl=prev.clif+Math.floor(total/10);
      if(nl.l>ol.l){nc+=50;ncl+=50;try{confetti({particleCount:100,spread:70,origin:{y:0.6}})}catch(e){}}
      return{...prev,xp:nx,lv:nl.l,coins:nc,clif:ncl};
    });
    addToast(`+${total} XP${mult>1?' (×'+mult.toFixed(1)+')':''}`,'xp');
  },[mult,addToast]);

  const checkBadges=useCallback((ns)=>{
    const earned=[...ns.badges];const nb=[];

      if(earned.includes(b.id))return;let u=false;
      if(b.cat==='topic'){(ns.topO||[]).forEach(tid=>{(b.kw||[]).forEach(kw=>{if(tid.includes(kw))u=true;});});}
      else if(b.cond==='s2')u=ns.streak.c>=2;
      else if(b.cond==='s4')u=ns.streak.c>=4;
      else if(b.cond==='s8')u=ns.streak.c>=8;
      else if(b.cond==='q100')u=Object.keys(ns.qa||{}).length>=100;
      else if(b.cond==='t15')u=(ns.topO||[]).length>=15;
      else if(b.cond==='hot5')u=ns.hs.c>=5;
      else if(b.cond==='c500')u=ns.clif>=500;
      else if(b.cond==='all20')u=(ns.topO||[]).length>=20;
      else if(b.cond==='assessed')u=ns.post&&ns.post.done;
      if(u){earned.push(b.id);nb.push(b);}

    return earned;

    <div className="tcontainer">{toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</div>
    <div className="mob">

        <span style={{fontSize:'.8rem',fontWeight:600}}>{cl.n}</span>
        {mult>1&&<span className="mult">×{mult.toFixed(1)}</span>}

    </div>
    <div className="main">
      {view==='home'&&<Home state={state} topics={topics} openTopic={openTopic} compCount={compCount} setView={setView}/>}
      {view==='detail'&&selTopic&&<Detail topic={selTopic} state={state} setState={setState} setView={setView} awardXP={awardXP} addToast={addToast} topics={topics} checkBadges={checkBadges}/>}
    </div>
    {showShop&&<ShopModal state={state} setState={setState} onClose={()=>setShowShop(false)} addToast={addToast}/>}
    {showProfile&&<ProfileModal state={state} onClose={()=>setShowProfile(false)} setView={setView}/>}
  </div>;
}

function Onboarding({state,setState,setView}){
  const[name,setName]=useState('');
  return<div className={state.theme==='light'?'light':''}><div className="obscreen"><div className="obcard">
    <h1 style={{background:'linear-gradient(135deg,#e2e8f0,#c7d2fe,#a78bfa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>🫁 Gut Check</h1>
    <div className="obt">Trust your gut, prove your knowledge</div>
    <div className="obw">Welcome! Let's see where you're starting from.</div>
    <div className="fg"><label>First Name</label><input className="finput" value={name} onChange={e=>setName(e.target.value.slice(0,20))} placeholder="Your name"/></div>
    
    <button className="anxt" disabled={!name.trim()} onClick={()=>{setState(p=>({...p,un:name.trim(),obc:true,pre:{...p.pre,startedAt:new Date().toISOString()}}));setView('pretest');}}>Begin Pre-Test →</button>
    <button style={{background:'none',border:'none',color:'var(--t3)',cursor:'pointer',fontFamily:"'DM Sans',sans-serif",fontSize:'.82rem',marginTop:12,padding:'8px 16px',textDecoration:'underline'}} disabled={!name.trim()} onClick={()=>{setState(p=>({...p,un:name.trim(),obc:true,pre:{...p.pre,done:false}}));setView('home');}}>Skip Pre-Test for now</button>
  </div></div></div>;
}

function Assessment({type,data,state,setState,setView,addToast,awardXP,checkBadges}){
  const qs=data.questions;
  const key=type==='pretest'?'pre':'post';
  const[ci,setCi]=useState(state[key].cq||0);
  const[sel,setSel]=useState(null);
  const ans=useRef({...(state[key].ans||{})});
  const submit=()=>{
    if(!sel)return;ans.current[ci]=sel;
    setState(p=>{const a={...p[key],ans:{...ans.current},cq:ci+1};return{...p,[key]:a};});
    if(ci<qs.length-1){setCi(ci+1);setSel(null);}
    else{
      let sc=0;const perTopic={};
      qs.forEach((q,i)=>{const correct=ans.current[i]===q.correct;if(correct)sc++;perTopic[q.topicSlug]={correct,userAnswer:ans.current[i],correctAnswer:q.correct};});
      setState(p=>{
        const upd={...p[key],done:true,completedAt:new Date().toISOString(),ans:{...ans.current},sc,perTopic,cq:0};
        const ns={...p,[key]:upd};
        if(type==='posttest'&&checkBadges){const earned=[...ns.badges];BADGES.forEach(b=>{if(!earned.includes(b.id)&&b.cond==='assessed'&&ns.post&&ns.post.done)earned.push(b.id);});ns.badges=earned;}
        return ns;
      });
      if(type==='posttest'&&awardXP)awardXP(500);
      setView(type+'-results');
    }
  };
  const q=qs[ci];
  return<div className={state.theme==='light'?'light':''} style={{minHeight:'100vh'}}><div className="ascreen">
    <div className="ahead">
      <h2 className="atitle">{type==='pretest'?'📋 Pre-Test: Baseline':'📝 Post-Test: Final'}</h2>
      <p style={{color:'var(--t2)',fontSize:'.85rem'}}>{type==='pretest'?'20 ABIM-style questions · No penalty':'20 ABIM-style questions · Show growth'}</p>
      <div className="aprog"><div className="apfill" style={{width:(ci/qs.length)*100+'%'}}/></div>
      <div className="aqnum">Question {ci+1} of {qs.length}</div>
    </div>
    <div className="astem">{q.stem}</div>
    {q.options.map((opt,oi)=>{const letter=opt.charAt(0);return<div key={oi} className={`aopt${sel===letter?' sel':''}`} onClick={()=>setSel(letter)}>{opt}</div>;})}
    <button className="anxt" disabled={!sel} onClick={submit}>{ci<qs.length-1?'Next →':'Finish Assessment'}</button>
  </div></div>;
}

function PretestResults({state,setView}){
  const sc=state.pre.sc;const pct=Math.round(sc/20*100);
  return<div className={state.theme==='light'?'light':''} style={{minHeight:'100vh'}}><div className="rscreen">
    <h2>📋 Pre-Test Results</h2>
    <div className="rscore" style={{color:pct>=70?'#10b981':pct>=50?'#f59e0b':'#ef4444'}}>{sc}/20</div>
    <div className="rsub">{pct}% — {pct>=80?'Strong foundation!':pct>=60?'Good start!':pct>=40?'Solid baseline!':'Perfect starting point!'}</div>
    <div className="rmsg">Your pre-test establishes a baseline. Complete topics, then take the post-test to measure growth.</div>
    {window.PRETEST_DATA.questions.map((q,i)=><div key={i} className="rrow"><span className="rn">{q.topicTitle}</span><span className="rs">{state.pre.ans[i]===q.correct?'✅':'❌'}</span></div>)}
    <button className="anxt" style={{marginTop:24}} onClick={()=>setView('home')}>Start Learning →</button>
  </div></div>;
}

function PosttestResults({state,setView}){
  const sc=state.post.sc;const pct=Math.round(sc/20*100);
  return<div className={state.theme==='light'?'light':''} style={{minHeight:'100vh'}}><div className="rscreen">
    <h2>📝 Post-Test Results</h2>
    <div className="rscore" style={{color:pct>=70?'#10b981':pct>=50?'#f59e0b':'#ef4444'}}>{sc}/20</div>
    <div className="rsub">{pct}%</div>
    {window.POSTTEST_DATA.questions.map((q,i)=><div key={i} className="rrow"><span className="rn">{q.topicTitle}</span><span className="rs">{state.post.ans[i]===q.correct?'✅':'❌'}</span></div>)}
    <button className="anxt" style={{marginTop:24}} onClick={()=>setView('comparison')}>View Comparison →</button>
  </div></div>;
}

function ComparisonView({state,setView}){
  const preS=state.pre.sc||0,postS=state.post.sc||0,diff=postS-preS;
  const prePT=state.pre.perTopic||{},postPT=state.post.perTopic||{};
  const improved=[],maintained=[],gaps=[];
  window.PRETEST_DATA.questions.forEach(q=>{
    const slug=q.topicSlug;const preC=(prePT[slug]||{}).correct;const postC=(postPT[slug]||{}).correct;
    if(!preC&&postC)improved.push(q.topicTitle);else if(preC&&postC)maintained.push(q.topicTitle);else gaps.push(q.topicTitle);
  });
  return<div className={state.theme==='light'?'light':''} style={{minHeight:'100vh'}}><div className="rscreen">
    <h2>📊 Pre vs Post Comparison</h2>
    <div className="scomp"><span>{preS}/20</span><span style={{fontSize:'1.2rem',color:diff>0?'#10b981':diff===0?'#f59e0b':'#ef4444'}}>→</span><span style={{color:diff>0?'#10b981':diff===0?'#f59e0b':'#ef4444'}}>{postS}/20</span></div>
    <p style={{color:'var(--t2)',marginBottom:20}}>{diff>0?`+${diff} questions improved! 🎉`:diff===0?'Same score — review focus areas':'Review topics below'}</p>
    <div className="csec"><div className="cst">Topic-by-Topic</div>
      {improved.map((t,i)=><div key={'i'+i} className="crow ig"><span style={{flex:1,textAlign:'left'}}>{t}</span><span>❌→✅</span></div>)}
      {maintained.map((t,i)=><div key={'m'+i} className="crow"><span style={{flex:1,textAlign:'left'}}>{t}</span><span>✅→✅</span></div>)}
      {gaps.map((t,i)=><div key={'g'+i} className="crow gap"><span style={{flex:1,textAlign:'left'}}>{t}</span><span>⚠️</span></div>)}
    </div>
    {gaps.length>0&&<div className="fbox"><div className="ft">📌 Focus Areas</div>{gaps.map((t,i)=><div key={i} className="fi">• {t}</div>)}</div>}
    <button className="anxt" style={{marginTop:24}} onClick={()=>setView('home')}>← Back to Home</button>
  </div></div>;
}

function Home({state,topics,openTopic,compCount,setView}){
  return<div>
    <h2 style={{fontSize:'1.4rem',marginBottom:4}}>Your Pulmonology Dashboard</h2>
    <p style={{color:'var(--t2)',fontSize:'.85rem',marginBottom:20}}>{compCount}/20 topics completed · {state.xp} XP earned</p>
    {state.pre.done&&<div className="prhcard" onClick={()=>setView('pretest-results')}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:'.85rem',color:'var(--t2)'}}>📋 Pre-Test: {state.pre.sc}/20 ({Math.round(state.pre.sc/20*100)}%)</span>
        <span style={{fontSize:'.75rem',color:'var(--t3)'}}>Details →</span>
      </div>
    </div>}
    <div className={`pohcard${compCount>=16?' ul':''}`}>
      <div style={{fontSize:'1rem',fontWeight:600,marginBottom:8,display:'flex',alignItems:'center',gap:8}}>{compCount>=16?'📝':'🔒'} Post-Test Assessment</div>
      <div className="minibar" style={{height:8,marginBottom:4}}><div className="minifill" style={{width:Math.min(100,compCount/16*100)+'%',background:'linear-gradient(90deg,#6366f1,#a855f7)'}}/></div>
      <div style={{fontSize:'.8rem',color:'var(--t2)'}}>{compCount>=16?(state.post.done?`✅ ${state.post.sc}/20 (${Math.round(state.post.sc/20*100)}%)`:'Unlocked! Take it now.'):`Complete ${Math.max(0,16-compCount)} more topics (${compCount}/16)`}</div>
      {compCount>=16&&<button className="anxt" style={{marginTop:12,display:'inline-block'}} onClick={()=>setView(state.post.done?'comparison':'posttest')}>{state.post.done?'View Comparison':'Take Post-Test →'}</button>}
    </div>
    <h3 style={{fontSize:'1.1rem',marginBottom:12}}>Topics</h3>
    <div className="hgrid">{topics.map((t,i)=>{const tc=state.tc[t.id];const done=tc&&tc.done;return<div key={t.id} className="tcard" onClick={()=>openTopic(t)}>
      <div className="acc" style={{background:COLORS[i%COLORS.length]}}/>
      <div className="ttl">{t.title}</div>
      <div className="tags">{t.tags.slice(0,3).map((tag,ti)=><span key={ti} className="tg">{tag}</span>)}</div>
      <div className="meta"><span>{(t.quizzes||[]).length} quiz</span><span>{(t.micros||[]).length} micro</span><span>{Object.keys(t.sections||{}).length} sec</span></div>
      {done&&<div className="comp">✅</div>}
    </div>;})}</div>
  </div>;
}

function Detail({topic,state,setState,setView,awardXP,addToast,topics,checkBadges}){
  const[flipped,setFlipped]=useState({});const[quizState,setQuizState]=useState({});
  const markViewed=useCallback((secKey)=>{
    setState(prev=>{const svw={...prev.sv};const arr=[...(svw[topic.id]||[])];if(!arr.includes(secKey)){arr.push(secKey);awardXP(30);}svw[topic.id]=arr;const tc={...prev.tc};tc[topic.id]=compTC(topic.id,{...prev,sv:svw},topic);return{...prev,sv:svw,tc};});
  },[topic.id,setState,awardXP]);
  const secRefs=useRef({});
  useEffect(()=>{
    const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){const key=e.target.dataset.seckey;if(key)markViewed(key);}});},{threshold:0.3});
    Object.values(secRefs.current).forEach(el=>{if(el)obs.observe(el);});
    return()=>obs.disconnect();
  },[markViewed]);
  const answerQuiz=(qid,letter,correct)=>{
    if(quizState[qid])return;setQuizState(p=>({...p,[qid]:{ans:letter,correct}}));
    setState(prev=>{const qa={...prev.qa};qa[qid]=letter;let hs={...prev.hs};if(correct){hs.c=(hs.c||0)+1;awardXP(50);}else{hs.c=0;awardXP(15);}const tc={...prev.tc};tc[topic.id]=compTC(topic.id,{...prev,qa},topic);const ns={...prev,qa,hs,tc};ns.badges=checkBadges(ns);return ns;});
  };
  const flipMicro=(mid)=>{
    setFlipped(p=>({...p,[mid]:true}));
    setState(prev=>{const mf=[...prev.mf];if(!mf.includes(mid)){mf.push(mid);awardXP(20);}const tc={...prev.tc};tc[topic.id]=compTC(topic.id,{...prev,mf},topic);return{...prev,mf,tc};});
  };
  const secMap={panic_card:{title:'🚨 Panic Card',cls:'panic'},brief_overview:{title:'📖 Brief Overview',cls:'overview'},icu_consult_triggers:{title:'🏥 ICU/Consult Triggers',cls:'icu'},orders_to_place_now:{title:'📋 Orders to Place Now',cls:'orders'},cdi:{title:'📊 CDI',cls:'cdi'},other:{title:'📝 Additional Notes',cls:'overview'}};
  const secOrder=['panic_card','brief_overview','icu_consult_triggers','orders_to_place_now','cdi','other'];
  const viewed=(state.sv||{})[topic.id]||[];
  return<div className="detail">
    <button className="dbk" onClick={()=>setView('home')}>← Back to Topics</button>
    <h2 className="dtitle">{topic.title}</h2>
    <div className="dtags">{topic.tags.map((t,i)=><span key={i} className="dtag">{t}</span>)}</div>
    {secOrder.filter(k=>topic.sections[k]&&topic.sections[k].length>0).map(key=>{
      const info=secMap[key]||{title:key,cls:'overview'};const isV=viewed.includes(key);
      return<div key={key} ref={el=>secRefs.current[key]=el} data-seckey={isV?'':key} className={`sec ${info.cls}`}>
        <div className="shead"><div className="stitle">{info.title}</div>{isV&&<span className="sviewed">✓ Viewed</span>}</div>
        <ul>{topic.sections[key].map((item,i)=><li key={i} dangerouslySetInnerHTML={{__html:renderBT(item)}}/>)}</ul>
      </div>;
    })}
    {topic.quizzes.map((q,qi)=>{const qs2=quizState[q.id];return<div key={q.id} className="qcard">
      <div className="qlbl">ABIM-Style Question {qi+1}</div><div className="qstem">{q.stem}</div>
      {q.options.map((opt,oi)=>{const letter=opt.charAt(0);let cls='qopt';if(qs2){if(letter===q.correct)cls+=' ok';else if(letter===qs2.ans&&!qs2.correct)cls+=' bad';else cls+=' dis';}return<div key={oi} className={cls} onClick={()=>answerQuiz(q.id,letter,letter===q.correct)}>{opt}</div>;})}
      {qs2&&<div className="qrat"><strong>{qs2.correct?'✅ Correct!':'❌ Incorrect.'}</strong> {q.rationale}</div>}
    </div>;})}
    {topic.micros.length>0&&<div><h3 style={{fontSize:'1.1rem',margin:'20px 0 12px'}}>🔬 Micro Questions</h3>
      {topic.micros.map(m=><div key={m.id} className="mcard" onClick={()=>flipMicro(m.id)}>
        <div className="mq">Q: {m.q}</div>
        {(flipped[m.id]||(state.mf||[]).includes(m.id))&&<div className="ma">A: {m.a}</div>}
      </div>)}</div>}
    {topic.refs.length>0&&<div style={{marginTop:20}} ref={el=>secRefs.current['refs']=el} data-seckey={viewed.includes('refs')?'':'refs'}>
      <h3 style={{fontSize:'1.1rem',marginBottom:12}}>📚 References</h3>
      {topic.refs.map((r,i)=>r.url?<a key={i} className="rlink" href={r.url} target="_blank" rel="noopener noreferrer">{r.label||r.url}</a>:<div key={i} className="rlink">{r.label}</div>)}</div>}
  </div>;
}

function ShopModal({state,setState,onClose,addToast}){
  const buy=(item)=>{if(state.shop.p.includes(item.id))return;if(state.coins<item.p){addToast('Not enough coins!');return;}setState(prev=>({...prev,coins:prev.coins-item.p,shop:{...prev.shop,p:[...prev.shop.p,item.id]}}));addToast(`Purchased ${item.e} ${item.n}`,'badge');};
  const equip=(id)=>{setState(prev=>{const eq=(prev.shop&&prev.shop.eq)||{av:null};return{...prev,shop:{...prev.shop,eq:{...eq,av:eq.av===id?null:id}}};});};
  return<div className="molay" onClick={onClose}><div className="mocnt" onClick={e=>e.stopPropagation()}>
    <button className="mocls" onClick={onClose}>✕</button>
    <h3 className="motitle">🛒 Shop — 🪙 {state.coins}</h3>
    <div style={{marginBottom:16}}><div className="mosect">Avatars</div><div className="sgrid">{SHOP_DATA.avatars.map(item=>{const owned=state.shop.p.includes(item.id);const eq=state.shop&&state.shop.eq&&state.shop.eq.av===item.id;return<div key={item.id} className={`sitem${owned?' own':''}`} onClick={()=>owned?equip(item.id):buy(item)}><div className="se">{item.e}</div><div className="sn">{item.n}</div><div className="sd">{item.d}</div>{owned?<div className="so">{eq?'✅ Equipped':'Tap to equip'}</div>:<div className="sp">🪙 {item.p}</div>}</div>;})}</div></div>
    <div><div className="mosect">Memes</div><div className="sgrid">{SHOP_DATA.memes.map(item=>{const owned=state.shop.p.includes(item.id);return<div key={item.id} className={`sitem${owned?' own':''}`} onClick={()=>buy(item)}><div className="se">{item.e}</div><div className="sn">{item.n}</div><div className="sd">{item.d}</div>{owned?<div className="so">✅ Owned</div>:<div className="sp">🪙 {item.p}</div>}</div>;})}</div></div>
  </div></div>;
}

function ProfileModal({state,onClose,setView}){
  return<div className="molay" onClick={onClose}><div className="mocnt" onClick={e=>e.stopPropagation()}>
    <button className="mocls" onClick={onClose}>✕</button>
    <h3 className="motitle">{state.un}'s Profile</h3>
    <div style={{fontSize:'.85rem',color:'var(--t2)',marginBottom:16}}>Level {getL(state.xp).l} {getL(state.xp).n} · {state.xp} XP · 🪙 {state.coins} · 🔥 {state.streak.c}d streak · {(state.topO||[]).length} topics</div>
    <div style={{marginBottom:16}}><div className="mosect">Badges ({state.badges.length}/{BADGES.length})</div>
      <div className="bgrid">{BADGES.map(b=>{const has=state.badges.includes(b.id);return<div key={b.id} className={`bitem${has?'':' lk'}`}><div className="be">{b.e}</div><div className="bn">{has?b.n:'???'}</div></div>;})}</div>
    </div>
    {state.post.done&&state.pre.done&&<button className="anxt" onClick={()=>{onClose();setView('comparison');}}>📊 View Comparison</button>}
  </div></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

y reversible etiologies. Guidelines support early **N-acetylcysteine** when acetaminophen exposure is possible or ALF is present, while diagnostic testing proceeds in parallel. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 62-year-old woman on chronic warfarin for atrial fibrillation is admitted for abdominal discomfort and dark urine. AST is 980 U/L and ALT is 1100 U/L, total bilirubin 6.2 mg/dL, and INR 3.1. She is fully oriented with normal mental status and no asterixis. She took her usual warfarin dose today. Vitals are normal. What is the best next step in evaluating whether she has acute liver failure?\n\n### Options\nA. Diagnose acute liver failure based on INR and arrange emergent transfer without further assessment\nB. Attribute INR elevation entirely to warfarin and ignore hepatic synthetic function\nC. Assess for encephalopathy and interpret INR in context; trend INR off warfarin and check factor V or fibrinogen if needed\nD. Give fresh frozen plasma to normalize INR and repeat liver enzymes in the morning\nE. Start lactulose immediately because any INR elevation implies hepatic encephalopathy\n\n### Correct answer\nC\n\n### Rationale (2–4 sentences)\nAcute liver failure requires encephalopathy plus impaired hepatic synthetic function; warfarin is a key pitfall because it elevates INR independent of liver synthesis. The decision hinges on mental status assessment and using additional synthesis markers or trends after holding warfarin rather than assuming ALF solely from INR. \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: Does acute liver failure require encephalopathy?\n A: Yes. Acute liver failure requires hepatic injury with **INR ≥1.5** plus **any encephalopathy** in a patient without known preexisting cirrhosis. \n- Q: In suspected acetaminophen-related liver injury, should N-acetylcysteine be started before the level returns?\n A: Yes, if ingestion is possible or timing is unclear, start N-acetylcysteine while awaiting levels. \n- Q: Can hepatitis A become chronic?\n A: No. Hepatitis A does not become chronic and is typically managed with supportive care. \n- Q: For post-exposure prophylaxis of hepatitis A, what is the key time window?\n A: Administer hepatitis A vaccine and/or immune globulin as soon as possible and **within 2 weeks** of exposure. \n\n## Guidelines & Key References (3–5 bullets)\n- AASLD: Management of Acute Liver Failure (practice guidance/position paper hub) — https://www.aasld.org/practice-guidelines/management-acute-liver-failure \n- EASL Clinical Practice Guidelines: Management of acute (fulminant) liver failure (2017) — https://easl.eu/wp-content/uploads/2018/10/LiverFailure-English-report.pdf \n- CDC: Clinical Care of Hepatitis A (updated 2025) — https://www.cdc.gov/hepatitis-a/hcp/clinical-care/index.html \n- AASLD: Hepatitis B guidance (2018) — https://onlinelibrary.wiley.com/doi/pdf/10.1002/hep.29800 \n- IDSA/AASLD: Hepatitis C Guidance 2023 update (practice guideline page) — https://www.idsociety.org/practice-guideline/hcv-guidance/ \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute hepatitis — {suspected etiology} — severity: {mild|moderate|severe} — evidence: {AST/ALT values; bilirubin; INR} — treatment/monitoring: {hepatotoxin hold; trend labs q{hours}}\n- Suspected acute liver failure — encephalopathy: {present/absent; grade} — synthetic dysfunction: {INR value} — evidence: {mental status findings; glucose; lactate} — actions: {ICU consult; transplant-center contact; NAC started}\n- Drug-induced liver injury — culprit: {med/supplement} — timing: {start date/last dose} — evidence: {pattern; acetaminophen level if applicable} — actions: {drug stopped; toxicology consulted}\n- Obstructive hepatopathy/cholangitis concern — severity: {sepsis present/absent} — evidence: {fever; RUQ pain; imaging; bilirubin/ALP} — actions: {blood cultures; antibiotics; GI consult for ERCP}\n", "acute-liver-failure.md": "---\nfilename: acute-liver-failure.md\nid: acute-liver-failure\ntitle: Acute Liver Failure\nslug: acute-liver-failure\ntags: [hepatology, critical-care, night-float]\nlevel: resident\nestimated_time_min: 20\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n\n# Acute Liver Failure\n\n## Panic Card (3–6 bullets)\n- Airway first: if encephalopathy with inability to protect airway (often **HE grade III–IV**), intubate using hemodynamically gentle induction; elevate head of bed **30°**, keep neck midline, avoid hypoxia/hypercapnia (target **SpO₂ ≥94%**, **PaCO₂ ~35–40 mmHg**). \n- Start **IV N-acetylcysteine (NAC)** immediately if acetaminophen possible/unknown or significant acute liver injury: **150 mg/kg IV over 1 h → 50 mg/kg over 4 h → 100 mg/kg over 16 h**; continue if ongoing liver injury/encephalopathy per ICU/hepatology. \n- Treat/prevent hypoglycemia now: bedside glucose q1–2 h; give **dextrose IV** and run **D10W** to maintain **glucose ≥5.6 mmol/L (≥100 mg/dL)** (higher targets reasonable with recurrent lows). \n- Early transplant-center activation: call ICU + hepatology/transplant immediately; obtain prognostic labs (INR, lactate, creatinine, arterial pH) and trend q4–6 h. \n- Cerebral edema precautions if worsening HE/high ammonia: avoid excess fluids, maintain **MAP ≥65 mmHg**; consider hypertonic saline to target **Na⁺ 145–150 mmol/L**; mannitol **0.5–1 g/kg IV** for suspected herniation if euvolemic and kidneys allow. \n- Confirm Before Proceed: Do NOT “correct INR” routinely; give plasma/PCC only for **active bleeding** or **high-risk procedure** (and coordinate with ICU/hepatology). \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Acute liver failure (ALF) = acute hepatic injury in a patient without known cirrhosis plus **coagulopathy (typically INR >1.5)** and **hepatic encephalopathy**; most night-float danger is rapid progression to **cerebral edema, shock, infection, hypoglycemia, AKI**, and need for urgent transplant evaluation. \n- **Guideline Must Know:** Assume acetaminophen until proven otherwise; send acetaminophen level even if history unclear, and start **IV NAC immediately** when ingestion is possible/unknown or transaminases are massive (benefit greatest early, but late therapy is still used in ALF pathways). \n- **Guideline Must Know:** Transfer/consult a transplant-capable center early; outcomes hinge on timely listing and management in an ICU experienced with ALF (do not “watch overnight” if INR/mental status are worsening). \n- Now (first hour): stabilize ABCs; avoid hypoxia/hypercapnia/hypotension; treat hypoglycemia; obtain broad diagnostic set (CMP, INR/PTT, fibrinogen, CBC, lactate, ABG/VBG, ammonia, acetaminophen level, hepatitis A/B/C/E where available, autoimmune markers, pregnancy test when relevant, toxicology review). \n- **Guideline Must Know:** Coagulopathy in ALF is not an automatic indication for transfusion; prophylactic plasma can worsen volume status, obscure trends, and is reserved for bleeding or procedures; use viscoelastic testing when available to guide targeted products. \n- Etiology clues that change nighttime actions: “hyperacute” course with **very high aminotransferases** and relatively lower bilirubin suggests acetaminophen or ischemic injury; very high bilirubin with low alkaline phosphatase can suggest Wilsonian ALF; severe hypotension/hypoxemia points to ischemic hepatitis (treat shock source). \n- **Guideline Must Know:** Manage encephalopathy like impending neurocritical illness: early intubation for airway protection, minimize sedatives, avoid benzodiazepines, and perform frequent neuro checks; CT head is for alternate diagnoses/herniation risk but does not rule out cerebral edema. \n- Cerebral edema risk rises with severe HE and hyperammonemia; practical bedside approach: head-of-bed up, normothermia, avoid hyponatremia, and consider ammonia-lowering strategies (early CRRT if severe hyperammonemia plus AKI or rapid neuro decline) while awaiting ICU/hepatology decisions. \n- **Guideline Must Know:** For suspected intracranial hypertension: hypertonic saline to maintain **Na⁺ ~145–150 mmol/L** is commonly recommended; mannitol **0.5–1 g/kg IV** is an option if hemodynamically stable and not in oliguric renal failure; avoid excessive hypotonic fluids. \n- Infection is common and may present without fever/leukocytosis; obtain blood/urine cultures and chest imaging early; start empiric broad-spectrum antibiotics if shock, rising vasopressor needs, or high suspicion, and de-escalate with cultures (coordinate with ICU). \n- **Guideline Must Know:** Hypoglycemia is frequent and dangerous; check glucose at least q2 h (often q1 h if unstable) and run continuous dextrose to maintain **≥5.6 mmol/L (≥100 mg/dL)**; treat seizures as metabolic until proven otherwise. \n- What can wait (but don’t forget by morning): complete etiologic workup (HSV/VZV/CMV when compatible; medication/supplement review for DILI; RUQ Doppler US for Budd–Chiari/vascular flow; consider biopsy in “indeterminate” cases at transplant center). \n- **Guideline Must Know:** Prognosis tools support, not replace, clinical escalation; trends in **INR, lactate, creatinine, pH**, and encephalopathy grade inform urgency for transplant evaluation and higher-level monitoring. \n- Pitfalls at night: giving large-volume plasma “to fix INR,” missing occult acetaminophen exposure, delaying intubation until aspiration, treating agitation with benzodiazepines, letting sodium drift down, and under-recognizing sepsis because vitals can be deceptively “okay.” \n- When in doubt, escalate: ALF can deteriorate over hours; if mental status, lactate, vasopressor needs, renal function, or oxygenation worsens despite initial steps, treat as ICU-level until proven otherwise. \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- **Hepatic encephalopathy grade III–IV**, seizures, decerebrate posturing, or any loss of airway protection requiring intubation. \n- Hemodynamic instability: **MAP <65 mmHg** after fluids or any **vasopressor requirement**. \n- Worsening synthetic/metabolic failure: **INR ≥3.0**, **lactate ≥3 mmol/L** or rising, recurrent **glucose <4.0 mmol/L (<72 mg/dL)** despite dextrose. \n- Severe renal/neurologic risk: **creatinine rising with oliguria**, need for CRRT, or rapidly worsening confusion/agitation suggesting impending cerebral edema. \n\n## Orders to Place Now (3–6 bullets)\n- Order: ICU consult — {reason: acute liver failure with encephalopathy/coagulopathy; hemodynamics; airway status}\n- Order: N-acetylcysteine IV protocol — {weight_kg; acetaminophen_level; time_of_ingestion_unknown_yes_no}\n- Order: Hypoglycemia prevention infusion — {dextrose_concentration: D10W; initial_rate_ml_hr; glucose_goal_mg_dl}\n- Order: Acute liver failure diagnostic bundle — {CBC; CMP; INR/PTT; fibrinogen; lactate; ABG/VBG; ammonia; acetaminophen_level; hepatitis_serologies; autoimmune_markers}\n- Order: Neuroprotection precautions — {HOB_degrees: 30; sodium_goal_mmol_l: 145-150; avoid_hypotonic_fluids_yes_no}\n\n## ABIM Style Question 1\n### Stem\nA 32-year-old woman is brought to the hospital for confusion and vomiting. She has no known liver disease. Vitals: T 36.8°C, HR 108/min, BP 102/62 mmHg, RR 18/min, SpO₂ 97% RA. She is somnolent but arousable and follows simple commands. Labs: AST 8,200 IU/L, ALT 9,100 IU/L, total bilirubin 2.1 mg/dL, INR 2.4, creatinine 1.3 mg/dL, glucose 58 mg/dL (3.2 mmol/L). Acetaminophen level is pending; family reports she had “bad headaches” over the weekend and may have taken over-the-counter pills. What is the best next step in management tonight?\n### Options\nA. Start IV N-acetylcysteine immediately and arrange transfer/consult with a transplant-capable center\nB. Give fresh frozen plasma to correct INR to <1.5 and recheck in 6 hours\nC. Start lactulose to 3–4 bowel movements and defer other therapy until acetaminophen level returns\nD. Administer corticosteroids for presumed autoimmune hepatitis before further testing\nE. Observe on the floor with q8h labs because she is hemodynamically stable\n### Correct answer\nA\n### Rationale (2–4 sentences)\nALF with encephalopathy and **INR >1.5** requires ICU-level management and early transplant-center involvement, and acetaminophen toxicity must be presumed when history is unclear. NAC should be started immediately when acetaminophen exposure is possible or the ingestion time is unknown, rather than waiting for levels. Routine plasma transfusion to “fix INR” is not recommended without bleeding or a high-risk procedure. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 54-year-old man with no known chronic liver disease is in the ICU with acute liver failure from suspected drug-induced liver injury. He is intubated for encephalopathy. Labs: INR 3.1, platelets 28 ×10⁹/L, fibrinogen 1.6 g/L. He has no active bleeding. The team asks whether pharmacologic venous thromboembolism prophylaxis should be given because “his INR is high anyway.” What is the best prophylaxis choice tonight?\n### Options\nA. Enoxaparin 40 mg subcutaneously nightly\nB. Unfractionated heparin 5,000 units subcutaneously every 8 hours\nC. Withhold all prophylaxis because INR is elevated in ALF\nD. Mechanical prophylaxis with sequential compression devices only\nE. Give fresh frozen plasma first, then start enoxaparin\n### Correct answer\nD\n### Rationale (2–4 sentences)\nA common pitfall is assuming elevated INR means “auto-anticoagulated”; ALF patients can still thrombose, but severe thrombocytopenia is a bleeding-risk modifier. With **platelets 28 ×10⁹/L**, pharmacologic prophylaxis is typically avoided and mechanical prophylaxis is preferred while reassessing counts and bleeding risk. Correcting INR with plasma solely to enable heparin is not recommended without bleeding or procedures. \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: In a patient without known cirrhosis, what two findings are required to diagnose acute liver failure?\n A: Acute liver injury with **coagulopathy (typically INR >1.5)** and **clinically apparent hepatic encephalopathy**. \n- Q: What is the standard initial IV NAC sequence for suspected acetaminophen-related ALF?\n A: **150 mg/kg over 1 h**, then **50 mg/kg over 4 h**, then **100 mg/kg over 16 h**. \n- Q: Should INR be corrected routinely in ALF when there is no bleeding?\n A: No; transfuse plasma/PCC only for **active bleeding** or **planned high-risk procedures**. \n- Q: What serum sodium target is commonly used when cerebral edema risk is high in ALF?\n A: Maintain **Na⁺ ~145–150 mmol/L** using hypertonic saline protocols when indicated. \n\n## Guidelines & Key References (3–5 bullets)\n- American College of Gastroenterology (ACG) Acute Liver Failure Guidelines, 2023 (PDF): https://bspghan.org.uk/wp-content/uploads/2023/08/acute-liver-failure-guidelines.pdf \n- American Association for the Study of Liver Diseases (AASLD) Position Paper: The Management of Acute Liver Failure (Update 2011) (PDF): https://www.aasld.org/sites/default/files/2023-03/Acute%20Liver%20Failure%20Update2011.pdf \n- European Association for the Study of the Liver (EASL) Clinical Practice Guidelines: Management of acute (fulminant) liver failure, 2017 (PDF): https://easl.eu/wp-content/uploads/2018/10/LiverFailure-English-report.pdf \n- Society of Critical Care Medicine (SCCM) Guidelines for adult acute and acute-on-chronic liver failure in the ICU (Part II), 2023: https://www.sccm.org/clinical-resources/guidelines/guidelines/guidelines-for-the-management-of-liver-failure-2 \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute liver failure with hepatic encephalopathy {grade} and coagulopathy {INR/PT}; suspected etiology {acetaminophen/DILI/viral/ischemic/indeterminate}; objective evidence {AST/ALT, bilirubin, INR, mental status exam}\n- Acute metabolic encephalopathy due to hepatic failure with neuroprotection measures {HOB 30°, Na⁺ goal 145–150, ventilation targets}; objective evidence {GCS, ammonia if obtained, neuro checks}\n- Hypoglycemia due to acute hepatic failure with treatment {IV dextrose bolus/infusion rate}; objective evidence {POC glucose values, recurrence frequency}\n- Acute kidney injury in ALF {KDIGO stage if known} with perfusion status {MAP, vasopressors} and renal support {CRRT planned/started}; objective evidence {creatinine trend, urine output}\n- Sepsis/septic shock {suspected source} in ALF with organ dysfunction {vasopressors, lactate}; cultures obtained {sites} and antimicrobials {drug/dose} with response {MAP/lactate trend}\n", "hepatitis-b-and-c.md": "---\nfilename: hepatitis-b-and-c.md\nid: hepatitis-b-and-c\ntitle: hepatitis B and C\nslug: hepatitis-b-and-c\ntags: [hepatitis, hepatology, night-float]\nlevel: resident\nestimated_time_min: 20\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n\n# hepatitis B and C\n\n## Panic Card (3–6 bullets)\n- Assess for acute liver failure now: mental status/asterixis, glucose, **INR**, **bilirubin**, **ammonia**, and trend vitals; treat hypoglycemia immediately.\n- If **INR ≥1.5 with any encephalopathy** or rapidly rising INR/bilirubin: call ICU + hepatology, start frequent neuro checks, avoid sedatives, and prepare for transfer to a transplant-capable center if worsening.\n- Give **N-acetylcysteine** if acute hepatitis with unknown cause or concern for acetaminophen toxicity: **150 mg/kg IV load over 1 h → 50 mg/kg over 4 h → 100 mg/kg over 16 h** (continue per protocol if ongoing injury).\n- Stop hepatotoxins and review meds now: acetaminophen, statins, isoniazid, valproate, amiodarone, herbals; hold non-essential anticoagulants if active bleeding/coagulopathy.\n- If active GI bleed or hemodynamic instability in cirrhosis: resuscitate, type & screen, start GI bleed pathway (octreotide + ceftriaxone if variceal suspected), and call GI urgently.\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Night-float reality: viral hepatitis issues are usually (1) severe transaminitis with unclear cause, (2) decompensated cirrhosis where HBV/HCV history matters, (3) HBV reactivation risk before immunosuppression, or (4) newly discovered positive serologies needing correct interpretation and safe next steps.\n- **Guideline Must Know:** For HBV screening in adults, use the **triple panel**: **HBsAg + anti-HBs + total anti-HBc** at least once in adults **≥18 years** (and in pregnancy each pregnancy). This matters inpatient because it prevents missed chronic HBV before steroids/chemo and identifies susceptibility for vaccination.\n- **Guideline Must Know:** For HCV, confirm active infection with **HCV RNA** (not antibody alone). HCV antibody positive can reflect resolved infection; RNA drives counseling, infection control, and outpatient cure plans.\n- When AST/ALT are **>1000 IU/L**, do not anchor on “viral hepatitis” first: prioritize ischemic hepatitis/shock liver, acetaminophen toxicity, and acute biliary obstruction; order acetaminophen level, lactate, INR, RUQ ultrasound ± Doppler, and review hypotension episodes.\n- **Guideline Must Know:** HBV reactivation is a high-risk inpatient pitfall: any patient who is **HBsAg positive** OR **anti-HBc positive** (even if HBsAg negative) can reactivate with immunosuppression; the risk is highest with **anti-CD20 therapy (rituximab/obinutuzumab)**, **hematopoietic stem-cell transplant**, and intensive combination chemo.\n- **Guideline Must Know:** If high-risk immunosuppression is imminent and HBV status is positive (HBsAg+ or anti-HBc+), start **prophylactic antiviral therapy** rather than “monitoring only.” Preferred agents are high-barrier nucleos(t)ide analogs: **entecavir** or **tenofovir**; coordinate with hepatology/ID early because timing matters before the first immunosuppressive dose.\n- Practical overnight triage for a new positive HBV test: check **HBsAg, anti-HBc (IgM if available), anti-HBs**, and if HBsAg positive order **HBV DNA** plus **HBeAg/anti-HBe**; assess severity with **INR**, bilirubin, platelets, and symptoms. Isolated anti-HBc (HBsAg negative, anti-HBs negative) can represent remote infection, false positive, or occult HBV—do not dismiss it if immunosuppression is planned.\n- **Guideline Must Know:** For inpatient HCV “found incidentally,” do not start DAAs overnight unless a coordinated plan exists; instead confirm **HCV RNA**, assess fibrosis noninvasively (e.g., **FIB-4**) and decompensation status, and ensure drug–drug interaction review—these are core steps in AASLD/IDSA HCV guidance.\n- If planning HCV treatment (even as outpatient), always check HBV first because DAAs can be associated with **HBV reactivation** in susceptible patients; order **HBsAg, anti-HBc, anti-HBs** up front to avoid delays and missed prophylaxis.\n- **Guideline Must Know:** In suspected acute severe viral hepatitis or flare, severity is about synthetic function, not just transaminases: **INR**, bilirubin, encephalopathy, and glucose determine disposition; worsening INR/encephalopathy should trigger ICU-level monitoring and hepatology involvement.\n- What must happen now vs what can wait: now—rule out acute liver failure, identify acetaminophen/ischemic causes, evaluate for biliary obstruction, determine need for ICU/consults, and address infection control/exposure questions; can wait—full staging, vaccination counseling, and definitive antiviral cure planning once stable.\n- Night shift pitfalls: mislabeling “HCV positive” based on antibody alone; forgetting HBV prophylaxis before rituximab or prolonged high-dose steroids; attributing AST/ALT >1000 to “hepatitis” without checking acetaminophen; overcorrecting coagulopathy without bleeding; giving sedatives in evolving encephalopathy.\n- Consult-smart language: “Concern for **HBV reactivation** in anti-HBc positive patient receiving **rituximab** tomorrow” or “Possible **acute liver failure**: **INR 2.1 + new confusion**” gets faster escalation than “hepatitis flare.”\n- Infection prevention basics for the floor: standard precautions; notify occupational health for **needlestick** or mucosal exposure; document source-patient HBV/HCV/HIV status and initial labs so follow-up doesn’t fall through overnight.\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- **INR ≥1.5 with any encephalopathy** or rapidly rising INR/bilirubin over hours.\n- Persistent hypoglycemia, escalating lactate, or hemodynamic instability suggesting ischemic hepatitis/shock.\n- Acute GI bleeding in known/suspected cirrhosis (hematemesis/melena with tachycardia/hypotension) or need for escalating transfusion/vasoactives.\n- Planned high-risk immunosuppression within **24–48 h** in a patient who is **HBsAg positive** or **anti-HBc positive** (needs prophylaxis plan now).\n- New severe jaundice with fever, hypotension, or RUQ pain concerning for cholangitis/obstructive process requiring urgent imaging and intervention.\n\n## Orders to Place Now (3–6 bullets)\n- Order: Hepatic function panel — {now, repeat in 6–12 h, include AST/ALT/alk-phos/total-direct-bilirubin/albumin}\n- Order: Coagulation studies — {PT/INR now, repeat in 6–12 h if rising transaminases or jaundice}\n- Order: Acetaminophen level — {stat if AST/ALT ≥500 or unclear ingestion history}\n- Order: Hepatitis serologies (HBV triple panel) — {HBsAg, anti-HBs, total anti-HBc; add IgM anti-HBc if acute suspected}\n- Order: HCV testing — {HCV antibody with reflex to quantitative HCV RNA if positive}\n- Order: RUQ ultrasound with Doppler — {evaluate biliary obstruction and hepatic/portal flow if jaundice or severe transaminitis}\n\n## ABIM Style Question 1\n### Stem\nA 62-year-old man with diffuse large B-cell lymphoma is admitted overnight to start rituximab-based chemotherapy in the morning. Pre-chemotherapy labs show HBsAg negative, anti-HBs negative, and total anti-HBc positive. ALT is 34 IU/L and INR is 1.0. He has no known liver disease. What is the best next step tonight to reduce his risk of hepatitis-related complications during treatment?\n### Options\nA. Begin entecavir prophylaxis now and continue through and after immunosuppression per protocol\nB. No action; repeat liver enzymes weekly during chemotherapy\nC. Administer hepatitis B vaccine now and proceed with chemotherapy without antivirals\nD. Start sofosbuvir/velpatasvir to prevent viral hepatitis flares\nE. Give hepatitis B immune globulin (HBIG) immediately before rituximab infusion\n### Correct answer\nA\n### Rationale (2–4 sentences)\nAnti-HBc positivity indicates prior HBV exposure and risk for **HBV reactivation** with high-risk immunosuppression such as **anti-CD20 therapy**; guidelines favor **prophylactic antiviral therapy** over monitoring alone in this setting. Entecavir (or tenofovir) has a high barrier to resistance and is appropriate to start before the first rituximab dose. Vaccination does not prevent reactivation, DAAs treat HCV not HBV, and HBIG is not the standard prophylaxis strategy for this indication.\n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 58-year-old woman with rheumatoid arthritis is admitted for hypoxemic respiratory failure from presumed organizing pneumonia. The team plans to start **prednisone 60 mg daily** tonight with a slow taper over months. Her HBV tests return: HBsAg positive, anti-HBs negative, total anti-HBc positive. ALT is 78 IU/L and HBV DNA is pending. What is the best next step tonight?\n### Options\nA. Start tenofovir or entecavir now for HBV treatment/prophylaxis while steroids begin\nB. Delay steroids until HBV DNA results return\nC. Give hepatitis B vaccine now and reassess in 1 month\nD. Start ribavirin to prevent hepatitis flare during steroids\nE. Monitor ALT weekly; start antivirals only if ALT rises above 200 IU/L\n### Correct answer\nA\n### Rationale (2–4 sentences)\nHBsAg positivity indicates chronic HBV infection, and **high-dose prolonged steroids** can precipitate severe **HBV reactivation/flares**; starting a high-barrier antiviral (tenofovir or entecavir) promptly is recommended when significant immunosuppression is initiated. The pitfall is “waiting for HBV DNA” despite a clear high-risk trigger and positive HBsAg. Vaccination and ribavirin are inappropriate here, and monitoring alone risks preventable hepatic injury.\nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: A patient is HCV antibody positive on admission labs. What single test confirms active infection?\n A: Quantitative **HCV RNA** confirms active infection; antibody alone does not.\n- Q: Which 3 tests make up the HBV “triple panel” screening?\n A: **HBsAg**, **anti-HBs**, and **total anti-HBc**.\n- Q: In suspected acute liver failure, what lab + clinical finding defines the syndrome that mandates urgent escalation?\n A: **INR ≥1.5** plus **any encephalopathy** in a patient without known cirrhosis.\n- Q: Name one immunosuppressive therapy that is considered high risk for HBV reactivation.\n A: **Anti-CD20 therapy (e.g., rituximab)** is high risk.\n\n## Guidelines & Key References (3–5 bullets)\n- CDC. Screening and Testing for Hepatitis B Virus Infection: CDC Recommendations — United States, 2023. https://www.cdc.gov/mmwr/volumes/72/rr/pdfs/rr7201a1-H.pdf\n- AASLD. Hepatitis B Practice Guidance (includes 2018 AASLD HBV Guidance and updates hub). https://www.aasld.org/practice-guidelines/hepatitis-b\n- AASLD/IDSA. HCV Guidance: Recommendations for Testing, Managing, and Treating Hepatitis C (web-based, periodically updated; latest update noted on site). https://www.hcvguidelines.org/\n- CDC. CDC Recommendations for Hepatitis C Screening Among Adults — United States, 2020. https://www.cdc.gov/mmwr/volumes/69/rr/pdfs/rr6902a1-H.pdf\n- EASL. Clinical Practice Guidelines on the management of hepatitis B virus infection (updated guideline). https://www.journal-of-hepatology.eu/article/S0168-8278%2825%2900174-6/fulltext\n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute hepatitis — {acuity: acute} — {etiology: suspected viral vs ischemic vs drug-induced} — {severity: INR, bilirubin, encephalopathy present/absent} — {evidence: AST/ALT values, INR, glucose, mental status} — {treatment/monitoring: NAC, ICU consult, neuro checks}\n- Chronic hepatitis B — {acuity: chronic} — {phase if known: immune-active vs inactive vs unknown} — {severity: cirrhosis yes/no, decompensation yes/no} — {evidence: HBsAg+, HBV DNA if available, ALT, imaging} — {treatment/monitoring: antiviral started/continued, hepatology follow-up}\n- HBV reactivation risk — {trigger: rituximab/chemo/high-dose steroids} — {serostatus: HBsAg+/anti-HBc+} — {severity risk: high} — {evidence: planned immunosuppression timing, baseline ALT/INR} — {treatment: prophylactic entecavir/tenofovir initiated}\n- Hepatitis C infection — {status: antibody vs RNA-confirmed} — {severity: fibrosis/cirrhosis suspected yes/no} — {evidence: HCV RNA value if available, platelet count, FIB-4 if calculated} — {plan: outpatient DAA referral, DDI review needed, HBV triple panel ordered}\n", "cirrhosis-and-portal-hypertension.md": "---\nfilename: cirrhosis-and-portal-hypertension.md\nid: cirrhosis-and-portal-hypertension\ntitle: cirrhosis and portal hypertension\nslug: cirrhosis-and-portal-hypertension\ntags: [hepatology, portal-hypertension, cirrhosis]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# cirrhosis and portal hypertension\n## Panic Card (3–6 bullets)\n- Airway/mental status first: if ongoing hematemesis or Grade III–IV encephalopathy, prepare for intubation and aspiration precautions; target **SpO₂ ≥92%**. \n- Hemorrhage resuscitation: 2 large-bore IVs, type and cross; transfuse PRBCs to **Hb 7–9 g/dL** (avoid overtransfusion) and start vasopressor if shock to **MAP ≥65 mmHg**. \n- Suspected variceal bleed: start **octreotide 50 micrograms IV bolus then 50 micrograms/h infusion** plus **ceftriaxone 1 g IV daily** immediately; urgent endoscopy (goal **≤12 h**). \n- Suspected SBP (fever, abdominal pain, AKI, encephalopathy, GI bleed): do diagnostic paracentesis now; treat if PMN **≥250 cells/mm³**; give albumin if criteria met. \n- Confirm Before Proceed: irreversible steps (massive transfusion activation, emergent anticoagulation reversal, or preemptive TIPS) require rapid senior/ICU/GI coordination and objective criteria documentation. \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Night-float framing: portal hypertension drives variceal bleeding, ascites, SBP, hepatorenal syndrome (HRS-AKI), and hepatic encephalopathy; at night, prioritize airway/bleeding/infection/AKI triage over “fixing” INR or mild lab abnormalities. \n- **Guideline Must Know:** Compensated vs decompensated cirrhosis changes risk and therapy; decompensation is defined by complications such as ascites, variceal hemorrhage, and overt encephalopathy, and should trigger escalation planning and transplant-level thinking when appropriate. \n- **Guideline Must Know:** Clinically significant portal hypertension (CSPH) is the key prognostic threshold; CSPH is defined by HVPG **≥10 mmHg**, and the presence of gastroesophageal varices implies CSPH. \n- **Guideline Must Know:** Noninvasive risk stratification can reduce unnecessary endoscopy: low risk of high-risk varices when liver stiffness **<20 kPa** and platelets **>150,000/mm³**; otherwise, screening endoscopy is recommended when cirrhosis is diagnosed (or when decompensation occurs). \n- “What must happen now” when called for GI bleeding in cirrhosis: stabilize (airway, MAP, Hb), start vasoactive therapy plus antibiotics immediately, and coordinate urgent endoscopy; do not wait for endoscopy to start octreotide/ceftriaxone. \n- **Guideline Must Know:** Acute variceal hemorrhage bundles include vasoactive therapy (e.g., octreotide), antibiotic prophylaxis (commonly ceftriaxone), and endoscopic therapy; restrictive transfusion to **Hb 7–9 g/dL** improves outcomes compared with liberal strategies. \n- **Guideline Must Know:** Consider preemptive (early) TIPS in high-risk variceal bleeding (e.g., Child-Pugh C **10–13** or Child-Pugh B with active bleeding) when feasible and no major contraindication; this is a “call GI/ICU early” scenario on nights. \n- Night pitfalls in bleeding: routine “INR correction” is not a resuscitation endpoint; instead, correct hypofibrinogenemia if present and use thromboelastography-guided products when available; platelets or plasma should be targeted to bleeding physiology, not numbers alone. \n- “What must happen now” for suspected SBP: diagnostic paracentesis should be performed promptly in hospitalized cirrhosis with ascites (new/worse distention, pain, fever, encephalopathy, AKI, hypotension, or GI bleed); start empiric antibiotics after cultures if PMN **≥250 cells/mm³**. \n- **Guideline Must Know:** Albumin in SBP and HRS-AKI matters: in SBP with renal dysfunction or severe infection physiology, albumin reduces renal failure/mortality; in suspected HRS-AKI, albumin is part of the initial management while stopping diuretics/nephrotoxins and assessing response. \n- “What can wait until morning” in ascites without red flags: sodium restriction, careful diuretic planning, and long-term prophylaxis decisions; however, tense ascites with dyspnea or severe pain may need therapeutic paracentesis overnight with post-paracentesis albumin if large-volume removal. \n- **Guideline Must Know:** Large-volume paracentesis requires albumin replacement to prevent circulatory dysfunction; a common evidence-based approach is **6–8 g albumin per liter** removed when **>5 L** is taken off. \n- Night encephalopathy approach: treat precipitant first (GI bleed, infection, constipation, sedatives, electrolyte disturbance); give lactulose to achieve **2–3 soft stools/day**, add rifaximin when recurrent; if unable to protect airway, secure airway before enteral cathartics. \n- Renal/medication pitfalls: stop NSAIDs, ACE inhibitors/ARBs, and unnecessary diuretics during AKI; avoid excessive fluid boluses if tense ascites/hydrothorax; if shock or sepsis physiology, treat per hemodynamics and monitor lactate/urine output closely. \n- VTE and procedures: cirrhosis is not “auto-anticoagulated”; consider pharmacologic VTE prophylaxis unless active bleeding or severe thrombocytopenia is present; for bedside procedures, prioritize clinical bleeding risk and platelet/fibrinogen more than INR. \n- Escalation mindset: decompensated cirrhosis can deteriorate rapidly into ACLF; rising bilirubin, INR, creatinine, lactate, new vasopressor requirement, or worsening encephalopathy should prompt ICU consideration and early hepatology/GI input. \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Active hematemesis/melena with hemodynamic instability: **MAP <65 mmHg** despite fluids or any vasopressor requirement, or transfusion need **≥2 units PRBC within 6 h**. \n- Respiratory/airway failure: inability to protect airway (Grade III–IV encephalopathy), recurrent aspiration, or escalating oxygen needs (e.g., **SpO₂ <90%** on high-flow). \n- Suspected SBP/sepsis with organ dysfunction: new AKI (rapid creatinine rise or oliguria), lactate elevation, hypotension, or altered mental status. \n- HRS-AKI concern: worsening creatinine despite stopping diuretics/nephrotoxins and albumin resuscitation, or need for renal replacement therapy discussion. \n- High-risk variceal bleed needing definitive therapy: suspected variceal hemorrhage with Child-Pugh C **10–13** or B with active bleeding where preemptive TIPS evaluation is time-sensitive. \n\n## Orders to Place Now (3–6 bullets)\n- Order: CBC with differential — {now, repeat q6h x2 if bleeding/unstable}\n- Order: CMP (including Na, K, creatinine, bilirubin) + magnesium + phosphate — {now, repeat q12–24h based on acuity}\n- Order: Coagulation panel (PT/INR, aPTT) + fibrinogen — {now, repeat q12–24h if bleeding or procedures planned}\n- Order: Type and screen / type and crossmatch — {units=2–4 PRBC, expand per ongoing hemorrhage}\n- Order: Diagnostic paracentesis labs — {cell count with differential, albumin, total protein, culture in blood culture bottles; add glucose/LDH if secondary peritonitis concern}\n- Order: Octreotide infusion protocol + ceftriaxone — {octreotide 50 mcg IV bolus then 50 mcg/h; ceftriaxone 1 g IV daily; duration per GI}\n\n## ABIM Style Question 1\n### Stem\nA 58-year-old man with known alcohol-related cirrhosis is admitted overnight for hematemesis and melena. On arrival he is alert but pale. Vitals: T 36.8°C, HR 112/min, BP 92/56 mmHg after 1 L crystalloid, RR 20/min, SpO₂ 96% on 2 L nasal cannula. Labs show hemoglobin 6.9 g/dL and platelet count 78,000/mm³. You suspect acute variceal hemorrhage. Which is the best next step in management?\n### Options\nA. Begin octreotide infusion and administer ceftriaxone while arranging urgent endoscopy\nB. Transfuse plasma to normalize the INR before any additional therapy\nC. Start a proton pump inhibitor infusion and defer antibiotics until endoscopy confirms varices\nD. Perform noncontrast CT abdomen to confirm portal hypertension before endoscopy\nE. Give oral lactulose immediately to prevent encephalopathy\n### Correct answer\nA\n### Rationale (2–4 sentences)\nInitial management of suspected acute variceal hemorrhage includes immediate vasoactive therapy (e.g., octreotide) and antibiotic prophylaxis plus urgent endoscopic therapy; these steps improve outcomes and should not be delayed for diagnostic confirmation. Restrictive transfusion (target **Hb 7–9 g/dL**) is favored, and routine correction of INR with plasma is not a primary resuscitation endpoint. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 64-year-old woman with decompensated cirrhosis is found overnight to be progressively somnolent and confused. She has asterixis and is intermittently vomiting. Vitals are stable and oxygen saturation is 94% on room air. The nurse asks for lactulose now. What is the best next step?\n### Options\nA. Administer lactulose orally immediately\nB. Place a nasogastric tube and give lactulose without further evaluation\nC. Secure the airway and then administer enteral lactulose targeting 2–3 soft stools/day\nD. Give IV benzodiazepines for agitation and reassess in 2 hours\nE. Order a screening endoscopy before treating encephalopathy\n### Correct answer\nC\n### Rationale (2–4 sentences)\nOvert hepatic encephalopathy should be treated with lactulose and evaluation for precipitants, but the immediate pitfall here is aspiration risk with depressed mental status and active emesis. Airway protection must come first, after which lactulose can be administered safely with a target of **2–3 soft stools/day**. \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What ascitic PMN count defines SBP and mandates treatment?\n A: SBP is diagnosed when ascitic polymorphonuclear leukocytes are **≥250 cells/mm³**, even if cultures are negative. \n- Q: After a paracentesis removing 7 liters, what albumin replacement is typically indicated?\n A: If **>5 L** is removed, give **6–8 g albumin per liter** removed (e.g., roughly **12–16 g/L** for the 2 L beyond 5 L, per local protocols). \n- Q: In suspected variceal hemorrhage, what hemoglobin target should you transfuse to?\n A: Use a restrictive strategy targeting **Hb 7–9 g/dL** unless there is another compelling indication for higher targets. \n- Q: What is the first-line cathartic target strategy for overt hepatic encephalopathy?\n A: Lactulose is titrated to **2–3 soft stools/day** while treating precipitants and avoiding sedatives that worsen mental status. \n\n## Guidelines & Key References (3–5 bullets)\n- Baveno VII Consensus Workshop: Renewing consensus in portal hypertension (2022) — https://www.journal-of-hepatology.eu/article/S0168-8278(21)02299-6/fulltext \n- AASLD Practice Guidance: Portal hypertension bleeding in cirrhosis / portal hypertension and varices risk stratification (2016 guidance; updated practice guidance available) — https://www.aasld.org/practice-guidelines/portal-hypertension-bleeding-cirrhosis \n- AASLD Practice Guidance: Diagnosis, Evaluation, and Management of Ascites, SBP, and HRS (updated 2021) — https://www.aasld.org/practice-guidelines/diagnosis-evaluation-and-management-ascites-spontaneous-bacterial-peritonitis \n- EASL Clinical Practice Guidelines: Management of patients with decompensated cirrhosis (2018) — https://easl.eu/wp-content/uploads/2018/10/decompensated-cirrhosis-English-report.pdf \n- AASLD/EASL Practice Guideline: Hepatic encephalopathy in chronic liver disease (2014) — https://www.aasld.org/sites/default/files/2022-07/Hepatic%20Encephalopathy%20in%20Chronic%20Liver%20Disease%202014.pdf \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Decompensated cirrhosis with {acute|chronic} portal hypertension — {etiology if known} — {objective evidence: ascites/varices/encephalopathy/jaundice, imaging findings, labs}\n- Acute variceal hemorrhage {suspected|confirmed} — {hemodynamics, Hb trend, transfusions, vasoactive + antibiotic started, endoscopy timing} — {shock/ICU criteria if present} \n- Spontaneous bacterial peritonitis {suspected|confirmed} — {PMN count, culture status, antibiotic started} — {organ dysfunction: AKI, hypotension, lactate} — {albumin given with dose} \n- Hepatic encephalopathy {grade/West Haven} — {precipitant addressed} — {airway status} — {lactulose target, rifaximin if applicable} — {objective neuro findings} \n- Acute kidney injury in cirrhosis {prerenal vs HRS-AKI vs ATN suspected} — {creatinine trend, urine output, diuretics/nephrotoxins held, albumin challenge, consult/ICU needs} \n", "spontaneous-bacterial-peritonitis.md": "---\nfilename: spontaneous-bacterial-peritonitis.md\nid: spontaneous-bacterial-peritonitis\ntitle: Spontaneous Bacterial Peritonitis\nslug: spontaneous-bacterial-peritonitis\ntags: [hepatology, cirrhosis, spontaneous-bacterial-peritonitis]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n\n# Spontaneous Bacterial Peritonitis\n\n## Panic Card (3–6 bullets)\n- ABCs, IV access x2, lactate, blood cultures x2; treat shock with balanced crystalloids in **250–500 mL** boluses and start norepinephrine if **MAP <65 mmHg** after fluids. \n- Do **diagnostic paracentesis now** (do not wait for INR/platelets unless DIC/active uncontrolled bleeding); send cell count/diff + culture. \n- Start empiric antibiotics immediately if ascitic **PMN ≥250 cells/µL** (or if unstable while awaiting count): **ceftriaxone 2 g IV q24h** (or cefotaxime equivalent) and reassess at 48 h. \n- Give IV albumin when higher-risk features: **1.5 g/kg (day 1)** then **1 g/kg (day 3)** (max **100 g/day** if your institution caps dosing) and monitor for pulmonary edema. \n- Hold nephrotoxins/diuretics during AKI or hypotension; strict I&O, daily creatinine, and early ICU consult for escalating oxygen/pressor needs or encephalopathy. \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- SBP is an ascitic fluid infection without a surgically treatable intra-abdominal source; the night-float “can’t miss” step is rapid diagnosis plus early antibiotics because mortality rises with delays and patients may be minimally symptomatic. \n- **Guideline Must Know:** Perform **diagnostic paracentesis** in hospitalized patients with cirrhosis/ascites (new, worsening, or any acute decompensation) and include ascitic **PMN count** and **culture** in the initial evaluation. \n- **Guideline Must Know:** SBP is diagnosed by ascitic **absolute neutrophil count ≥250 cells/µL** regardless of symptoms; start antibiotics at or above this threshold while cultures are pending. \n- **Guideline Must Know:** In stable community-acquired SBP, a third-generation cephalosporin is standard empiric therapy (e.g., **ceftriaxone 2 g IV q24h** or cefotaxime equivalent) with a typical total duration **~5 days** if clinical response is adequate. \n- **Guideline Must Know:** Add IV albumin to reduce renal failure and mortality in higher-risk SBP using **1.5 g/kg on day 1** and **1 g/kg on day 3**; monitor closely for volume overload in cirrhotic cardiomyopathy. \n- **Guideline Must Know:** Consider resistant pathogens and broaden empiric coverage for healthcare-associated/nosocomial SBP, recent broad-spectrum antibiotics, prior MDRO colonization/infection, or severe sepsis; de-escalate once cultures/susceptibilities return. \n- **Guideline Must Know:** If SBP occurs, plan for secondary prophylaxis after treatment because recurrence risk is high; long-term quinolone prophylaxis can reduce SBP but increases resistant infections, so weigh MDRO risk and local patterns. \n- What must happen now: paracentesis (ideally before antibiotics if it won’t delay therapy), prompt empiric antibiotics, hemodynamic assessment (lactate, MAP, urine output), and kidney-protective strategy (avoid NSAIDs/ACEi/ARB; hold diuretics if hypotensive/AKI). \n- What can wait (hours, not days): finalize organism-directed therapy, assess for precipitant (GI bleed, diarrhea, recent procedures), review need for primary/secondary prophylaxis, and coordinate transplant/hepatology follow-up if decompensation is progressing. \n- Don’t miss secondary peritonitis: severe abdominal tenderness/guarding, polymicrobial Gram stain/culture, failure to improve within **48 h**, or concerning ascitic chemistries (very low glucose, very high LDH, very high protein) should trigger CT abdomen/pelvis and urgent surgery consult; “SBP” is the wrong label in that case. \n- Pitfall: delaying paracentesis because of coagulopathy—most cirrhotics have abnormal INR/platelets yet paracentesis is generally safe; prioritize procedure and use ultrasound guidance if available. \n- Pitfall: stopping after “culture-negative” fluid—culture-negative neutrocytic ascites behaves like SBP; treat if **PMN ≥250** even if culture is negative. \n- Renal protection is central: SBP can precipitate AKI/HRS; watch for rising creatinine, oliguria, worsening hyponatremia, and hypotension; escalate early with albumin and ICU-level monitoring when trajectory worsens. \n- Practical reassessment at 48 h: confirm clinical improvement (fever curve, abdominal pain, mental status), check renal trend, and consider repeat paracentesis if no improvement or if diagnosis is uncertain; broaden therapy if nosocomial/MDRO risk. \n- Consults to consider overnight: ICU for vasopressors/respiratory failure, hepatology for decompensated cirrhosis with AKI/HRS concern, and surgery/IR if concern for secondary peritonitis or inaccessible ascites requiring image-guided tap. \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Persistent hypotension or need for vasopressors: **MAP <65 mmHg** despite fluids or rising lactate/oliguria. \n- Worsening respiratory status: escalating oxygen requirement (e.g., **≥6 L/min nasal cannula**, HFNC/BiPAP need) or concern for volume overload during albumin resuscitation. \n- Renal deterioration: creatinine rising, oliguria, or suspected HRS/AKI with SBP (especially if not improving within **24–48 h**). \n- Diagnostic concern for secondary peritonitis: peritoneal signs, polymicrobial results, or no improvement by **48 h** → CT + surgery consult. \n- Severe encephalopathy, new/worsening GI bleed, or suspected ACLF features requiring hepatology/ICU coordination. \n\n## Orders to Place Now (3–6 bullets)\n- Order: Diagnostic paracentesis — {ultrasound guidance if available; send cell count with differential, albumin, total protein, Gram stain; inoculate aerobic/anaerobic cultures in blood culture bottles at bedside}\n- Order: Blood cultures — {two sets before antibiotics if feasible without delaying therapy}\n- Order: Ceftriaxone IV — {2 g IV q24h; planned duration 5 days; adjust for allergy or nosocomial/MDRO risk per stewardship}\n- Order: Albumin 25% IV — {1.5 g/kg now then 1 g/kg on day 3; consider max 100 g/day if local policy; monitor for pulmonary edema}\n- Order: Cirrhosis AKI monitoring bundle — {strict I&O, daily BMP/creatinine, urine sodium if evaluating AKI, hold diuretics/NSAIDs/ACEi/ARB; MAP goal ≥65}\n\n## ABIM Style Question 1\n### Stem\nA 54-year-old man with alcohol-related cirrhosis and known ascites is admitted overnight for fever and confusion. Vitals: T 38.6°C, BP 102/64 mmHg, HR 108/min, SpO₂ 96% on room air. He has moderate abdominal distension with mild diffuse tenderness but no guarding. A bedside paracentesis shows 1,200 WBC/µL with 80% neutrophils; culture is pending. Creatinine is 1.4 mg/dL (baseline 0.9). What is the best next step in management?\n### Options\nA. Start ceftriaxone and give IV albumin 1.5 g/kg now\nB. Observe while awaiting ascitic culture results because he is hemodynamically stable\nC. Start oral ciprofloxacin and discharge with close follow-up\nD. Give lactulose only; antibiotics are not indicated without a positive ascitic culture\nE. Obtain CT abdomen/pelvis before starting antibiotics to exclude perforated viscus\n### Correct answer\nA\n### Rationale (2–4 sentences)\nAn ascitic neutrophil count **≥250 cells/µL** establishes SBP and warrants immediate empiric antibiotics; culture confirmation is not required to start treatment. Albumin adjunct therapy (e.g., **1.5 g/kg day 1**) is recommended for higher-risk patients to reduce renal failure and mortality, particularly with renal dysfunction or other severity features. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 63-year-old woman with decompensated cirrhosis and recurrent SBP is admitted from a skilled nursing facility with fever and abdominal discomfort. She has been taking daily norfloxacin prophylaxis for months. Vitals: T 38.2°C, BP 96/58 mmHg after 1 L crystalloid, HR 112/min. Paracentesis shows ascitic PMN 600 cells/µL. Which empiric antibiotic approach is most appropriate now?\n### Options\nA. Ceftriaxone 2 g IV q24h\nB. Ampicillin-sulbactam IV\nC. Piperacillin-tazobactam IV (with prompt de-escalation when cultures return)\nD. Oral trimethoprim-sulfamethoxazole only\nE. No antibiotics until ascitic culture identifies an organism\n### Correct answer\nC\n### Rationale (2–4 sentences)\nThis is a healthcare-associated SBP presentation with quinolone prophylaxis, increasing the likelihood of resistant organisms and treatment failure with standard third-generation cephalosporin monotherapy. The pitfall is assuming “community-acquired coverage” despite MDRO risk; broader empiric therapy with rapid de-escalation is favored when severity and exposure history suggest resistance. \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What ascitic PMN threshold diagnoses SBP and triggers antibiotics?\n A: **≥250 cells/µL** (absolute neutrophil count), regardless of symptoms. \n- Q: What is the standard adjunct albumin regimen often used in higher-risk SBP?\n A: **1.5 g/kg IV on day 1** and **1 g/kg IV on day 3**. \n- Q: At what timepoint should lack of improvement prompt concern for secondary peritonitis or resistant pathogens?\n A: Failure to improve clinically within **48 hours** should prompt reassessment and broadened evaluation. \n- Q: Does a negative ascitic culture rule out SBP if PMN is elevated?\n A: No; culture-negative neutrocytic ascites is treated as SBP when **PMN ≥250 cells/µL**. \n\n## Guidelines & Key References (3–5 bullets)\n- AASLD Practice Guidance: Diagnosis, Evaluation, and Management of Ascites, SBP, and HRS (2021) — https://onlinelibrary.wiley.com/doi/pdf/10.1002/hep.31884 \n- AASLD Practice Guidelines landing page (updated guidance access) — https://www.aasld.org/practice-guidelines/diagnosis-evaluation-and-management-ascites-spontaneous-bacterial-peritonitis \n- EASL Clinical Practice Guidelines: Management of Patients with Decompensated Cirrhosis (2018) — https://easl.eu/wp-content/uploads/2018/10/decompensated-cirrhosis-English-report.pdf \n- AASLD Liver Fellow Network “Quick Tips: SBP” (2020) — https://www.aasld.org/liver-fellow-network/core-series/tools-trade/quick-tips-spontaneous-bacterial-peritonitis \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Spontaneous bacterial peritonitis — acute; ascitic PMN {value} cells/µL; culture {pending/organism}; symptoms {fever/AMS/abdominal pain}; antibiotic started {drug/dose/time}\n- Sepsis due to SBP — organ dysfunction {AKI/AMS/hypotension}; vitals {T/HR/BP/MAP}; lactate {value}; vasopressors {yes/no}\n- Acute kidney injury in cirrhosis — stage {KDIGO}; creatinine {baseline→peak}; urine output {mL/kg/h}; precipitant {SBP}; treatment {albumin/pressors/hold diuretics}\n- Decompensated cirrhosis with ascites — severity {MELD-Na if available}; complications {SBP/HE/variceal bleed}; objective evidence {ascites on exam/US, labs}\n- Hepatic encephalopathy — grade {I–IV}; precipitant {SBP}; ammonia {if obtained}; treatment {lactulose/rifaximin; airway protection if needed}\n", "hepatic-encephalopathy.md": "---\nfilename: hepatic-encephalopathy.md\nid: hepatic-encephalopathy\ntitle: Hepatic encephalopathy\nslug: hepatic-encephalopathy\ntags: [gastroenterology, cirrhosis, altered-mental-status]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n\n# Hepatic encephalopathy\n\n## Panic Card (3–6 bullets)\n- Protect airway first: if **GCS ≤8**, inability to protect airway, or uncontrolled agitation → call ICU/anesthesia and prepare for intubation; avoid sedatives unless absolutely necessary.\n- Check bedside glucose immediately; treat **hypoglycemia** right now if present (do not attribute all AMS to HE).\n- Rapidly look for and treat precipitants: **GI bleed, infection/sepsis, constipation/ileus, dehydration/over-diuresis, hyponatremia, renal failure, sedatives/opioids/alcohol**; correct the trigger while starting empiric HE therapy. \n- Start lactulose now: give frequent doses and titrate to **2–3 soft stools/day**; if unable to take PO or high aspiration risk, use NG/rectal route.\n- If severe (West Haven **III–IV**) or rapidly worsening mental status, or not improving quickly after initial therapy/trigger correction → escalate to ICU and obtain urgent imaging/labs to exclude alternative diagnoses. \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- HE is a diagnosis of exclusion in patients with liver insufficiency and/or portosystemic shunting: treat empirically when suspected, but simultaneously evaluate for other causes of altered mental status (stroke/ICH, intoxication/withdrawal, metabolic derangements, CNS infection) because alternative causes are common and change management. \n- **Guideline Must Know:** Classify and document HE by type (A acute liver failure, B shunt, C cirrhosis), severity (covert vs overt), time course (episodic/recurrent/persistent), and precipitant (if present); this improves diagnostic clarity and handoffs across night teams. \n- **Guideline Must Know:** Overt HE is graded clinically; use West Haven criteria (reliability best from **grade ≥II**) and add **GCS** for West Haven **III–IV** to standardize severity and monitoring during deterioration or ICU transfer. \n- Now: do a trigger-focused “night float sweep” within minutes—review vitals and I/O for dehydration/over-diuresis, check medication MAR for benzodiazepines/opioids/sedatives, assess bowel pattern for constipation, look for hematemesis/melena, and screen for infection sources (lungs/urine/ascites/lines). \n- **Guideline Must Know:** Plasma ammonia is not useful to “stage” or “prove” HE when elevated, but a **normal** ammonia should prompt diagnostic re-evaluation for non-HE causes of encephalopathy (don’t anchor on cirrhosis alone). \n- **Guideline Must Know:** Management is a four-pronged sequence: (1) initial care for altered consciousness, (2) actively seek/treat alternative causes, (3) identify/correct precipitants, and (4) start empirical anti-HE therapy—do these in parallel, not serially, on nights. \n- **Guideline Must Know:** Lactulose is first-line for episodic overt HE; titrate to **2–3 soft stools/day** (avoid both undertreatment and iatrogenic dehydration). If diarrhea, rising sodium, or AKI develops, down-titrate and replace volume/electrolytes rather than stopping precipitously. \n- If poor intake, somnolence, or aspiration risk, deliver lactulose via NG tube; if ileus or cannot use enteral route, use rectal administration and aggressively treat constipation/obstruction while monitoring for electrolyte shifts and skin breakdown.\n- Treat precipitating GI bleeding as an emergency: resuscitate to goals, start vasoactive/antibiotic therapy when variceal bleed suspected, and correct constipation from blood load; HE often improves only after the bleed and hypovolemia are controlled. \n- Treat infection/sepsis early (cultures, antibiotics, source control): infection is a frequent precipitant, and persistent encephalopathy despite lactulose should heighten suspicion for occult infection, intracranial pathology, or medication/toxin effect. \n- Avoid common night-shift pitfalls: giving benzodiazepines for “agitation” without ruling out HE/withdrawal, missing Wernicke encephalopathy (give thiamine before glucose in malnourished/alcohol use), and over-diuresis leading to hypovolemia/AKI which worsens HE. \n- **Guideline Must Know:** Secondary prophylaxis after an overt episode is recommended; lactulose is recommended after the initial episode, and rifaximin is recommended as add-on to lactulose after the **second** overt episode to prevent recurrence—document the episode count clearly. \n- **Guideline Must Know:** Routine prophylaxis solely for post-TIPS HE is not recommended; instead, focus on precipitant control and individualized risk mitigation (shunt evaluation, medication review, constipation prevention). \n- Nutrition matters overnight: do not “protein-restrict” by default—target **protein 1.2–1.5 g/kg/day** and adequate calories; consider branched-chain amino acids or other adjuncts only for nonresponse/intolerance to standard therapy and with specialist input. \n- What can wait until daylight (if stable): formal covert HE testing, longer-term driver safety counseling, evaluation for large spontaneous portosystemic shunts, and transplant candidacy discussions—unless HE is recurrent/intractable with liver failure, which should prompt earlier hepatology/transplant contact. \n- Escalation mindset: lack of improvement after prompt precipitant correction plus adequate bowel regimen, new focal deficits, fever/shock, or need for escalating oxygen/airway support should shift the differential away from “simple HE” and toward ICU-level monitoring and broader workup. \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- West Haven **III–IV** (stupor/coma), **GCS ≤10**, or inability to protect airway/aspiration events.\n- New focal neurologic deficits, seizure, severe headache, or concern for intracranial bleed/stroke (especially on anticoagulation).\n- Hemodynamic instability (**MAP <65 mmHg** despite fluids), rising lactate, or suspected sepsis/shock.\n- Acute respiratory failure needing **high-flow oxygen**, noninvasive ventilation, or intubation; uncontrolled agitation requiring continuous sedative infusion.\n- No meaningful improvement after adequate lactulose delivery plus precipitant correction, or worsening AKI/electrolytes (e.g., rising creatinine, severe hyponatremia).\n\n## Orders to Place Now (3–6 bullets)\n- Order: Lactulose — {route PO/NG/PR} {dose} {frequency} {titrate to 2–3 soft stools/day}\n- Order: Rifaximin — {dose 550 mg} {route PO/NG} {frequency BID} {start if recurrent OHE/high risk or per hepatology}\n- Order: Altered mental status workup labs — {CMP with Na/K/Cr} {glucose} {CBC} {INR} {venous blood gas} {ammonia} {CRP or procalcitonin if infection suspected}\n- Order: Infectious evaluation — {blood cultures x2 if febrile} {urinalysis/urine culture} {chest radiograph} {diagnostic paracentesis if ascites and concern for SBP}\n- Order: CT head without contrast — {indication: new focal deficit, head trauma/fall, anticoagulation, nonresponse to therapy, diagnostic uncertainty}\n- Order: Thiamine — {dose 200 mg IV} {frequency q8h x 3 days then daily} {give before glucose if malnourished/alcohol use}\n\n## ABIM Style Question 1\n\n### Stem\nA 58-year-old man with known cirrhosis is admitted for worsening confusion and asterixis. He is afebrile, BP 118/72 mmHg, HR 92/min, SpO₂ 96% on room air. Family reports no focal neurologic symptoms. He has not had a bowel movement in 3 days and started taking oxycodone after a fall. Basic labs show Na 130 mmol/L, creatinine 1.4 mg/dL (baseline 1.0), glucose 6.1 mmol/L. Which is the best initial therapy to reverse his mental status change overnight?\n\n### Options\nA. Start lactulose and titrate to 2–3 soft stools per day\nB. Start rifaximin monotherapy\nC. Start a benzodiazepine for agitation and insomnia\nD. Restrict dietary protein to 0.6 g/kg/day\nE. Give flumazenil to reverse suspected hepatic encephalopathy\n\n### Correct answer\nA\n\n### Rationale (2–4 sentences)\nLactulose is recommended as the first-line treatment for episodic overt hepatic encephalopathy and should be titrated to achieve **2–3 soft stools/day**, while precipitants (constipation, sedatives, dehydration/AKI) are corrected. Rifaximin is recommended as add-on therapy to lactulose for prevention of recurrence (typically after recurrent episodes), not as initial monotherapy. \n\n## Second ABIM Style Case (Pitfall Variant)\n\n### Stem\nA 66-year-old woman with decompensated cirrhosis is brought in for acute confusion. She is somnolent but arousable, has no asterixis, and her family says “this looks like her prior hepatic encephalopathy.” Vitals are stable and she is afebrile. Her plasma ammonia level returns **normal**. Which is the most appropriate next step?\n\n### Options\nA. Stop further evaluation because a normal ammonia excludes delirium\nB. Treat with lactulose only and defer all other workup\nC. Re-evaluate for alternative causes of encephalopathy and obtain targeted testing (e.g., glucose/electrolytes, infection assessment, neuroimaging if indicated)\nD. Start high-dose protein restriction immediately\nE. Start routine prophylactic therapy solely because she has a history of TIPS\n\n### Correct answer\nC\n\n### Rationale (2–4 sentences)\nA **normal ammonia** level calls the diagnosis of HE into question and should prompt diagnostic re-evaluation for alternative or additional causes of altered mental status while maintaining clinical vigilance. The pitfall is anchoring on cirrhosis history and skipping the standard encephalopathy workup, which risks missing infection, metabolic derangements, or intracranial pathology. \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\nFormat each item exactly:\n- Q: <yes/no OR single-step calculation OR key cutoff>\n A: <1–2 strictly factual sentences; no teaching prose>\n- Q: Does an elevated ammonia level alone confirm hepatic encephalopathy?\n A: No. Elevated ammonia alone does not add diagnostic or staging value for HE in chronic liver disease. \n- Q: What ammonia result should trigger diagnostic re-evaluation away from HE?\n A: A normal ammonia level should prompt re-evaluation for alternative diagnoses. \n- Q: After how many overt HE episodes is rifaximin recommended as add-on to lactulose for recurrence prevention?\n A: After the second episode of overt HE, rifaximin is recommended as add-on to lactulose for prevention of recurrent episodes. \n- Q: What daily protein intake is recommended in patients with HE?\n A: **1.2–1.5 g/kg/day**. \n\n## Guidelines & Key References (3–5 bullets)\n- AASLD/EASL Practice Guideline: Hepatic Encephalopathy in Chronic Liver Disease (2014) — https://www.aasld.org/sites/default/files/2022-07/Hepatic%20Encephalopathy%20in%20Chronic%20Liver%20Disease%202014.pdf \n- EASL Clinical Practice Guidelines on the management of hepatic encephalopathy (2022) — https://www.journal-of-hepatology.eu/article/S0168-8278%2822%2900346-4/fulltext \n- AASLD Practice Guidelines landing page: Hepatic Encephalopathy — https://www.aasld.org/practice-guidelines/hepatic-encephalopathy \n- EASL Clinical Practice Guidelines: management of decompensated cirrhosis (2018) — https://www.journal-of-hepatology.eu/article/S0168-8278%2818%2931966-4/fulltext \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute hepatic encephalopathy — {overt vs covert} {West Haven grade} {GCS if grade III–IV} {type C cirrhosis} {precipitant: infection/GI bleed/constipation/dehydration/hyponatremia/medication} {objective: exam findings, orientation, asterixis, labs} {treatment: lactulose titration, rifaximin, trigger correction}\n- Acute metabolic encephalopathy — {if alternative cause suspected/confirmed} {cause: sepsis/electrolyte/glucose/uremia/intoxication} {objective evidence} {treatments initiated}\n- Aspiration risk/acute respiratory failure — {if present} {oxygen requirement/ABG} {airway protection plan/ICU transfer}\n- Acute kidney injury in cirrhosis — {stage} {baseline vs current creatinine} {suspected cause: hypovolemia/diuretics/sepsis/HRS} {albumin/fluids held diuretics} {urine output}\n- Suspected infection precipitating HE — {source} {SIRS/sepsis criteria if met} {cultures obtained} {antibiotics started} {hemodynamics/lactate}\n", "inflammatory-bowel-disease.md": "---\nfilename: inflammatory-bowel-disease.md\nid: inflammatory-bowel-disease\ntitle: Inflammatory Bowel Disease\nslug: inflammatory-bowel-disease\ntags: [gastroenterology, inflammatory-bowel-disease, night-float]\nlevel: resident\nestimated_time_min: 18\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# Inflammatory Bowel Disease\n\n## Panic Card (3–6 bullets)\n- ABCs, IV access x2, monitor, strict I&O; if hypotensive give crystalloid bolus and target **MAP ≥65 mmHg**; type and screen if bleeding.\n- If severe bloody diarrhea/fever: send stool for **C. difficile NAAT/toxin** and enteric pathogens; draw CBC/CMP/CRP, lactate if ill; blood cultures if **T ≥38.0°C**.\n- Start VTE prophylaxis unless active life-threatening bleeding: **enoxaparin 40 mg SC daily** (or **heparin 5,000 units SC q8–12h** if severe CKD); IBD flare is hypercoagulable.\n- If acute severe colitis suspected: start IV steroid after infection evaluation started: **methylprednisolone 60 mg IV daily** (or **hydrocortisone 100 mg IV q6h**); avoid NSAIDs, antimotility agents, and new opioids if possible.\n- If abdominal distension, severe tenderness, or systemic toxicity: get STAT abdominal imaging; treat as toxic megacolon/perforation until proven otherwise; call GI and surgery early.\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Night-float framing: inpatient IBD problems are usually (1) acute severe ulcerative colitis (ASUC), (2) Crohn’s flare with complication (abscess/obstruction), or (3) “flare mimic” (infection, ischemia, drug-related); your first job is to stabilize, exclude catastrophe, and avoid iatrogenic harm from premature immunosuppression.\n- **Guideline Must Know:** ASUC is a life-threatening phenotype; use objective severity and trend response daily: **≥6 bloody stools/day** plus systemic toxicity (e.g., **HR ≥90**, **T ≥37.8°C**, **Hb ≤10.5 g/dL**, **ESR ≥30 mm/h**) and high inflammatory burden (CRP/albumin) to justify urgent GI involvement and inpatient rescue planning (ACG UC 2025; ECCO UC 2022).\n- **Guideline Must Know:** Always evaluate for infection at presentation of suspected flare—especially **C. difficile**—because treatment differs and immunosuppression can worsen outcomes; send stool testing early and do not delay supportive care while results are pending (ACG UC 2025).\n- **Guideline Must Know:** Start IV corticosteroids for ASUC once initial infection evaluation is underway and there is no frank sepsis/perforation concern: **methylprednisolone 60 mg IV daily** or **hydrocortisone 100 mg IV q6h**; reassess daily stool frequency, vitals, CRP, and abdominal exam, and document objective response/nonresponse (ACG UC 2025; ECCO UC 2022).\n- Separate “do now” vs “can wait”: now—fluids/electrolytes, infection testing, VTE prophylaxis, imaging if toxic, IV steroids if appropriate, pain control without ileus, and early consults; can wait—maintenance biologic planning, outpatient treat-to-target strategy, and elective nutrition counseling once stable.\n- **Guideline Must Know:** Steroid nonresponse in ASUC requires escalation, not “more days of the same”: plan for medical rescue when no meaningful improvement by **day 3–5** of IV steroids; typical rescue options are **infliximab 5 mg/kg IV** or **cyclosporine 2 mg/kg/day IV** with drug-level/toxicity monitoring, alongside early surgical consultation (ACG UC 2025; ECCO UC 2022).\n- Toxic megacolon/perforation is the can’t-miss complication: suspect with increasing distension, worsening pain, systemic toxicity, rising lactate, or ileus; imaging red flag is **colonic diameter >6 cm**; avoid colonoscopy and antimotility agents; keep patient **NPO**, correct electrolytes (especially K/Mg), start broad-spectrum antibiotics if toxic/perforation concern, and engage surgery urgently.\n- **Guideline Must Know:** Crohn’s “flare” on the floor is often a complication (abscess, stricture, fistula) rather than pure inflammation; severe focal pain, peritoneal signs, high fever, or marked leukocytosis should trigger cross-sectional imaging and antibiotics/drainage pathways before giving high-dose steroids.\n- What can go wrong at night: giving loperamide/opioids in severe colitis (ileus/megacolon), missing sepsis from an abscess, delaying rescue therapy until daytime, or overlooking VTE risk; also watch for steroid complications (hyperglycemia, delirium, hypertension) and correct dehydration-driven AKI.\n- Bleeding/anemia: most IBD bleeding is mucosal oozing; resuscitate to physiology, not the number, but use a restrictive transfusion approach in stable adults—consider RBC transfusion when **Hb <7 g/dL** (often **<8 g/dL** if significant cardiovascular disease or symptomatic) while you address ongoing losses and hemodynamics.\n- **Guideline Must Know:** Pharmacologic VTE prophylaxis is generally recommended during moderate–severe IBD hospitalization even with hematochezia unless bleeding is hemodynamically significant; document the risk–benefit logic if you hold it, and reassess each shift (ACG UC 2025).\n- When to call ICU early: escalating oxygen needs, hypotension despite fluids, altered mental status, rising lactate, or impending respiratory failure from sepsis; IBD patients can decompensate quickly from infection, perforation, or massive hemorrhage.\n- Medication reconciliation matters: confirm recent biologics/JAK inhibitors/steroids, missed doses, and infection prophylaxis; avoid starting a new advanced therapy overnight unless part of an established rescue plan with GI, and use “Confirm Before Proceed” logic before irreversible steps (e.g., emergent colectomy pathway, cyclosporine initiation).\n- Documentation that changes outcomes: exact stool count/24h, blood amount, nocturnal stools, vitals trend, abdominal exam, imaging results, and “steroid day number” with objective response; this drives morning rescue decisions and surgical timing.\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Hemodynamic instability: **SBP <90 mmHg** or **MAP <65 mmHg** after fluids, **lactate ≥2 mmol/L**, or new vasopressor need.\n- Suspected toxic megacolon/perforation: peritonitis, ileus with systemic toxicity, or imaging with **colonic diameter >6 cm** and worsening clinical status.\n- Severe hemorrhage: ongoing hematochezia with tachycardia/hypotension, need for **≥2 units RBC** in 24 hours, or **Hb drop ≥2 g/dL** with symptoms.\n- Steroid-refractory ASUC: no meaningful improvement by **day 3–5** of IV steroids, rising CRP, or worsening stool frequency/bleeding.\n- Suspected Crohn’s complication: focal severe pain, high fever, or imaging concern for abscess/obstruction/fistula requiring IR/surgery and IV antibiotics.\n\n## Orders to Place Now (3–6 bullets)\n- Order: IV access and monitoring — {iv_lines=2, telemetry=yes, strict_io=yes}\n- Order: Labs for severe colitis/bleeding — {cbc_now=yes, cmp_now=yes, crp_now=yes, esr_optional=yes, lactate_if_toxic=yes, type_and_screen_if_bleeding=yes}\n- Order: Infectious stool evaluation — {c_difficile_naat_or_toxin=yes, gi_pathogen_pcr_if_available=yes, stool_culture_if_requested=yes}\n- Order: IV corticosteroid for suspected ASUC — {drug=methylprednisolone, dose=60 mg IV daily, start_time=now, hold_if_sepsis_or_perforation_suspected=yes}\n- Order: VTE prophylaxis — {enoxaparin=40 mg SC daily, alternative_if_egfr_lt_30=heparin 5000 units SC q8-12h, hold_if_unstable_bleeding=yes}\n- Order: Abdominal imaging for distension/toxicity — {study=abdominal_xray_or_ct_abd_pelvis, indication=distension_or_severe_tenderness_or_toxicity, timing=stat}\n\n## ABIM Style Question 1\n### Stem\nA 29-year-old man with known ulcerative colitis is admitted for 10 days of worsening bloody diarrhea. He has **10–12 bloody stools/day**, HR 104/min, T 38.2°C, and Hb 9.8 g/dL. Stool testing for **C. difficile** is negative, blood cultures show no growth, and an abdominal radiograph shows no colonic dilation. He has received **methylprednisolone 60 mg IV daily** for 3 days with no meaningful improvement (still 9–10 bloody stools/day). What is the best next step?\n### Options\nA. Continue IV steroids for 7 more days before changing therapy\nB. Start loperamide to reduce stool frequency\nC. Initiate infliximab **5 mg/kg IV** as rescue therapy and involve surgery early\nD. Switch to oral prednisone and add oral mesalamine for induction\nE. Discharge with close outpatient follow-up and oral budesonide\n### Correct answer\nC\n### Rationale (2–4 sentences)\nFailure to improve after **3–5 days** of IV corticosteroids in ASUC should prompt rescue therapy (e.g., infliximab **5 mg/kg IV** or calcineurin inhibitor) and early surgical collaboration rather than prolonged steroids. ACG UC 2025 and ECCO UC 2022 emphasize timely escalation to reduce complications and delayed colectomy risk. Antimotility agents are avoided in severe colitis due to ileus/megacolon risk.\n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 62-year-old woman with ulcerative colitis on azathioprine presents with 6 days of worsening watery diarrhea and new hematochezia. She is tachycardic (HR 112/min) and mildly febrile (T 38.0°C). CT abdomen shows diffuse colitis without perforation. Stool testing returns positive for **C. difficile**. What is the best next step?\n### Options\nA. Start methylprednisolone **60 mg IV daily** immediately for presumed ASUC\nB. Start oral vancomycin **125 mg PO q6h** and hold escalation of immunosuppression until infection is addressed\nC. Start infliximab **5 mg/kg IV** tonight as rescue therapy\nD. Start loperamide and oral rehydration only\nE. Perform colonoscopy with full bowel prep overnight to stage disease\n### Correct answer\nB\n### Rationale (2–4 sentences)\nThe pitfall is treating an infectious colitis mimic as an IBD flare: a positive **C. difficile** test shifts first-line management to targeted antibiotic therapy (e.g., oral vancomycin **125 mg q6h**) before escalating immunosuppression. ACG UC guidance emphasizes infection exclusion in suspected flares and recognizes **C. difficile** as a common, high-impact trigger for worsening symptoms. What changed the decision here?\nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What colonic diameter on imaging supports toxic megacolon?\n A: **>6 cm** colonic dilation in the appropriate clinical context supports toxic megacolon.\n- Q: After how many days of IV steroids in ASUC should you plan rescue therapy if no meaningful improvement?\n A: Plan rescue therapy if no meaningful improvement by **day 3–5** of IV steroids.\n- Q: What is a standard IV steroid regimen for ASUC?\n A: **Methylprednisolone 60 mg IV daily** (or **hydrocortisone 100 mg IV q6h**) is commonly used.\n- Q: In a hemodynamically stable adult inpatient, at what hemoglobin is RBC transfusion generally considered using a restrictive strategy?\n A: Consider transfusion when **Hb <7 g/dL**; higher thresholds may be used with symptoms or significant cardiovascular disease.\n\n## Guidelines & Key References (3–5 bullets)\n- ACG Clinical Guideline Update: Ulcerative Colitis in Adults (2025) — https://mdcgastro.com.au/wp-content/uploads/2025/06/ACG-Ulcerative-Colitis-Clinical-Guideline-Update.pdf \n- ACG Clinical Guideline: Management of Crohn’s Disease in Adults (2025) — https://mdcgastro.com.au/wp-content/uploads/2025/06/ACG-Crohns-Disease-Clinical-Guideline-Update.pdf \n- ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment (2022) — https://academic.oup.com/ecco-jcc/article/16/1/2/6390052 \n- AGA Living Clinical Practice Guideline on Pharmacological Management of Moderate-to-Severe Ulcerative Colitis (2024) — https://gastro.org/clinical-guidance/living-guideline-for-moderate-to-severe-ulcerative-colitis/ \n- Red Blood Cell Transfusion: 2023 AABB International Guidelines (2023) — https://jamanetwork.com/journals/jama/fullarticle/2810754 \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute severe ulcerative colitis — {acuity=acute-severe, severity_criteria=stool_count_per_24h + vitals + labs, objective_evidence=HR/T/Hb/CRP/albumin, treatment=IV_steroids + monitoring, response_status=day_number_and_trend}\n- Suspected toxic megacolon — {acuity=acute, cause=severe_colitis, severity=systemic_toxicity + imaging, objective_evidence=abdominal_exam + xray_or_ct_diameter_cm, treatment=NPO + electrolyte_repletion + consults}\n- Crohn’s flare with suspected complication — {acuity=acute, type=luminal_vs_obstructing_vs_abscess, objective_evidence=CT_findings + WBC/CRP + exam, treatment=antibiotics_and_or_IR_or_surgery + avoid_steroids_if_abscess_uncontrolled}\n- Acute blood loss anemia due to colitis — {acuity=acute, cause=lower_gi_bleeding_from_colitis, severity=Hb_value + symptoms + hemodynamics, objective_evidence=serial_Hb + vitals, treatment=IV_fluids + transfusion_if_indicated}\n", "celiac-disease.md": "---\nfilename: celiac-disease.md\nid: celiac-disease\ntitle: Celiac Disease\nslug: celiac-disease\ntags: [gastroenterology, malabsorption, night-float]\nlevel: resident\nestimated_time_min: 12\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n\n# Celiac Disease\n\n## Panic Card (3–6 bullets)\n- Assess stability first: vitals, orthostasis, mental status, urine output; treat shock/dehydration with **balanced crystalloid 500–1,000 mL bolus** then reassess.\n- If severe diarrhea/vomiting: check **BMP, Mg²⁺, PO₄³⁻, glucose**, start electrolyte repletion; if malnourished, give **thiamine 100 mg IV/PO** before carbohydrate load to reduce refeeding risk.\n- If GI bleeding or symptomatic anemia: type and screen; transfuse based on symptoms/hemodynamics and **Hgb threshold per hospital policy**; urgent GI consult if ongoing bleed.\n- If infection/alternate acute abdomen possible (fever, leukocytosis, peritonitis): broaden differential and evaluate now (stool studies/CT as indicated); do not anchor on “celiac flare.”\n- Confirm Before Proceed: avoid committing the patient to a lifelong **gluten-free diet** label before diagnostic confirmation unless clinically necessary (e.g., unstable malabsorption requiring immediate nutrition changes).\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Night-float framing: inpatient “celiac disease” issues are usually (1) undiagnosed malabsorption presenting as diarrhea/weight loss/anemia, (2) diagnosed celiac with persistent symptoms from g

rse coagulopathy when indicated, urgent GI consult.\n- Confirm Before Proceed: do not place nasogastric/orogastric tube or attempt blind instrumentation if **perforation or caustic ingestion** suspected (worsens injury/perforation risk).\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Tonight’s high-risk esophageal problems are not “routine GERD”: focus on airway/aspiration risk (drooling, inability to swallow saliva), perforation, bleeding, and obstructing dysphagia; stabilize first, then diagnose.\n- **Guideline Must Know:** For classic reflux symptoms without alarm features, the standard initial approach is an empiric **PPI once daily 30–60 min before a meal for ~8 weeks**; inpatient, this often means restarting/optimizing PPI timing rather than adding multiple agents. \n- **Guideline Must Know:** Alarm features (especially **dysphagia, GI bleeding, weight loss**) warrant **endoscopy as first test** rather than empiric escalation; if these appear overnight, keep **NPO after midnight**, place consult early, and avoid delaying with non-diagnostic barium studies. \n- Separate “what must happen now” vs “what can wait”: now = airway/aspiration evaluation, hemodynamic stabilization, sepsis screen if perforation suspected, and urgent consults for obstruction/bleeding; can wait = lifestyle counseling, outpatient reflux testing, and long-term cancer prevention discussions.\n- Refractory “GERD” on the floor often isn’t GERD: think pill esophagitis (doxycycline, bisphosphonates, KCl), infectious esophagitis (immunosuppression), EoE, achalasia, or malignancy; new progressive dysphagia is a red flag, especially solids → liquids.\n- Esophageal food impaction: key pivot is whether the patient can manage secretions; inability to swallow saliva, persistent drooling, or respiratory symptoms = **emergent endoscopy** pathway, keep **NPO**, avoid giving large volumes by mouth, and prepare for airway management.\n- **Guideline Must Know:** ASGE guidance prioritizes **urgent endoscopic removal** for high-risk esophageal impactions (airway risk, complete obstruction, sharp objects, batteries) and recommends structured evaluation rather than “watchful waiting” when obstruction is complete. \n- Suspected perforation (Boerhaave, post-procedure): treat as time-critical sepsis source; immediate **NPO + broad IV antibiotics + early surgery consult**; obtain CT chest/abdomen (often with water-soluble oral contrast if tolerated) and avoid anything that increases intraluminal pressure.\n- GERD mimics during night float: cardiac ischemia, PE, aortic pathology, pancreatitis; for chest pain, do not anchor on reflux until life-threatening causes are reasonably excluded.\n- **Guideline Must Know:** Achalasia is suggested by dysphagia to **solids and liquids**, regurgitation, weight loss, or “GERD” unresponsive to acid suppression; definitive diagnosis is by **high-resolution manometry**, but inpatient role is to recognize pattern, keep aspiration precautions, and arrange GI workup. \n- **Guideline Must Know:** Treatment selection for achalasia depends on subtype; PD, LHM, and POEM are effective options for many patients, with POEM favored for type III in guidelines—overnight, the key is early recognition and avoiding inappropriate escalation of acid suppression alone. \n- **Guideline Must Know:** Eosinophilic esophagitis is a common cause of recurrent food impaction and dysphagia; guideline-based therapy includes PPI, swallowed topical steroids, elimination diets, and dilation for fibrostenosis, but inpatient action is mainly obstruction management and ensuring biopsy/diagnostic follow-up. \n- Infectious esophagitis clues: severe odynophagia, immunosuppression, oral thrush (candida), deep chest pain; stabilize pain control, hydration, and consult GI if severe/bleeding/obstructing; avoid empiric steroids unless clear indication.\n- Bleeding from severe reflux esophagitis or ulcer: treat as UGIB—resuscitate, correct shock, hold anticoagulants when safe, and coordinate urgent endoscopy timing; give IV PPI for suspected high-risk lesions while awaiting GI plan.\n- Inpatient medication strategy: if aspiration risk or strict NPO, use IV PPI (e.g., pantoprazole) and IV antiemetics; if able to take PO, prioritize correct timing and avoid duplicative acid suppression unless there is a clear nocturnal breakthrough plan.\n- Pitfalls: missing perforation after vomiting/endoscopy; giving oral meds/food to a complete obstruction; assuming all dysphagia is “GERD”; and delaying escalation when objective triggers appear (new oxygen need, rising lactate, fever, hypotension, mediastinal air).\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Suspected perforation with any of: **SBP <90 mmHg**, **lactate ≥2 mmol/L** with concern for sepsis, fever with rigors, or imaging concern for mediastinal air/fluid.\n- Food impaction with inability to handle secretions, aspiration, stridor, or escalating oxygen/ventilatory support.\n- Upper GI bleeding with hemodynamic instability, ongoing hematemesis, or transfusion requirement suggesting active hemorrhage.\n- Progressive dysphagia with inability to swallow liquids or new focal neurologic deficits (concern for stroke-related dysphagia vs obstructing lesion) requiring urgent multidisciplinary evaluation.\n\n## Orders to Place Now (3–6 bullets)\n- Order: NPO — {reason: dysphagia/food impaction/perforation concern; allow_meds: yes/no}\n- Order: Pantoprazole — {route: IV/PO; dose: 40 mg; frequency: q12h for bleeding concern or q24h for GERD; timing: 30–60 min pre-meal if PO}\n- Order: CT chest with IV contrast — {indication: perforation concern; add_oral_contrast: water-soluble if tolerated; creatinine: {value}}\n- Order: Piperacillin-tazobactam — {dose: 4.5 g; route: IV; frequency: q6h; allergy_plan: {alternative}}\n- Order: Type and screen — {indication: hematemesis/melena or anticipated endoscopy/surgery}\n\n## ABIM Style Question 1\n### Stem\nA 58-year-old man is admitted for COPD exacerbation. Overnight he reports burning retrosternal discomfort and sour taste that worsen after meals and when lying flat. He denies dysphagia, weight loss, hematemesis, or melena. Vitals are stable, and his cardiac workup earlier in the day was negative. Which is the best initial management?\n### Options\nA. Start a proton pump inhibitor once daily 30–60 minutes before breakfast for 8 weeks\nB. Start sucralfate scheduled four times daily and stop all acid suppression\nC. Order a barium swallow as the first diagnostic test\nD. Start baclofen nightly for presumed reflux-related symptoms\nE. Order urgent upper endoscopy tonight\n### Correct answer\nA\n### Rationale (2–4 sentences)\nFor classic reflux symptoms without alarm features, guidelines recommend an empiric **8-week** trial of a **once-daily PPI taken 30–60 minutes before a meal** as the initial step. Endoscopy is prioritized for alarm symptoms such as **dysphagia or GI bleeding**, and baclofen is not recommended without objective evidence of GERD. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 66-year-old woman on alendronate is admitted for cellulitis. At 2 a.m. she develops sudden severe odynophagia and substernal pain after taking her bedtime pills with a small sip of water while lying flat. She is afebrile, hemodynamically stable, and has no drooling or respiratory distress. Which is the best next step tonight?\n### Options\nA. Give a large oral water challenge to “push the pills through”\nB. Keep NPO, start PPI, provide analgesia, and stop the offending medication\nC. Start IV thrombolysis for presumed esophageal ischemia\nD. Place a nasogastric tube for decompression and medication delivery\nE. Start high-dose oral steroids immediately\n### Correct answer\nB\n### Rationale (2–4 sentences)\nThis presentation is most consistent with pill esophagitis; immediate management is **stop the culprit medication**, reduce acid exposure (e.g., PPI), and provide supportive care while avoiding further esophageal injury. The pitfall is provoking worsening mucosal damage with forced oral intake or blind instrumentation; NG placement is inappropriate unless a separate indication exists. What changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: In suspected esophageal perforation, what is the immediate dietary order?\n A: Make the patient **NPO immediately** and avoid blind esophageal instrumentation.\n- Q: What symptom makes food bolus impaction an airway emergency?\n A: **Inability to handle secretions** (drooling/cannot swallow saliva) with aspiration risk.\n- Q: When should endoscopy be first-line in suspected GERD rather than empiric PPI?\n A: When there is **dysphagia or other alarm symptoms** such as GI bleeding or weight loss. \n- Q: How should a PPI be timed for best symptom control when given orally?\n A: **30–60 minutes before a meal**, typically before breakfast. \n\n## Guidelines & Key References (3–5 bullets)\n- ACG Clinical Guideline: Diagnosis and Management of Gastroesophageal Reflux Disease (2022) — https://doi.org/10.14309/ajg.0000000000001538 \n- ACG Clinical Guideline: Diagnosis and Management of Achalasia (2020) — https://sysge.org/wp-content/uploads/Achalasia.pdf \n- ACG Guideline: Diagnosis and Management of Barrett’s Esophagus (2022) — https://www.giboardreview.com/wp-content/uploads/2022/04/Guideline-2022-ACG-barretts.pdf \n- ASGE Guideline: Management of Ingested Foreign Bodies and Food Impactions (2011) — https://www.asge.org/docs/default-source/education/practice_guidelines/doc-management-of-ingested-foreign-bodies-and-food-impactions.pdf \n- ACG Clinical Guideline: Diagnosis and Management of Eosinophilic Esophagitis (2025) — https://www.medils.com/static/guide/ACG-Eosinophilic-Esophagitis.pdf \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Esophageal food bolus impaction — acuity: acute; severity: complete vs partial obstruction; evidence: drooling/inability to handle secretions, imaging/endoscopy findings; treatment: NPO, urgent endoscopy consult, airway precautions\n- Suspected esophageal perforation — acuity: acute; cause: post-emesis/post-procedure/foreign body; organ dysfunction: sepsis/shock criteria if present; evidence: vitals, lactate, CT findings; treatment: NPO, IV antibiotics, surgery consult\n- Reflux esophagitis with bleeding — acuity: acute; cause: reflux/ulceration; severity: hemodynamic impact/transfusion; evidence: hematemesis/melena, Hgb trend, vitals; treatment: IV PPI, resuscitation, GI consult\n- Pill esophagitis — acuity: acute; cause: medication exposure + recumbent ingestion; severity: odynophagia/inability to tolerate PO; evidence: symptom timing, offending agent; treatment: stop agent, acid suppression, analgesia, diet plan\n", "peptic-ulcer-disease.md": "---\nfilename: peptic-ulcer-disease.md\nid: peptic-ulcer-disease\ntitle: peptic ulcer disease\nslug: peptic-ulcer-disease\ntags: [gastroenterology, gi-bleed, inpatient]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n\n# peptic ulcer disease\n\n## Panic Card (3–6 bullets)\n- Assess ABCs; if hematemesis/altered mental status or ongoing large-volume bleed, prepare airway and place **2 large-bore IVs (14–16G)**, start **1–2 L isotonic crystalloid** while activating GI/ICU early. \n- Draw STAT labs: CBC, CMP, INR/PTT, type and screen/cross; trend hemoglobin q6h and watch for shock (tachycardia, hypotension, rising lactate). \n- If overt UGIB suspected, start **pantoprazole 80 mg IV bolus then 8 mg/h infusion** (or equivalent high-dose IV PPI) and keep **NPO** pending endoscopy. \n- Transfuse packed RBCs using a restrictive strategy in stable patients: consider transfusion at **Hgb <7 g/dL** (often **<8 g/dL** if significant cardiovascular disease or ongoing ischemia). \n- Confirm Before Proceed: If on anticoagulants/antiplatelets with life-threatening bleeding, coordinate reversal/holding strategy with GI/ICU/cardiology and document indication, agent, last dose, and risk tradeoffs before irreversible reversal. \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Peptic ulcer disease (PUD) is most night-float relevant when complicated by **upper GI bleeding**, **perforation**, or less commonly **gastric outlet obstruction**; the immediate task overnight is to identify instability, resuscitate, and get appropriate urgent endoscopic/surgical pathways moving. \n- Separate “must happen now” vs “can wait”: must now = hemodynamic stabilization, risk stratification, PPI strategy, transfusion planning, medication reconciliation (NSAIDs, aspirin, anticoagulants), and consult activation; can wait = outpatient dyspepsia workup, chronic prevention planning once stabilized. \n- **Guideline Must Know:** Use a validated pre-endoscopy risk tool to identify very low-risk UGIB patients; **Glasgow-Blatchford Score (GBS) ≤1** predicts very low need for intervention and may support outpatient management when appropriate (rare on an inpatient service but helps triage “call GI now” vs “first stabilize”). \n- **Guideline Must Know:** For hospitalized UGIB, employ a restrictive transfusion strategy—consider RBC transfusion at **Hgb <7 g/dL** in hemodynamically stable adults; reassess based on symptoms, ongoing bleeding, and ischemic heart disease risk. \n- **Guideline Must Know:** Timing of endoscopy: after initial resuscitation, aim for upper endoscopy **within 24 hours** for admitted/observed UGIB; “crash to scope” is not automatically beneficial unless there is uncontrolled bleeding/instability requiring escalation. \n- **Guideline Must Know:** Pre-endoscopy prokinetic can improve visualization when significant blood/clot suspected; **erythromycin 250 mg IV 20–90 min pre-endoscopy** is suggested in selected patients. \n- **Guideline Must Know:** Post-endoscopic ulcer hemostasis requires high-dose acid suppression: **high-dose PPI for 72 hours** (continuous infusion or intermittent high-dose IV) followed by **twice-daily oral PPI for 2 weeks** to reduce rebleeding risk. \n- **Guideline Must Know:** Endoscopic therapy is indicated for high-risk stigmata (active spurting/oozing, nonbleeding visible vessel); epinephrine injection alone is inadequate—use combination or definitive thermal/mechanical therapy; recurrent bleeding warrants repeat endoscopy and consider transcatheter embolization if endoscopy fails. \n- **Guideline Must Know:** In confirmed H. pylori infection, treat and always confirm cure; when susceptibility is unknown, preferred first-line is **optimized bismuth quadruple therapy for 14 days** and avoid clarithromycin-based regimens unless susceptibility is documented; plan test-of-cure **≥4 weeks after therapy** and after PPI washout per local practice. \n- Night pitfalls: a “normal” initial hemoglobin can mask acute blood loss; trend vitals/mental status, check orthostatics if safe, and watch for rising BUN/creatinine ratio as a supportive clue; persistent tachycardia or narrow pulse pressure is a red flag even before labs drift. \n- Medication pitfalls: stop NSAIDs immediately; assess aspirin indication—secondary prevention often needs early restart after hemostasis; coordinate DOAC/warfarin management with GI/ICU and avoid blanket reversal unless bleeding is life-threatening or intervention is imminent. \n- Perforation presentation: sudden severe epigastric pain, rigid abdomen, shoulder pain, sepsis physiology, or free air; overnight priorities are **NPO**, broad-spectrum antibiotics, urgent CT/abd series, and immediate surgery consult—do not delay for “trial of PPI.” \n- Gastric outlet obstruction (from chronic ulcer/scarring): persistent nonbilious vomiting, early satiety, hypochloremic metabolic alkalosis; stabilize with IV fluids, electrolyte repletion, NG decompression if needed, and plan nonemergent endoscopic evaluation unless unstable. \n- ICU/consult framing: call GI urgently for ongoing hematemesis/melena with instability or high transfusion needs; call surgery for peritonitis/perforation; involve cardiology when balancing antithrombotics in high-risk coronary disease. \n- Confirm Before Proceed: irreversible actions include massive transfusion activation, anticoagulation reversal, and emergent intubation for endoscopy—document objective triggers (hemodynamics, lactate, airway risk) and coordinate multidisciplinary plan before pulling the lever. \n- What can wait until daylight once stable: definitive NSAID risk mitigation (COX-2 vs avoidance), long-term PPI taper plan after ulcer healing, and outpatient malignancy evaluation for gastric ulcers (biopsy strategy per GI). \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Hemodynamic instability despite resuscitation: **MAP <65 mmHg**, syncope, rising lactate, or need for vasopressors. \n- Ongoing overt bleeding (hematemesis/hematochezia/melena) with escalating support: **≥2 units RBC within 6 hours** or continued drop in hemoglobin with symptoms. \n- Respiratory/airway risk: active hematemesis, encephalopathy, or inability to protect airway requiring intubation prior to endoscopy. \n- Suspected perforation/peritonitis: rigid abdomen, free air, severe sepsis physiology, or worsening abdominal exam. \n\n## Orders to Place Now (3–6 bullets)\n- Order: CBC with differential q6h — {duration_hours=24, notify_if_hgb_drop_g_dl=2}\n- Order: CMP, magnesium, phosphate, PT/INR, aPTT — {now=true, repeat_in_hours=6_if_unstable}\n- Order: Type and screen; prepare RBC crossmatch — {units=2, indication=suspected-ugib}\n- Order: Pantoprazole IV high-dose — {bolus_mg=80, infusion_mg_per_hr=8, alternative=intermittent-high-dose-per-protocol}\n- Order: NPO status and aspiration precautions — {start_now=true, allow_meds_sips=yes_or_no}\n- Order: GI consult urgent for suspected nonvariceal UGIB — {hemodynamics=stable_or_unstable, last_antithrombotic_time={time}}\n\n## ABIM Style Question 1\n### Stem\nA 67-year-old man with osteoarthritis takes naproxen daily and presents with melena and lightheadedness. BP is 108/62 mmHg, HR 112/min. He is alert and has no abdominal tenderness. Hemoglobin is 7.2 g/dL, INR 1.0. Two large-bore IVs are placed and he receives 1 L of isotonic crystalloid with improved dizziness. What is the best next step in management overnight?\n### Options\nA. Transfuse 2 units packed RBCs immediately to target hemoglobin ≥10 g/dL\nB. Arrange upper endoscopy within the next 24 hours after continued resuscitation and initiate high-dose IV PPI therapy\nC. Start octreotide infusion and ceftriaxone for presumed variceal bleeding\nD. Begin empiric H. pylori eradication therapy immediately without testing\nE. Defer endoscopy until hemoglobin is ≥9 g/dL to reduce procedure risk\n### Correct answer\nB\n### Rationale (2–4 sentences)\nGuidelines recommend resuscitation followed by upper endoscopy **within 24 hours** for hospitalized UGIB and high-dose PPI therapy around endoscopic management of ulcer bleeding. A restrictive transfusion strategy is favored in stable adults (often transfuse at **Hgb <7 g/dL**, individualized), so routine transfusion to ≥10 g/dL is not indicated here. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 74-year-old woman with prior myocardial infarction takes aspirin 81 mg daily for secondary prevention. She develops hematemesis and melena. After IV fluids, BP is 118/70 mmHg and HR is 96/min. Hemoglobin is 7.6 g/dL. Endoscopy shows a bleeding duodenal ulcer that is successfully treated with endoscopic hemostasis. Which antiplatelet plan is most appropriate?\n### Options\nA. Stop aspirin indefinitely because it caused the bleeding ulcer\nB. Hold aspirin for at least 30 days to prevent rebleeding\nC. Resume aspirin as soon as possible after hemostasis because it is for secondary cardiovascular prevention\nD. Switch aspirin to clopidogrel immediately and avoid PPI co-therapy\nE. Start therapeutic heparin bridging while aspirin is held\n### Correct answer\nC\n### Rationale (2–4 sentences)\nA key pitfall is over-holding antiplatelet therapy in secondary prevention; guideline recommendations support continuing or early resumption of low-dose aspirin after hemostasis because cardiovascular risk is high and interruption should be minimized. Co-therapy with acid suppression is commonly used after ulcer bleeding, and bridging anticoagulation is not indicated for aspirin interruption. \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: In a hemodynamically stable adult with UGIB, at what hemoglobin threshold is RBC transfusion generally considered?\n A: Consider transfusion at **Hgb <7 g/dL** using a restrictive strategy, individualized for symptoms and cardiovascular disease. \n- Q: What is the recommended timing target for inpatient endoscopy after presentation with UGIB?\n A: Perform endoscopy **within 24 hours** after initial resuscitation for patients admitted or observed for UGIB. \n- Q: After endoscopic hemostasis of a high-risk bleeding ulcer, how long should high-dose PPI therapy be continued?\n A: Continue high-dose PPI for **72 hours**, then transition to **twice-daily oral PPI for 2 weeks**. \n- Q: For empiric first-line H. pylori treatment when susceptibility is unknown, what regimen duration is preferred?\n A: **Optimized bismuth quadruple therapy for 14 days** is recommended as a preferred empiric first-line option. \n\n## Guidelines & Key References (3–5 bullets)\n- ACG Clinical Guideline: Upper Gastrointestinal and Ulcer Bleeding (2021) — \n- ESGE Guideline Update: Nonvariceal Upper GI Hemorrhage (2021) — \n- ACG Clinical Guideline: Treatment of Helicobacter pylori Infection (2024) — \n- AABB International Guidelines: Red Blood Cell Transfusion (2023) — \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute upper GI bleeding due to suspected peptic ulcer — acuity=acute; evidence={hematemesis/melena, vitals, Hgb trend}; treatment={IV access, fluids, PPI, transfusion plan}; organ dysfunction={shock yes/no, lactate}\n- Acute blood loss anemia — severity={Hgb nadir, symptoms}; cause={GI bleed}; evidence={serial CBC}; treatment={RBC units, iron deferred yes/no}; monitoring={q6h CBC}\n- Hemorrhagic shock if present — type=hemorrhagic; criteria={MAP, HR, lactate, pressor need}; evidence={I/O, mentation}; treatment={fluids, blood products, ICU consult}\n- Medication-associated ulcer risk — agent={NSAID/aspirin/anticoagulant}; last dose={time}; action={held/continued}; rationale={secondary prevention vs bleed severity}; plan={restart timing, GI/cardiology input}\n- Suspected perforated ulcer if present — acuity=acute surgical abdomen; evidence={peritonitis/free air/CT}; organ dysfunction={sepsis markers}; treatment={NPO, antibiotics, surgery consult}\n", "upper-gi-bleeding.md": "---\nfilename: upper-gi-bleeding.md\nid: upper-gi-bleeding\ntitle: upper gi bleeding\nslug: upper-gi-bleeding\ntags: [gastroenterology, upper-gi-bleed, night-float]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-22\nsource: IM_NightFloat_Engine\n---\n\n# upper gi bleeding\n\n## Panic Card (3–6 bullets)\n- Airway first: if ongoing hematemesis, encephalopathy, or inability to protect airway → call ICU/anesthesia; keep suction ready; target **SpO₂ ≥92%** (or **88–92%** if chronic CO₂ retainer).\n- Circulation: 2 large-bore IVs (or rapid infuser/central access), monitor q5–15 min; give balanced crystalloids in small boluses; aim **MAP ≥65 mmHg** and improving mentation/urine output.\n- Blood now: type & screen/cross; transfuse PRBCs to **Hgb ≥7 g/dL** (consider **≥8 g/dL** if active ischemia/major CAD symptoms); activate massive transfusion only for exsanguination. \n- If variceal suspected (cirrhosis, stigmata, large-volume hematemesis): start **octreotide 50 micrograms IV bolus then 50 micrograms/hour infusion** + **ceftriaxone 1 g IV q24h** immediately; don’t wait for endoscopy.\n- NPO, stop anticoagulants/antiplatelets when safe; place on telemetry; page GI early for urgent endoscopy timing; correct life-threatening coagulopathy only when clinically meaningful (ongoing severe bleeding or planned procedure).\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Upper GI bleeding (UGIB) = bleeding proximal to ligament of Treitz; on nights, your job is to stabilize, identify high-risk physiology (shock, ongoing bleeding), and prepare for definitive hemostasis (endoscopy ± IR/TIPS) without over-resuscitating or delaying escalation.\n- Separate “must happen now” vs “can wait”: now = airway protection risk, hemodynamics, blood products, early meds for likely etiologies (ulcer vs variceal), and GI/ICU mobilization; can wait (after stabilization) = full medication reconciliation, long-term ulcer prophylaxis, and H. pylori planning.\n- **Guideline Must Know:** Perform early risk stratification; very-low-risk patients (e.g., **Glasgow-Blatchford 0–1**) may avoid admission, but inpatients/overnight calls usually represent higher-risk physiology—treat unstable patients as high risk until proven otherwise. \n- **Guideline Must Know:** Use a restrictive transfusion strategy in hemodynamically stable UGIB: transfuse when **Hgb <7 g/dL**; a higher threshold (often **~8 g/dL**) may be reasonable with symptomatic coronary disease or ongoing ischemia. \n- Practical resuscitation: avoid “reflex liters” that worsen portal pressures or dilute clotting factors; use small crystalloid boluses while blood is being prepared; trend vitals, mentation, capillary refill, lactate, and urine output; persistent tachycardia/hypotension after initial resuscitation = ongoing bleed until proven otherwise.\n- Labs and monitoring: CBC q4–6h initially (more often if unstable), CMP, INR/aPTT, fibrinogen if massive bleeding, lactate/VBG as needed, type & screen/cross; keep strict I/O; consider arterial line if pressors or rapidly changing status.\n- **Guideline Must Know:** Endoscopy timing for admitted UGIB is generally **within 24 hours** after presentation once resuscitated; do not delay urgent endoscopy for “perfect labs” if the patient is deteriorating. \n- PPI strategy: for suspected nonvariceal/ulcer bleeding, many inpatient pathways start IV PPI while awaiting endoscopy; recognize ACG could not recommend for/against pre-endoscopic PPI for clinical outcomes, so never let PPI timing delay definitive care. \n- **Guideline Must Know:** For improved visualization before endoscopy, consider **erythromycin 250 mg IV** (typically **20–90 minutes** pre-procedure) if active bleeding/clot burden is suspected and no major contraindication (QT risk, interactions). \n- Variceal clues (cirrhosis, ascites, splenomegaly, prior varices): start vasoactive therapy immediately (commonly octreotide infusion) plus antibiotic prophylaxis; these reduce infection and rebleeding risk in variceal hemorrhage care pathways. \n- **Guideline Must Know:** In acute variceal hemorrhage, prioritize early vasoactive agent + antibiotics + urgent endoscopy; escalate early to ICU for shock, encephalopathy, or high oxygen/ventilatory needs, and consider definitive portal decompression options (e.g., TIPS) when bleeding control fails or high-risk features are present. \n- Antithrombotics: hold anticoagulants and consult for reversal only when bleeding is life-threatening or procedures are imminent; avoid “routine correction” of mildly abnormal INR in cirrhosis—focus on hemodynamics and source control; coordinate restart plan after hemostasis with GI/cardiology as indicated.\n- **Confirm Before Proceed:** emergent reversal (e.g., PCC, idarucizumab, andexanet) and massive transfusion carry thrombotic/volume risks; confirm indication (active severe bleeding, hemodynamic compromise, or urgent endoscopy with uncontrolled bleeding) and document rationale.\n- Platelets/coagulation: consider platelet transfusion if severe thrombocytopenia with active bleeding or planned intervention; check fibrinogen during massive hemorrhage and replace if low per institutional thresholds; avoid overcorrection that delays endoscopy.\n- Rebleeding and failure: recurrent hematemesis, rising BUN/creatinine with melena, falling hemoglobin despite transfusion, or persistent shock after initial measures should trigger immediate GI re-contact; if endoscopic therapy fails, IR embolization or surgery is next-line for nonvariceal sources; for variceal sources, temporizing balloon tamponade may be a bridge to TIPS in expert hands (ICU-level). \n- Night-float pitfalls: underestimating airway risk (aspiration), anchoring on “normal” initial hemoglobin (can lag), delaying antibiotics/vasoactive therapy in suspected varices, over-resuscitating with crystalloids, and failing to communicate clear transfusion targets and escalation thresholds to nursing/ICU.\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Hemodynamic instability despite initial resuscitation: **SBP <90 mmHg** or **MAP <65 mmHg**, need for vasopressors, lactate rising, or altered mental status attributable to shock.\n- Ongoing/major hemorrhage: recurrent hematemesis, brisk melena with syncope, or **Hgb drop ≥2 g/dL within 6 hours** (or any rapid fall with symptoms) despite transfusion.\n- Airway/respiratory risk: active hematemesis, inability to protect airway, need for **≥6 L/min O₂**, NRB/HFNC, or any ventilatory support.\n- Suspected variceal bleed with decompensated cirrhosis: encephalopathy, tense ascites, jaundice, or renal dysfunction (high-risk course; needs ICU/GI early).\n- Post-endoscopy deterioration or rebleed: recurrent bleeding, hypotension, or need for repeat endoscopic therapy/IR embolization/TIPS coordination.\n\n## Orders to Place Now (3–6 bullets)\n- Order: NPO — {start now; aspiration precautions}\n- Order: CBC with differential q{4}h x{3}, CMP, INR/aPTT, lactate — {frequency; add fibrinogen if massive bleed suspected}\n- Order: Type and screen and crossmatch PRBCs — {units now = 2; additional units PRN; transfuse to target Hgb}\n- Order: Pantoprazole IV — {80 mg IV bolus then 8 mg/hour infusion OR 40 mg IV q12h pending endoscopy}\n- Order: Octreotide infusion (if variceal suspected) — {50 micrograms IV bolus then 50 micrograms/hour continuous infusion}\n- Order: Ceftriaxone (if variceal suspected/cirrhosis) — {1 g IV q24h; duration per GI plan}\n\n## ABIM Style Question 1\n### Stem\nA 64-year-old man is admitted with melena and lightheadedness. BP is 96/58 mmHg, HR 112/min. He is alert but pale. Two large-bore IVs are placed and he receives 1 L balanced crystalloid with improvement to MAP 68 mmHg. Hemoglobin is 6.8 g/dL, INR 1.1, platelets 210 ×10⁹/L. He has no history of cirrhosis and takes no anticoagulants. What is the most appropriate next step in management tonight?\n\n### Options\nA. Transfuse packed red blood cells to a target hemoglobin of at least 7 g/dL\nB. Give vitamin K 10 mg IV to normalize coagulation before endoscopy\nC. Start prophylactic ceftriaxone because all UGIB patients benefit from antibiotics\nD. Delay endoscopy until hemoglobin is above 10 g/dL\nE. Administer fresh frozen plasma to prevent rebleeding\n\n### Correct answer\nA\n\n### Rationale (2–4 sentences)\nGuidelines support a restrictive transfusion strategy for hospitalized UGIB with transfusion when **Hgb <7 g/dL**, which improves outcomes compared with liberal thresholds in most patients. Vitamin K/FFP are not indicated with a normal INR, and antibiotics are targeted to suspected variceal bleeding rather than routine nonvariceal UGIB.\n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 58-year-old man with known cirrhosis (ascites, prior varices) presents with large-volume hematemesis. BP is 88/52 mmHg, HR 124/min, and he is intermittently confused. Hemoglobin is 7.9 g/dL, INR 1.8, platelets 78 ×10⁹/L. While blood is being prepared, what intervention should be started immediately to reduce complications and improve early control of bleeding?\n\n### Options\nA. Pantoprazole 80 mg IV bolus then continuous infusion\nB. Octreotide infusion plus ceftriaxone\nC. Vitamin K 10 mg IV to correct INR before any other therapy\nD. Desmopressin to improve platelet function\nE. Tranexamic acid infusion for all upper GI bleeds\n\n### Correct answer\nB\n\n### Rationale (2–4 sentences)\nIn suspected acute variceal hemorrhage, start vasoactive therapy plus antibiotic prophylaxis immediately; this is the key early bundle alongside resuscitation and urgent endoscopy. The pitfall is treating this like routine ulcer bleeding and delaying variceal-directed therapy while focusing on INR correction, which does not address portal-pressure–driven hemorrhage.\nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What transfusion threshold is recommended for most hemodynamically stable adults with UGIB?\n A: Consider transfusion when hemoglobin is **<7 g/dL**. \n- Q: Within what time window should admitted UGIB patients generally undergo endoscopy once resuscitated?\n A: Endoscopy is suggested **within 24 hours** of presentation for hospitalized/observed patients. \n- Q: What is the standard erythromycin dose used pre-endoscopy to improve visualization?\n A: **Erythromycin 250 mg IV** given shortly before endoscopy (commonly **20–90 minutes** pre-procedure). \n- Q: In suspected variceal bleeding, what two medication classes should be started immediately?\n A: A vasoactive agent (e.g., octreotide infusion) and an antibiotic (e.g., ceftriaxone). \n\n## Guidelines & Key References (3–5 bullets)\n- American College of Gastroenterology (ACG) Clinical Guideline: Upper Gastrointestinal and Ulcer Bleeding (2021) — https://www.giboardreview.com/wp-content/uploads/2021/05/guidelines-ACG-guidelines-on-UGI-bleeding-2021.pdf \n- European Society of Gastrointestinal Endoscopy (ESGE) Guideline Update: Nonvariceal Upper Gastrointestinal Hemorrhage (2021) — https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf \n- Baveno VII Consensus Workshop: Renewing consensus in portal hypertension (Journal of Hepatology, 2022) — https://www.journal-of-hepatology.eu/article/S0168-8278(21)02299-6/fulltext \n- AABB International Guidelines: Red Blood Cell Transfusion (2023) — https://jamanetwork.com/journals/jama/fullarticle/2810754 \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute upper gastrointestinal hemorrhage — acuity: {acute} — suspected source: {nonvariceal peptic ulcer vs variceal} — evidence: {hematemesis/melena, vitals, Hgb trend, BUN, endoscopy pending} — treatment: {IV access, transfusion, PPI/octreotide, GI consult}\n- Hemorrhagic shock due to GI bleeding (if present) — severity: {MAP/SBP, lactate, mental status} — organ dysfunction: {AKI/altered mentation} — interventions: {pressors, transfusions, ICU level care}\n- Acute blood loss anemia — severity: {lowest Hgb, rate of drop, symptoms} — transfusion given: {units, target threshold} — monitoring: {repeat CBC timing}\n- Coagulopathy context — type: {anticoagulant-associated vs cirrhosis-related vs none} — objective data: {INR/aPTT/platelets} — actions: {held meds, reversal if used with indication}\n- Aspiration risk/airway compromise (if present) — trigger: {active hematemesis/encephalopathy} — intervention: {suction, ICU/anesthesia evaluation, intubation if performed}\n", "lower-gi-bleeding.md": "---\nfilename: lower-gi-bleeding.md\nid: lower-gi-bleeding\ntitle: lower gi bleeding\nslug: lower-gi-bleeding\ntags: [gastroenterology, gi-bleed, night-float]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# lower gi bleeding\n\n## Panic Card (3–6 bullets)\n- Airway/breathing: give O₂ to target **SpO₂ ≥94%** (or **88–92%** if chronic hypercapnia); intubate early if ongoing massive hematochezia with altered mental status/aspiration risk.\n- Circulation: 2 large-bore IVs (or IO), place on monitor, start balanced crystalloids; if shock/ongoing brisk bleed, activate massive hemorrhage pathway and transfuse to maintain **MAP ≥65 mmHg** and improving mentation/urine output.\n- Labs now: CBC, CMP, INR/PTT, fibrinogen, type & screen/crossmatch; repeat Hgb/Hct q4–6 h (or sooner if instability); check lactate if hypotension/tachycardia.\n- Transfuse smart: consider pRBC when **Hgb <7 g/dL** (higher target **≥8 g/dL** if active ischemia/significant CAD symptoms); platelets to **>50 ×10⁹/L** if severe bleed and procedure planned.\n- If unstable or ongoing significant bleeding: prioritize localization with **CT angiography** and call GI + IR early; do not delay for bowel prep if patient cannot tolerate it.\n- Confirm Before Proceed: irreversible/high-risk steps (massive transfusion activation, emergent anticoagulant reversal, transcatheter embolization, emergent surgery) require rapid verification of indication, timing/last dose, and thrombotic risk.\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Define the problem: acute lower GI bleeding typically presents as hematochezia; however, **hematochezia + hemodynamic instability** can be an upper GI source with rapid transit, so keep UGIB on the table while resuscitating (especially if syncope, BUN/Cr disproportionately high, or prior ulcer disease). \n- Triage on night float: separate “Now” vs “Can wait” by physiology—“Now” is stabilization, trend vitals/mental status, and determine if bleeding is ongoing; “Can wait” is definitive inpatient colonoscopy timing if stable and no further bleeding.\n- **Guideline Must Know:** initial evaluation should run in parallel: focused history (anticoagulants/antiplatelets/NSAIDs, prior diverticular bleed, liver disease), exam (perfusion, abdominal, rectal), and labs while starting volume resuscitation; don’t wait for results to treat shock. \n- **Guideline Must Know:** use risk stratification to identify low-risk patients, but in admitted night-float scenarios the practical use is to decide level of care and urgency; the **Oakland score** is commonly referenced for “minor vs major” bleeding frameworks. \n- **Guideline Must Know:** transfuse with a restrictive strategy in most hemodynamically stable adults—consider pRBC when **Hgb <7 g/dL**; consider a higher threshold (often **~8 g/dL**) in those with preexisting cardiovascular disease or active ischemia symptoms. \n- **Guideline Must Know:** for hemodynamically significant ongoing LGIB, **CT angiography (CTA)** is the preferred rapid localization test and can directly guide IR embolization; do not delay CTA for bowel prep when the patient is actively bleeding. \n- **Guideline Must Know:** colonoscopy remains a key diagnostic/therapeutic tool once the patient is stable enough for prep; urgent colonoscopy within **24 h** has not consistently improved major outcomes compared with nonurgent inpatient colonoscopy in stable patients, so prioritize safety and adequate prep. \n- **Guideline Must Know:** if CTA is positive, early coordination with IR for transcatheter therapy is high yield; severe ongoing bleeding plus a localizable arterial source is the sweet spot for embolization rather than repeated destabilizing prep attempts. \n- **Guideline Must Know:** antithrombotic management must balance bleeding vs thrombosis; for patients on **cardiac aspirin for secondary prevention**, avoid holding it when possible, and if it was interrupted, resume promptly once hemostasis is confirmed endoscopically. \n- Medication pitfalls overnight: stop NSAIDs (they increase rebleeding risk in diverticular bleed/angioectasia); avoid empiric octreotide unless you actually suspect variceal/upper source; avoid “routine” antibiotics unless sepsis/colitis/diverticulitis is suspected.\n- Anticoagulants: hold the agent immediately; document last dose and renal function. Confirm Before Proceed: reversal should be reserved for **life-threatening bleeding, ongoing hemodynamic compromise, or urgent intervention**—reversal decisions should be multidisciplinary when feasible because thrombotic risk is real. \n- Reversal nuance (don’t autopilot): routine platelet transfusion for antiplatelet exposure alone is not recommended in non-thrombocytopenic patients; for warfarin-associated bleeding, PCC is favored over FFP when reversal is necessary (less volume), but avoid reflex “vitamin K/FFP for every INR” without a severity-based plan. \n- Source patterns to anticipate: diverticulosis and angioectasias are common; ischemic colitis can present with pain + hematochezia; colorectal cancer/post-polypectomy bleeding are considerations—overnight your job is stability + localization + appropriate consult sequencing.\n- Monitoring: strict I/Os, serial orthostatics in borderline cases, telemetry if significant anemia/ischemia risk; repeat CBC/INR/fibrinogen based on trajectory (more frequently with ongoing bleed or after transfusion).\n- When to call GI now: any ongoing hematochezia with instability, significant ongoing transfusion needs, suspected post-procedure bleeding, or need for urgent endoscopic hemostasis; when to call IR now: positive CTA, brisk ongoing bleeding, or inability to tolerate prep with continued hemodynamic compromise. \n- Disposition framing: stable with no further bleeding can often go to stepdown/ward with planned nonurgent colonoscopy; persistent tachycardia/hypotension, rising lactate, recurrent large-volume hematochezia, or escalating transfusion needs should trigger ICU-level care and simultaneous GI/IR planning.\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Persistent instability despite resuscitation: **MAP <65 mmHg**, shock index **>1**, rising lactate, or need for vasopressors.\n- Ongoing bleeding requiring rapid blood: **≥4 units pRBC in 6 h** or **≥10 units in 24 h**, or recurrent large-volume hematochezia with syncope.\n- Respiratory/airway risk: aspiration/encephalopathy, need for high-flow O₂ or intubation to safely proceed with imaging/procedures.\n- Positive CTA with active extravasation or suspected arterial source requiring urgent IR, or failure of endoscopic therapy with ongoing hemorrhage.\n- Major comorbidity decompensation: chest pain/ischemia, new arrhythmia, or acute kidney injury in the setting of shock/contrast needs.\n\n## Orders to Place Now (3–6 bullets)\n- Order: CBC with differential — {now; repeat q4–6h or sooner if unstable}\n- Order: CMP + magnesium + phosphorus — {now; repeat in 6–12h if ongoing bleed/transfusion}\n- Order: PT/INR, aPTT, fibrinogen — {now; repeat after major transfusion or if anticoagulated}\n- Order: Type and screen / type and crossmatch — {units anticipated; antibody history}\n- Order: Transfusion protocol: pRBC — {trigger Hgb <7 g/dL; consider <8 g/dL if CAD/ischemia; 1 unit then reassess}\n- Order: CT angiography abdomen/pelvis (GI bleed protocol) — {indication: ongoing significant hematochezia/hemodynamic compromise; contrast allergy/Cr baseline}\n\n## ABIM Style Question 1\n### Stem\nA 72-year-old man is admitted overnight for sudden large-volume hematochezia. He is tachycardic (HR 122/min) and hypotensive (BP 86/52 mmHg) despite 2 liters of IV crystalloid. Hemoglobin is 8.1 g/dL (baseline 12 g/dL). He continues to pass bright red blood with clots. What is the most appropriate next diagnostic step to localize the bleeding source?\n### Options\nA. Urgent colonoscopy within 6 hours after rapid bowel preparation \nB. Tagged red blood cell scintigraphy \nC. CT angiography of the abdomen and pelvis \nD. Start intravenous proton pump inhibitor infusion and observe \nE. Flexible sigmoidoscopy without bowel preparation\n### Correct answer\nC\n### Rationale (2–4 sentences)\nIn hemodynamically significant, ongoing lower GI bleeding, CT angiography rapidly localizes active bleeding and can directly guide transcatheter embolization without delaying care for bowel preparation. Urgent colonoscopy may be limited by inadequate prep and has not reliably improved key outcomes compared with nonurgent colonoscopy in stable patients. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 64-year-old woman presents with hematochezia and lightheadedness. She is diaphoretic with HR 128/min and BP 82/48 mmHg. She reports a history of peptic ulcer disease and took ibuprofen daily for back pain. She has not had abdominal pain. After initiating transfusion and resuscitation, what is the next best procedure to perform?\n### Options\nA. Colonoscopy as soon as bowel preparation is complete \nB. Esophagogastroduodenoscopy (upper endoscopy) \nC. Capsule endoscopy \nD. CT colonography \nE. No endoscopy; treat with IV fluids only\n### Correct answer\nB\n### Rationale (2–4 sentences)\nHematochezia with **hemodynamic instability** can represent a brisk upper GI bleed with rapid transit; in this pitfall scenario, prioritizing upper endoscopy prevents missing a treatable upper source. The confounder is shock-level physiology, which changes the algorithm away from assuming a colonic source first.\nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: In a hemodynamically stable adult with acute LGIB, at what hemoglobin should you generally consider transfusion using a restrictive strategy? \n A: Consider transfusion when **Hgb <7 g/dL** in most hemodynamically stable hospitalized adults. \n- Q: What imaging test is preferred to rapidly localize ongoing, hemodynamically significant LGIB when bowel prep is not feasible? \n A: **CT angiography** of the abdomen/pelvis using a GI bleed protocol. \n- Q: If a patient with hematochezia is hypotensive and tachycardic, what alternate source must be evaluated urgently? \n A: A brisk **upper GI bleeding** source should be considered, often prompting upper endoscopy. \n- Q: For patients on aspirin for secondary cardiovascular prevention who had it held during GI bleeding, when should it generally be resumed once hemostasis is confirmed? \n A: Resume on the day endoscopic hemostasis is confirmed. \n\n## Guidelines & Key References (3–5 bullets)\n- American College of Gastroenterology (ACG) Clinical Guideline: Management of Patients With Acute Lower Gastrointestinal Bleeding (2016) — https://acgcdn.gi.org/wp-content/uploads/2016/03/ACGGuideline-Acute-Lower-GI-Bleeding-03012016.pdf \n- ACG Guideline: Management of Patients With Acute Lower Gastrointestinal Bleeding (2023 update PDF) — https://www.giboardreview.com/wp-content/uploads/2023/02/ACG-Guidelines-acute-lower-gi-bleeding-Feb-2023.pdf \n- British Society of Gastroenterology: Diagnosis and management of acute lower gastrointestinal bleeding (2019) — https://gut.bmj.com/content/gutjnl/68/5/776.full.pdf \n- European Society of Gastrointestinal Endoscopy (ESGE) Guideline: Acute lower gastrointestinal bleeding (2021) — https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1496_8969.pdf \n- AABB International Guidelines: Red Blood Cell Transfusion (2023) — https://jamanetwork.com/journals/jama/fullarticle/2810754 \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute lower gastrointestinal hemorrhage — acuity: {acute} — suspected etiology: {diverticular/angioectasia/ischemic colitis/other} — severity: {hemodynamic instability/shock index >1/transfusion need} — evidence: {vitals, Hgb trend, lactate, CTA findings} — treatment: {IV fluids, pRBC units, pressors, GI/IR consult}\n- Acute blood loss anemia — acuity: {acute} — cause: {active LGIB} — severity: {Hgb nadir, symptomatic anemia, ischemia} — evidence: {baseline vs current Hgb, tachycardia/hypotension} — treatment: {transfusion strategy, monitoring frequency}\n- Hypovolemic shock due to hemorrhage — criteria: {MAP <65, lactate, altered mentation, oliguria} — evidence: {BP/HR, lactate, urine output} — treatment: {resuscitation volume, pRBC/MT protocol, vasopressors if used}\n- Anticoagulant/antiplatelet-associated bleeding — agent: {warfarin/apixaban/rivaroxaban/dabigatran/aspirin/P2Y12} — last dose: {time} — coag status: {INR/renal function} — actions: {held/reversal considered} — evidence of severity: {ongoing bleeding, transfusions, instability}\n", "acute-pancreatitis.md": "---\nfilename: Acute pancreatitis.md\nid: acute-pancreatitis\ntitle: Acute pancreatitis\nslug: acute-pancreatitis\ntags: [gastroenterology, pancreatitis, inpatient]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# Acute pancreatitis\n\n## Panic Card (3–6 bullets)\n- Airway/breathing: give O₂ to target **SpO₂ ≥92%** (or **88–92%** if chronic hypercapnia); start continuous pulse ox; consider ABG/VBG if increasing work of breathing or hypercapnia concern.\n- Circulation: 2 large-bore IVs; start lactated Ringer’s with goal-directed resuscitation; if hypotensive or lactate elevated, give **10–20 mL/kg bolus** then reassess every **15–30 min** (lungs, MAP, UOP, mental status). \n- Labs now: CBC, CMP, Mg/Phos, Ca, lipase, triglycerides, lactate, INR; type & screen if GI bleed concern; blood cultures only if sepsis/infection suspected (not routine). \n- Pain/nausea control: IV opioid + antiemetic; avoid “NPO by default” if mild and improving—feed early as tolerated within **24 h**. \n- Confirm Before Proceed: urgent ERCP only if acute biliary pancreatitis with **cholangitis** or persistent biliary obstruction—do not reflexively page GI for “urgent ERCP” without objective evidence. \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Diagnose acute pancreatitis with **2 of 3**: typical epigastric pain (often radiates to back), **lipase or amylase ≥3× ULN**, or characteristic imaging; do not delay supportive care waiting for imaging if criteria met. \n- **Guideline Must Know:** Initial management is supportive: early, goal-directed isotonic crystalloid; avoid both under-resuscitation (worsens necrosis) and over-resuscitation (pulmonary edema/ARDS), especially in CHF/CKD—reassess frequently (exam, oxygen needs, BUN/Cr, hematocrit, UOP). \n- **Guideline Must Know:** Prefer **lactated Ringer’s** over normal saline for resuscitation in most patients; prioritize the first **24 h** when fluid is most impactful; give additional boluses only if hypovolemia persists. \n- **Guideline Must Know:** Early risk stratification matters more than a single score: watch the first **48 h** for evolving organ failure/SIRS; higher risk with rising **BUN**, elevated hematocrit, obesity/comorbidity, persistent SIRS. \n- **Guideline Must Know:** Imaging pitfalls: avoid routine early CT “to grade severity” at admission; reserve contrast CT/MRI if diagnosis unclear or if the patient fails to improve clinically within **48–72 h** (or deteriorates). \n- Etiology on night float: gallstones/alcohol are most common; send triglycerides (consider causal if **>1000 mg/dL**), calcium, medication review; RUQ ultrasound early to evaluate biliary pancreatitis; repeat US if initial inconclusive. \n- **Guideline Must Know:** ERCP timing: in acute biliary pancreatitis **with cholangitis**, ERCP should be performed urgently (generally within **24 h**); without cholangitis, routine urgent ERCP is not recommended—manage medically and consult GI if persistent obstruction suspected. \n- **Guideline Must Know:** Nutrition: in mild pancreatitis, start **early oral feeding as tolerated within 24 h**; if unable to eat, use **enteral** (NG or NJ) rather than parenteral nutrition. \n- Pain control: IV opioids are appropriate; pair with bowel regimen and antiemetic; avoid excessive sedation masking mental status changes; consider multimodal adjuncts (acetaminophen if hepatic function allows).\n- Antibiotics: SIRS from pancreatitis can mimic sepsis; do not give prophylactic antibiotics for sterile necrosis; give antibiotics only when infection is suspected/confirmed (e.g., cholangitis, pneumonia, UTI, line infection, infected necrosis). \n- Complications to anticipate at night: hypoxemia/ARDS, AKI, hypotension/shock, ileus, hypocalcemia, hyperglycemia; check and replete electrolytes (Mg/Phos/Ca) and monitor glucose with insulin as needed.\n- Local complications: necrosis, pseudocyst, walled-off necrosis; intervention is rarely emergent unless infected/unstable—timing often delayed to allow encapsulation; call GI/surgery/IR early if suspected infected necrosis or clinical decompensation.\n- **Guideline Must Know:** Gallstone pancreatitis disposition: if mild and improving, plan **cholecystectomy during the index admission** to prevent recurrence; if not surgical candidate, document plan for definitive biliary management. \n- What must happen now (night priorities): stabilize ABCs, goal-directed fluids, pain/antiemetics, evaluate biliary obstruction/cholangitis, early feeding plan, monitoring for organ failure; what can wait: advanced etiologic workup for idiopathic cases (MRCP/EUS) once stable. \n- When to call ICU: any evolving organ failure (respiratory, renal, circulatory), rising oxygen/ventilatory needs, persistent hypotension despite fluids, or worsening mental status; do not anchor on “lipase trend” (it does not track severity).\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Respiratory failure: need for **≥6 L/min** nasal cannula, **HFNC**, **NIV**, or intubation; rapidly increasing work of breathing or **PaO₂/FiO₂** concern.\n- Shock/poor perfusion: **MAP <65 mmHg** after adequate fluid challenge or rising lactate; need for vasopressors.\n- Renal/volume issues: oliguria **<0.5 mL/kg/h** despite resuscitation, rapidly rising creatinine/BUN, or pulmonary edema during fluids (requires ICU-level titration).\n- Suspected cholangitis or persistent biliary obstruction: fever, jaundice, RUQ pain, rising bilirubin/alk phos, ductal dilation—urgent GI consult for ERCP pathway. \n- Suspected infected necrosis: new/worsening sepsis physiology after day 5–10, gas in collection on imaging, or persistent organ failure—GI/surgery/IR + ICU.\n\n## Orders to Place Now (3–6 bullets)\n- Order: Lactated Ringer’s IV infusion — {initial_rate_mL_per_h} with {bolus_mL_or_mL_per_kg_if_hypovolemic} and {reassessment_interval_min}\n- Order: NPO except medications, then advance diet as tolerated — {start_clear_or_low_fat_diet_within_24h_if_tolerating} and {antiemetic_prn}\n- Order: Pain control regimen — {opioid_choice_dose_qXh_prn} + {acetaminophen_if_ok} + {bowel_regimen}\n- Order: Labs now and qAM — {CBC} {CMP} {Mg} {Phos} {ionized_or_total_Ca} {triglycerides} {lactate_if_unstable} {glucose_monitoring_frequency}\n- Order: RUQ ultrasound — {indication_biliary_pancreatitis_rule_out_gallstones_duct_dilation}\n\n## ABIM Style Question 1\n### Stem\nA 52-year-old man presents with severe epigastric pain radiating to the back and vomiting. Lipase is 9× the upper limit of normal. He is afebrile, BP 118/74 mmHg, HR 102/min, SpO₂ 96% on room air. Creatinine is normal. He received 1 L of lactated Ringer’s and his pain is improving. What is the best next step in management tonight?\n### Options\nA. Keep the patient strictly NPO for 72 hours to rest the pancreas \nB. Start early oral feeding as tolerated within the next 24 hours \nC. Obtain contrast-enhanced CT abdomen immediately to assess severity \nD. Start prophylactic broad-spectrum antibiotics to prevent infected necrosis \nE. Arrange urgent ERCP within 24 hours for all suspected biliary pancreatitis \n### Correct answer\nB\n### Rationale (2–4 sentences)\nEarly oral feeding as tolerated within **24 hours** is recommended in acute pancreatitis and is associated with improved outcomes compared with prolonged NPO. Routine early CT for severity is not recommended unless diagnosis is unclear or the patient fails to improve within **48–72 hours**, and prophylactic antibiotics are not recommended. Urgent ERCP is reserved for biliary pancreatitis complicated by cholangitis or persistent obstruction, not universally. \n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 68-year-old woman with known HFrEF (EF 25%) is admitted with acute pancreatitis (epigastric pain, lipase 6× ULN). BP is 92/58 mmHg, HR 118/min, SpO₂ 90% on 4 L/min nasal cannula with bibasilar crackles. BUN is rising and urine output is low. She received 2 L of lactated Ringer’s in the ED. What is the best next step tonight?\n### Options\nA. Continue aggressive fluid boluses until urine output normalizes \nB. Start prophylactic antibiotics because severe pancreatitis is suspected \nC. Initiate ICU-level, goal-directed resuscitation with careful titration and early vasopressors if MAP remains <65 mmHg \nD. Order immediate contrast CT to determine the extent of necrosis \nE. Start parenteral nutrition immediately to prevent catabolism \n### Correct answer\nC\n### Rationale (2–4 sentences)\nThe pitfall is over-resuscitation in a patient with limited cardiac reserve: guidelines support goal-directed fluids with frequent reassessment and caution in cardiovascular comorbidity, escalating to monitored/ICU care when shock or organ failure evolves. Persistent **MAP <65 mmHg** after an appropriate fluid trial warrants ICU management and vasopressors rather than continued large boluses that worsen pulmonary edema. Routine early CT and prophylactic antibiotics are not recommended in the absence of specific indications. \nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: What 3 features define the diagnosis of acute pancreatitis (need 2 of 3)? \n A: Typical abdominal pain, **lipase or amylase ≥3× ULN**, and characteristic imaging findings; any **2** establish the diagnosis. \n- Q: When should contrast CT be obtained to assess pancreatitis complications/severity? \n A: If diagnosis is unclear or if the patient fails to improve or worsens within **48–72 hours** after admission/initial treatment. \n- Q: In acute biliary pancreatitis, when is urgent ERCP indicated? \n A: When there is **cholangitis** (and often when there is strong evidence of persistent biliary obstruction), not routinely for all biliary pancreatitis. \n- Q: What is the recommended nutrition strategy for most mild cases? \n A: Start **early oral feeding as tolerated within 24 hours**; if unable to eat, use enteral rather than parenteral nutrition. \n\n## Guidelines & Key References (3–5 bullets)\n- American College of Gastroenterology (ACG) Guideline: Management of Acute Pancreatitis (2024) — https://doi.org/10.14309/ajg.0000000000002645 \n- American Gastroenterological Association (AGA) Clinical Guidance: Initial management of acute pancreatitis (2018) — https://gastro.org/clinical-guidance/initial-management-of-acute-pancreatitis-ap/ \n- IAP/APA evidence-based guidelines for the management of acute pancreatitis (2013) — https://www.american-pancreatic-association.org/storage/app/public/stories/IAP-APA_Evidence-based_Guidelines_Management_Acute_Pancreatitis_-_Pancreatology_2013.pdf \n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute pancreatitis, {mild|moderately-severe|severe} by {Revised_Atlanta_criteria_if_applicable}; evidence: {pain} {lipase_value_and_ULN} {imaging_if_done}\n- Organ dysfunction due to pancreatitis: {AKI_stage_or_creatinine_trend} {respiratory_failure_O2_device_flow} {shock_MAP_lactate_pressors} with objective data {vitals} {labs} {UOP}\n- Suspected etiology: {gallstone|alcohol|hypertriglyceridemia|drug|idiopathic} with evidence {RUQ_US_findings} {TG_value} {history} {med_list}\n- Volume status and resuscitation response: {hypovolemia_signs} {fluids_type_total_mL} {UOP_trend} {BUN/Cr_trend} {signs_of_overload}\n- If biliary obstruction/cholangitis suspected: diagnosis {acute_cholangitis_yes/no} with evidence {fever} {WBC} {bilirubin} {ALP} {duct_dilation} and action {GI_consult_ERCP_plan} \n", "biliary-disease.md": "---\nfilename: biliary-disease.md\nid: biliary-disease\ntitle: Biliary Disease\nslug: biliary-disease\ntags: [gastroenterology, hepatobiliary, night-float]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-23\nsource: IM_NightFloat_Engine\n---\n# Biliary Disease\n\n## Panic Card (3–6 bullets)\n- If toxic/altered or hypotensive: treat as biliary sepsis now—IV access, **blood cultures x2**, lactate, start **30 mL/kg isotonic crystalloid** if hypoperfused, target **MAP ≥65 mmHg**, early vasopressor if fluid-refractory.\n- Start broad-spectrum antibiotics within **1 hour** if septic or high suspicion cholangitis; cover enteric gram-negatives + anaerobes (add enterococcal coverage if healthcare-associated/high risk).\n- Suspected ascending cholangitis: call GI urgently for biliary decompression; aim **ERCP as soon as feasible** (do not “wait for MRCP” if unstable).\n- NPO, antiemetic, analgesia; avoid hypotension from oversedation; correct hypoglycemia and severe electrolyte derangements.\n- Get RUQ ultrasound first-line; if equivocal and high concern for complications/alternative diagnosis, CT abdomen/pelvis with IV contrast if renal function permits.\n- Confirm Before Proceed: anticoagulation reversal, emergent ERCP, or surgery—verify INR/platelets, hemodynamic stability, and consult plan before irreversible steps.\n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Think in syndromes on nights: (1) acute cholangitis (infection + obstruction), (2) acute cholecystitis (inflamed gallbladder), (3) choledocholithiasis/obstructive jaundice without infection, (4) biliary pancreatitis; the first two can decompensate fast and require early source control.\n- **Guideline Must Know:** Acute cholangitis is diagnosed by systemic inflammation + cholestasis + imaging evidence of biliary obstruction/etiology; don’t require Charcot triad—absence of fever/jaundice does not exclude it, especially in elderly, immunosuppressed, or already-antipyretic patients.\n- **Guideline Must Know:** For suspected cholangitis, start antibiotics and resuscitation immediately, then prioritize biliary drainage; if moderate–severe disease or not improving rapidly, pursue urgent decompression rather than serial labs and “watchful waiting.”\n- **Guideline Must Know:** Severity matters: cholangitis with organ dysfunction (hypotension needing vasopressors, altered mental status, hypoxemia, AKI/oliguria, coagulopathy, thrombocytopenia) is severe—treat as sepsis with immediate escalation and plan for urgent drainage.\n- **Guideline Must Know:** Acute cholecystitis: RUQ ultrasound is first test; start antibiotics if systemic signs, suspected gangrene/perforation/emphysematous disease, or significant comorbidity; early surgical evaluation is appropriate even if pain improves transiently.\n- **Guideline Must Know:** If unstable or high operative risk with acute cholecystitis, gallbladder drainage (percutaneous cholecystostomy) can be a bridge; continue antibiotics and reassess for definitive cholecystectomy once stabilized.\n- **Guideline Must Know:** Suspected choledocholithiasis should be risk-stratified to avoid unnecessary ERCP; high-risk features (e.g., stone seen on imaging, ascending cholangitis, or **total bilirubin >4 mg/dL** plus dilated CBD) generally warrant therapeutic ERCP rather than additional tests.\n- **Guideline Must Know:** In intermediate-risk choledocholithiasis (abnormal LFTs, age >55, or CBD dilation without high-risk criteria), use EUS or MRCP for confirmation; avoid diagnostic ERCP due to procedure risk.\n- **Guideline Must Know:** Biliary pancreatitis: urgent ERCP is indicated when complicated by cholangitis; otherwise avoid routine urgent ERCP in the first 48 hours unless there is persistent biliary obstruction/choledocholithiasis with worsening cholestasis or clinical deterioration.\n- What must happen now (night shift): (1) determine instability (hypotension, AMS, lactate, escalating oxygen), (2) obtain RUQ ultrasound and key labs (CBC, CMP, bilirubin fractionation, INR, lipase, lactate), (3) start antibiotics when cholangitis/cholecystitis with systemic illness is suspected, (4) involve GI/surgery early for source control.\n- What can wait (if stable): repeat imaging (MRCP/EUS), outpatient etiologic workup for mild, resolved biliary colic, and definitive elective cholecystectomy planning after an uncomplicated stone event; document contingency triggers and reassessment timing.\n- Antibiotic approach (adult inpatient): tailor to severity and acquisition; examples include piperacillin-tazobactam or ceftriaxone plus metronidazole for community-acquired disease; add broader coverage (e.g., cefepime plus metronidazole, or carbapenem) if severe sepsis, prior resistant organisms, or healthcare-associated infection; de-escalate to cultures and clinical response.\n- Fluids/pressors: treat hypoperfusion like any sepsis—balanced crystalloid, reassess after each bolus (lung exam, urine output, lactate), and use norepinephrine first-line for persistent hypotension; avoid fluid overload in cirrhosis/CHF/ESRD—use smaller boluses and earlier vasopressors with monitoring.\n- Pitfalls: anchoring on “normal” LFTs early (can lag), missing cholangitis in afebrile/immunosuppressed patients, delaying GI consult until daylight despite rising lactate or confusion, and giving NSAIDs/opioids without monitoring in older adults with borderline respiratory status.\n- When to call specialists: GI urgently for cholangitis with obstruction or high-risk choledocholithiasis; surgery for acute cholecystitis, gallbladder perforation/gangrene/emphysematous concern, or biliary pancreatitis needing same-admission cholecystectomy after stabilization; ICU for organ dysfunction or escalating support needs.\n\n## Top ICU/Consult Triggers (3–5 bullets)\n- **MAP <65 mmHg** after fluids or need for vasopressors, **lactate ≥2 mmol/L** with clinical hypoperfusion, or new/worsening altered mental status.\n- Rising oxygen/ventilatory support (new **SpO₂ <90%** on ≥6 L/min nasal cannula, need for HFNC/NIV, or impending intubation).\n- Evidence of severe cholangitis/organ dysfunction: oliguria **<0.5 mL/kg/h**, creatinine rapidly rising, **INR ≥1.5** not explained, platelets **<100 ×10⁹/L**, or bilirubin rapidly climbing with systemic illness.\n- Imaging/clinical complications: emphysematous cholecystitis, gallbladder perforation, peritonitis, hepatic abscess, or persistent obstruction with sepsis despite antibiotics.\n- Concern for biliary pancreatitis with severe physiology (SIRS with rising BUN/hematocrit, persistent organ failure) or unclear diagnosis requiring higher-level monitoring.\n\n## Orders to Place Now (3–6 bullets)\n- Order: NPO — {indication: suspected cholangitis/cholecystitis/obstructing stone; exceptions: stable biliary colic}\n- Order: Lactated Ringer bolus — {dose_mL_per_kg: 10–30; reassess_after_each_bolus: yes; MAP_goal: 65}\n- Order: Blood cultures — {sets: 2; timing: prior_to_antibiotics_if_possible}\n- Order: Broad-spectrum IV antibiotics — {regimen: piperacillin-tazobactam OR ceftriaxone+metronidazole; adjust_for_allergy_and_renal_function: yes}\n- Order: RUQ ultrasound — {urgency: STAT; question: cholelithiasis, CBD_dilation, cholecystitis_features}\n- Order: Labs now — {CBC, CMP, direct_bilirubin, INR, lipase, lactate, UA_if_sepsis_source_unclear}\n\n## ABIM Style Question 1\n### Stem\nA 68-year-old man with known gallstones is admitted for abdominal pain and confusion overnight. He is febrile to 39.2°C, BP 86/52 mmHg after 1 L of crystalloid, HR 118/min, and he is jaundiced. Labs show WBC 18 ×10⁹/L, total bilirubin 6.1 mg/dL, alkaline phosphatase 420 U/L, creatinine 2.1 mg/dL (baseline 1.0), and lactate 3.8 mmol/L. RUQ ultrasound shows a dilated common bile duct. He has received broad-spectrum antibiotics.\n### Options\nA. Order MRCP in the morning to confirm choledocholithiasis before any procedure \nB. Administer additional opioids and observe; antibiotics are sufficient overnight \nC. Arrange urgent biliary decompression with ERCP (or percutaneous drainage if ERCP unavailable) \nD. Start corticosteroids for presumed autoimmune cholangitis \nE. Discontinue antibiotics and wait for blood culture results before further steps\n### Correct answer\nC\n### Rationale (2–4 sentences)\nThis presentation is severe acute cholangitis with shock and organ dysfunction, requiring immediate resuscitation plus urgent source control via biliary drainage rather than delayed confirmatory imaging. Early decompression (ERCP preferred when feasible) is key to reversing sepsis; MRCP can be appropriate in stable, intermediate-risk cases but should not delay drainage in unstable patients.\n\n## Second ABIM Style Case (Pitfall Variant)\n### Stem\nA 59-year-old woman is admitted for right upper quadrant pain and vomiting. She is afebrile, BP 128/74 mmHg, HR 92/min. Labs show AST 210 U/L, ALT 260 U/L, alkaline phosphatase 190 U/L, and total bilirubin 2.8 mg/dL. RUQ ultrasound shows gallstones and a common bile duct diameter of 7 mm; no stone is visualized. She has a history of post-ERCP pancreatitis.\n### Options\nA. Proceed directly to ERCP tonight for suspected choledocholithiasis \nB. Obtain MRCP or EUS to confirm choledocholithiasis before ERCP \nC. Give antibiotics and schedule cholecystectomy only; no further biliary evaluation is needed \nD. Start heparin infusion for presumed hepatic vein thrombosis \nE. Administer tPA for presumed biliary obstruction\n### Correct answer\nB\n### Rationale (2–4 sentences)\nThis is intermediate-risk suspected choledocholithiasis (abnormal liver tests and mildly dilated CBD without high-risk criteria), where noninvasive confirmation with MRCP or EUS is preferred to avoid unnecessary ERCP. The pitfall is overusing diagnostic ERCP—especially important here given prior post-ERCP pancreatitis risk.\nWhat changed the decision here?\n\n## Check Yourself Micro Questions (3–5 items)\n- Q: In suspected cholangitis with shock, should you wait for MRCP before calling GI for drainage? \n A: No. Urgent biliary decompression should not be delayed for confirmatory imaging in unstable patients.\n- Q: What bilirubin threshold plus CBD dilation places a patient in a high-risk group that generally warrants ERCP without further confirmatory testing? \n A: Total bilirubin **>4 mg/dL** with a dilated CBD on imaging.\n- Q: In biliary pancreatitis, when is ERCP indicated within 24 hours? \n A: When acute pancreatitis is complicated by cholangitis.\n- Q: First-line imaging test for suspected acute cholecystitis on the ward? \n A: Right upper quadrant ultrasound.\n\n## Guidelines & Key References (3–5 bullets)\n- Tokyo Guidelines 2018 (TG18): management bundles and diagnostic/severity criteria for acute cholangitis/cholecystitis — http://www.jshbps.jp/modules/en/index.php?content_id=47\n- ASGE Guideline 2019: endoscopic evaluation/management of choledocholithiasis (risk stratification; EUS vs MRCP; ERCP indications) — https://www.asge.org/docs/default-source/guidelines/asge-guideline-on-the-role-of-endoscopy-in-the-evaluation-and-management-of-choledocholithiasis-2019-june-gie.pdf\n- American College of Gastroenterology (ACG) Guideline 2024: Management of Acute Pancreatitis (ERCP timing in biliary pancreatitis; early management) — https://www.giboardreview.com/wp-content/uploads/2024/04/ACG-guideline-acute-pancreatitis-Mch-2024.pdf\n- IDSA Guideline Update 2024 (Part 1): complicated intra-abdominal infections (imaging, microbiology; includes cholecystitis/cholangitis considerations) — https://www.idsociety.org/practice-guideline/intra-abdominal-infections/\n\n## CDI: What to Document Clearly Tonight (3–5 bullets; NO prose)\n- Acute cholangitis, {mild|moderate|severe} due to {choledocholithiasis|biliary stricture|stent occlusion}; organ dysfunction: {shock/vasopressors, AKI, AMS, hypoxemia}; evidence: {bilirubin, ALP, imaging obstruction}; treatment: {IV antibiotics, fluids, GI consult for ERCP}\n- Sepsis due to biliary source with {lactate value} and {MAP/BP}, {vasopressor use yes/no}; cultures obtained {yes/no}; response to fluids {improved/not improved}\n- Acute cholecystitis, {calculous|acalculous}; severity/complication: {gangrenous|emphysematous|perforation suspected}; evidence: {US findings, WBC, fever}; treatment: {IV antibiotics, surgery consult, drainage considered}\n- Choledocholithiasis with obstructive jaundice without cholangitis; evidence: {bilirubin trend, CBD diameter, stone seen yes/no}; plan: {MRCP/EUS vs ERCP}; risk factors/contraindications: {anticoagulation, prior post-ERCP pancreatitis}\n- Acute biliary pancreatitis with severity features {SIRS/organ failure yes/no}; evidence: {lipase ≥3× ULN, imaging, LFT pattern}; interventions: {LR resuscitation, NPO/feeding plan, ERCP indication yes/no, same-admission cholecystectomy plan}\n", "acute-hepatitis.md": "---\nfilename: acute-hepatitis.md\nid: acute-hepatitis\ntitle: Acute hepatitis\nslug: acute-hepatitis\ntags: [hepatology, inpatient, night-float]\nlevel: resident\nestimated_time_min: 15\nversion: 2026-02-22\nsource: IM_NightFloat_Engine\n---\n# Acute hepatitis\n\n## Panic Card (3–6 bullets)\n- ABCs + vitals; check bedside glucose now and treat hypoglycemia with **dextrose to goal glucose ≥4.0 mmol/L (≥70 mg/dL)**.\n- Stat labs: CMP, AST/ALT, bilirubin, INR/PT, CBC, lactate, VBG/ABG if ill; send **acetaminophen level** and start **N-acetylcysteine now** if any uncertainty/possible ingestion or acute liver failure concern. \n- If any encephalopathy or confusion: protect airway as needed; start hepatic encephalopathy therapy (e.g., **lactulose titrate to 3–4 soft stools/day**) and call ICU early. \n- Identify and stop hepatotoxins immediately: hold acetaminophen, statins, valproate, isoniazid, amiodarone, herbal/supplements until clarified.\n- If acute liver failure suspected (no known cirrhosis + **INR ≥1.5** + any encephalopathy): urgent transfer/early transplant-center discussion; frequent neuro checks; avoid sedation unless airway needed. \n\n## Brief Overview (450–700 words total; bulleted; 12–20 bullets)\n- Acute hepatitis on nights is a pattern, not a single diagnosis: new **AST/ALT elevation** (often **>10× ULN**), with/without jaundice, requires rapid triage into (1) toxin/drug (especially acetaminophen), (2) ischemic/hypoxic hepatitis, (3) acute viral hepatitis, (4) autoimmune hepatitis, (5) biliary obstruction/cholangitis masquerading as “hepatitis,” and (6) evolving acute liver failure. \n- **Guideline Must Know:** Acute liver failure (ALF) is defined by acute liver injury with **INR ≥1.5** and **any encephalopathy** in a patient without known preexisting cirrhosis (typically illness **<26 weeks**); treat as ICU-level disease until proven otherwise. \n- Separate “do now” vs “can wait”: do now = stabilize, rule out acetaminophen, assess for ALF/encephalopathy, identify biliary obstruction/sepsis, stop hepatotoxins; can wait (hours) = expanded viral/autoimmune workup if patient stable and ALF excluded.\n- **Guideline Must Know:** If ALF is possible, start **N-acetylcysteine** early even without a confirmed acetaminophen history; benefit extends to many non–acetaminophen ALF etiologies and delays worsen outcomes. \n- History elements that change management tonight: exact timing of symptoms, recent meds (especially acetaminophen combination products), herbal/supplements, alcohol and cocaine, recent hypotension/sepsis, new heart failure, recent travel/foodborne exposure, sick contacts, sexual exposures, injection drug use, and immunosuppression.\n- Pattern recognition: ischemic hepatitis often has **very high AST/ALT (often thousands)** with a clear hypoperfusion event and rapid early downtrend if perfusion restored; cholangitis is suggested by fever, RUQ pain, jaundice, and hypotension; acetaminophen can present with marked aminotransferases and relatively low bilirubin early.\n- **Guideline Must Know:** In ALF, prioritize intensive monitoring and early transplant-center involvement; diagnostic workup should not delay supportive care, and neuro deterioration can be abrupt (airway protection and ICU escalation are time-critical). \n- Labs to send early (don’t wait for day team if ill): INR/PT, fibrinogen, ammonia (contextual), lactate, phosphate, VBG/ABG, hepatitis serologies (HAV IgM, HBV panel, HCV Ab with reflex RNA), autoimmune markers (ANA, SMA, IgG), pregnancy test when relevant, and toxicology screen if concern.\n- Imaging priorities: RUQ ultrasound with Doppler to assess biliary dilation and hepatic/portal vein flow; if RUQ pain/fever and ultrasound equivocal, consider cross-sectional imaging and urgent GI consult for possible ERCP if cholangitis suspected.\n- **Guideline Must Know:** Hepatitis A is self-limited and does not become chronic; management is supportive, but severe cases may require hospitalization, and exposed susceptible contacts may need vaccine and/or immune globulin **within 2 weeks** of exposure. \n- **Guideline Must Know:** For HCV testing strategy, use HCV antibody with confirmatory/reflex RNA; guidance is updated frequently and emphasizes linkage to care and streamlined evaluation. \n- **Guideline Must Know:** Acute liver failure guidelines emphasize rapid etiologic evaluation including viral hepatitis A–E and autoimmune markers, while simultaneously treating likely causes (e.g., NAC) and preventing complications (hypoglycemia, cerebral edema, infection). \n- Coagulopathy pearl: elevated INR in acute hepatitis reflects impaired hepatic synthesis; do not “correct” INR solely to normalize labs—give vitamin K if cholestasis/malnutrition suspected, and use plasma products only for active bleeding or procedures (coordinate with ICU/hepatology).\n- “Call now” scenarios beyond ALF: suspected ascending cholangitis, GI bleed with liver dysfunction, severe sepsis with ischemic hepatitis, acute HBV with severe disease features, or suspected autoimmune hepatitis with rapidly worsening bilirubin/INR.\n- Night-float pitfall: anchoring on “viral hepatitis” and missing biliary obstruction or acetaminophen—always check acetaminophen level and obtain RUQ imaging when bilirubin/ALP or symptoms suggest obstruction; stop all nonessential hepatotoxins early. \n\n## Top ICU/Consult Triggers (3–5 bullets)\n- Any encephalopathy or new confusion with hepatic injury plus **INR ≥1.5** (suspected acute liver failure) or rapidly rising INR. \n- Hemodynamic instability (need for vasopressors), lactate elevation with suspected hypoperfusion/ischemic hepatitis, or worsening acidosis despite resuscitation. \n- Hypoglycemia requiring continuous dextrose infusion, recurrent seizures, or inability to protect airway.\n- Suspected ascending cholangitis (fever/RUQ pain/jaundice plus hypotension or altered mentation) requiring urgent GI/ERCP pathway.\n\n## Orders to Place Now (3–6 bullets)\n- Order: Comprehensive metabolic panel — {now; repeat in 6–8 h if unstable}\n- Order: PT/INR and aPTT — {now; repeat in 6–8 h if unstable}\n- Order: Acetaminophen level — {stat; repeat in 4 h if time of ingestion unclear}\n- Order: Acute hepatitis panel — {HAV IgM; HBV HBsAg + anti-HBc IgM; HCV Ab with reflex RNA}\n- Order: RUQ ultrasound with Doppler — {indication: acute hepatitis vs obstruction; include CBD size and hepatic/portal vein flow}\n\n## ABIM Style Question 1\n### Stem\nA 46-year-old man is admitted for nausea and malaise. Labs show AST 3200 U/L, ALT 4100 U/L, total bilirubin 1.8 mg/dL, INR 2.0. He is sleepy but arousable and answers slowly. He denies alcohol use and is unsure which “cold medicines” he took. Vitals are stable and oxygenation is normal. What is the most appropriate next step tonight?\n\n### Options\nA. Start N-acetylcysteine and consult ICU/transplant center for possible acute liver failure\nB. Give intravenous vitamin K and recheck INR in the morning before doing anything else\nC. Start prednisone for presumed autoimmune hepatitis and defer other testing\nD. Obtain hepatitis serologies and wait for results before initiating treatment\nE. Discharge with outpatient follow-up because bilirubin is only mildly elevated\n\n### Correct answer\nA\n\n### Rationale (2–4 sentences)\nThis patient meets criteria for suspected acute liver failure (hepatic injury with **INR ≥1.5** and encephalopathy) and requires urgent escalation plus early therapy for potentiall
